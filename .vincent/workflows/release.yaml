# release — cut a vincent release, end to end, from a maintainer's machine.
#
# The release itself is CI's: Release Please owns the version, changelog, tag
# and GitHub release; the tag it creates triggers
# `.github/workflows/release.yml`, where GoReleaser builds, signs, attests and
# uploads the artifacts and updates Homebrew, Scoop and WinGet. Nothing here
# builds a published artifact and nothing here pushes a tag.
#
# What this workflow adds is the part RELEASING.md leaves to a person: proving
# the tag will land on a green, buildable tree *before* the one-way door, then
# opening that door once and watching what comes out.
#
#   preflight → audit → changelog → vuln → dry-run → verify-base
#            → notes-review → review (the gate) → merge → publish → verify
#            → winget → report
#
# The gate at `review` is the release decision. Everything before it is
# read-only apart from dispatching a dry run; `merge` — the step right after
# it — merges the Release Please PR, and that merge is what publishes. A tag
# is never re-pointed (RELEASING.md § If a release goes wrong), so `merge`,
# `publish` and `verify` all run with `max_retries: 0`: a replayed publish is
# not a safe replay, and an ambiguous failure is a reason to look at the remote
# before touching anything, not to try again.
#
# Credentials: this workflow never reads or prints a secret. It needs `gh`
# already authenticated with push access to this repository, and it *reports*
# whether the four release secrets exist by name (`gh secret list` shows names,
# never values). The publishing credentials themselves live only in GitHub
# Actions.
#
# This workflow is specific to **this** repository: it knows the `ci` and
# `gates` check names, the `Release` workflow file and its `dry_run` input, the
# six build targets and `archives.files` from `.goreleaser.yaml`, the
# `lezli01/homebrew-tap`, `lezli01/scoop-bucket` and `lezli01/winget-pkgs`
# destinations, `go run mage.go vuln`, the assertions release.yml's `smoke`
# job makes about the binary, the shape of a Release Please changelog entry
# against a curated one, `site-changelog.md` as the hand-maintained page
# published at `/changelog.html`, and `_config.yml`'s exclude list as the
# boundary of what GitHub Pages runs Liquid over.
#
# POSIX-only, and it says so: every command step pins `shell: sh`, and the
# agent step's `check` runs under the platform default and is written in `sh`
# regardless (§8.2 rejects `shell` on an agent step).
#
# Saying what is happening: this workflow spends most of its wall clock
# waiting — a 60-minute dry run, a 75-minute wait for two green matrices, a
# 90-minute wait for Release Please and GoReleaser — and a `running` row with
# no other output for an hour is unreadable. Every step that runs a process
# reports through `vincent status` (§5.4), which the board shows live in its
# STATUS column and keeps on the finished attempt. Command steps call it
# through a `say` helper defined at the top of each script:
#
#     say() { vincent status -- "$*" >/dev/null 2>&1 || true; }
#
# Guarded twice on purpose. `--` keeps a message that happens to start with a
# dash out of cobra's flag parser, and `>/dev/null 2>&1 || true` makes a status
# write incapable of failing a step: a `vincent` that is not on the daemon's
# PATH, or a step that has already finished (the daemon answers 409), would
# otherwise abort a `set -e` script — and in a poll loop it would print one
# line of noise per iteration. The cost is that the messages are silently
# dropped rather than explained when `vincent` cannot be found; check the
# STATUS column is populated on a first run.
#
# Set *before* the thing it names, which under `set -e` is what makes it an
# error message too: the step dies at the failing command and the status still
# says what was being attempted. `audit` hangs its message on the `section`
# function it already had, so the board follows the audit section by section.
# The steps after the one-way door say what they are waiting for and never
# claim an effect they have not read back: `merge` says "merging", and
# `verify` is what says a release is actually on Homebrew.
#
# Requires: `gh` (authenticated), `git`, `go`, `jq`, `awk`, `tar`, and a sha256
# tool (`sha256sum` or `shasum`).
name: release
description: Cut the release — audit, dry-run, review the notes, merge the Release Please PR, then verify every channel.

platforms: [posix]

fields:
  - name: dry-run
    label: Dry-run the Release workflow first
    description: >-
      RELEASING.md step 4. Set true whenever .goreleaser.yaml, the build tags or
      the archive contents changed since the last tag — it dispatches Release
      with dry_run and watches the whole three-OS smoke matrix, which costs
      ~20-40 minutes of CI. false skips that leg.
    type: boolean
    required: true

defaults:
  agent: claude
  max_retries: 1
  timeout: 30m
  # The human checkpoint is the `review` gate. An agent parking the task in
  # `awaiting_input` would add a second one nobody is watching for.
  on_input: deny

steps:
  - id: preflight
    name: Find the Release Please PR
    type: command
    shell: sh
    timeout: 10m
    # A missing tool, an unauthenticated gh or an absent release PR is not
    # transient — fix the world and re-run the step.
    max_retries: 0
    run: |
      set -e
      say() { vincent status -- "$*" >/dev/null 2>&1 || true; }

      # Every refusal in this step says which one it was. They all exit 1 and
      # all classify `nonzero_exit`, and "a tool is missing", "gh is logged
      # out" and "there is no release to cut" are three different things for a
      # maintainer to go and do.
      say "checking the tools and the repository layout"
      for tool in gh git go jq awk tar; do
        command -v "$tool" >/dev/null 2>&1 || { say "$tool is not installed"; echo "$tool is required" >&2; exit 1; }
      done
      gh auth status >/dev/null 2>&1 || { say "gh is not authenticated"; echo "gh is not authenticated" >&2; exit 1; }

      for file in release-please-config.json .release-please-manifest.json \
        .github/workflows/release-please.yml .github/workflows/release.yml \
        .goreleaser.yaml RELEASING.md; do
        [ -f "$file" ] || { say "missing $file"; echo "missing $file" >&2; exit 1; }
      done

      old=$(jq -er '."."' .release-please-manifest.json)
      case "$old" in
        [0-9]*.[0-9]*.[0-9]*) ;;
        *) say "manifest version is not semver: $old"; echo "manifest version is not semver: $old" >&2; exit 1 ;;
      esac

      say "looking for the Release Please PR"
      repo=$(gh repo view --json nameWithOwner --jq .nameWithOwner)

      # There is exactly one releasable pull request and Release Please owns
      # it. No PR means no release to cut: land a releasable Conventional
      # Commit, or run the Release Please workflow, then re-run this step.
      pr=$(gh pr list \
        --base "$VINCENT_BASE_BRANCH" \
        --state open \
        --label "autorelease: pending" \
        --json number,title,url,headRefName,headRefOid \
        --jq '.[0] // empty')
      [ -n "$pr" ] || {
        say "no open Release Please PR: nothing to release"
        echo "no open Release Please PR targets $VINCENT_BASE_BRANCH" >&2
        echo "push a releasable Conventional Commit or run the Release Please workflow" >&2
        exit 1
      }

      mkdir -p .vincent-release
      printf '%s\n' "$old" > .vincent-release/old-version.txt
      printf '%s\n' "$repo" > .vincent-release/repo.txt
      printf '%s\n' "$pr" > .vincent-release/pr.json

      number=$(printf '%s' "$pr" | jq -r .number)
      title=$(printf '%s' "$pr" | jq -r .title)

      # Release Please titles its PR "chore(master): release X.Y.Z". The
      # version is advisory here — the manifest on the base branch is what
      # `publish` actually waits for — but it names the release in every
      # message a human reads, including the gate.
      proposed=$(printf '%s' "$title" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?' | head -n 1 || true)
      printf '%s\n' "$proposed" > .vincent-release/proposed-version.txt
      if [ -n "$proposed" ] && git ls-remote --exit-code --tags origin "refs/tags/v$proposed" >/dev/null 2>&1; then
        say "v$proposed is already tagged on origin: that release is already cut"
        echo "tag v$proposed already exists on origin — that release is already cut, and a published tag is never re-pointed (RELEASING.md)" >&2
        exit 1
      fi

      # Written once, called twice: advisory inside `audit`, blocking in
      # `verify-base`. One script, two callers, no drift.
      #
      # It reports its own progress. `vincent status` addresses the step from
      # `VINCENT_TASK_ID` / `VINCENT_STEP_ID`, which a child process inherits,
      # so this script speaks as whichever step invoked it — which is what is
      # wanted: the 45-minute wait in `verify-base` is the thing a person is
      # watching, and it happens entirely inside here.
      cat > .vincent-release/require-green.sh <<'GREEN'
      # Usage: sh require-green.sh <sha> [wait-minutes]. Exit 0 iff every check
      # run on the commit completed successfully and both required matrices are
      # present. A commit with *no* checks yet passes the per-run rule
      # trivially, which is why the count matters as much as the conclusions.
      #
      # Pending is not failure. Task 52 spent three of its seven `verify-base`
      # attempts, and two repair agents, on a base branch whose checks had
      # simply not finished — Windows CI alone took 11m54s. So a run still in
      # flight is waited on, up to the caller's bound, and only a *completed*
      # non-success is reported. The bound is a number of minutes so a caller
      # that wants a snapshot passes 0.
      set -e
      say() { vincent status -- "$*" >/dev/null 2>&1 || true; }
      sha="$1"
      wait_min=${2:-0}
      short=$(printf '%s' "$sha" | cut -c1-7)
      deadline=$(( $(date +%s) + wait_min * 60 ))

      # One paced sleep, shared by the "still pending" and "the API blipped"
      # paths so a wait that hits both does not restart its ramp. 15s doubling
      # to a 60s ceiling: CI here is a three-OS matrix measured in minutes —
      # task 52 saw Windows alone take 11m54s — so a fixed 30s spent most of
      # the wait re-asking a question whose answer had not changed.
      nap=15
      pace() {
        sleep "$nap"
        if [ "$nap" -lt 60 ]; then
          nap=$(( nap * 2 ))
          if [ "$nap" -gt 60 ]; then nap=60; fi
        fi
      }

      # `gh api` failing is not a verdict about the commit. Assigning it
      # unguarded under `set -e` meant a single 502 aborted the whole wait —
      # `verify-base` gives this 75 minutes and runs with `max_retries: 0`, so
      # that blip threw away everything already waited and blocked the release.
      # Five consecutive failures are tolerated; the sixth is reported as
      # itself, rather than as an empty run list that the count check below
      # would have called "expected 3 'ci' checks, found 0".
      errors=0
      while :; do
        set +e
        runs=$(gh api "repos/{owner}/{repo}/commits/$sha/check-runs?per_page=100" \
          --jq '.check_runs[] | [.name, .status, (.conclusion // "pending"), (.html_url // "-")] | @tsv' 2>/dev/null)
        rc=$?
        set -e

        if [ "$rc" -ne 0 ]; then
          errors=$(( errors + 1 ))
          if [ "$errors" -gt 5 ]; then
            echo "the GitHub API failed six times in a row reading the check runs for $sha" >&2
            exit 1
          fi
          now=$(date +%s)
          if [ "$now" -ge "$deadline" ]; then
            echo "could not read the check runs for $sha: the API failed on the last attempt" >&2
            exit 1
          fi
          say "GitHub API failed reading checks for $short ($errors/5), retrying"
          echo "the GitHub API failed reading check runs for $sha; retrying in ${nap}s" >&2
          pace
          continue
        fi
        errors=0

        pending=$(printf '%s\n' "$runs" | awk -F'\t' 'NF && $2 != "completed" { print $1 }')
        if [ -z "$pending" ]; then break; fi
        now=$(date +%s)
        if [ "$now" -ge "$deadline" ]; then break; fi
        # The live line for the long wait. It names the checks rather than
        # counting them: on this repository a three-OS matrix means the one
        # that is still running is the interesting fact, and Windows CI alone
        # took 11m54s in task 52. Truncation at 256 bytes handles a long list.
        say "$short: waiting on $(printf '%s\n' "$pending" | tr '\n' ' ')"
        echo "waiting on $(printf '%s\n' "$pending" | wc -l | tr -d ' ') pending check(s) on $sha: $(printf '%s\n' "$pending" | tr '\n' ' ')" >&2
        pace
      done

      printf '%s\n' "$runs" | awk -F'\t' 'NF { print $1 "\t" $2 "\t" $3 }'

      if [ -n "$pending" ]; then
        say "$short still has pending checks after ${wait_min}m"
        echo "still pending on $sha after ${wait_min}m:" >&2
        printf '%s\n' "$pending" >&2
        exit 1
      fi

      # Report the URL alongside the name. A check called `build` says nothing
      # about which workflow owns it — in task 52 that one word cost a repair
      # agent to resolve to Jekyll's pages-build-deployment.
      bad=$(printf '%s\n' "$runs" | awk -F'\t' 'NF && $3 != "success" && $3 != "skipped" { print $1 " " $3 " " $4 }')
      if [ -n "$bad" ]; then
        say "not green on $short: $(printf '%s\n' "$runs" | awk -F'\t' 'NF && $3 != "success" && $3 != "skipped" { printf "%s (%s); ", $1, $3 }')"
        echo "not green on $sha:" >&2
        printf '%s\n' "$bad" >&2
        exit 1
      fi
      for job in ci gates; do
        n=$(printf '%s\n' "$runs" | awk -F'\t' -v j="$job" 'index($1, j " (") == 1' | wc -l | tr -d ' ')
        if [ "$n" -ne 3 ]; then
          say "expected 3 '$job' checks on $short, found $n"
          echo "expected 3 '$job' checks on $sha (ubuntu, macos, windows), found $n" >&2
          exit 1
        fi
      done
      GREEN

      git fetch --quiet --tags origin "$VINCENT_BASE_BRANCH"
      say "release PR #$number found: ${proposed:-version unknown}"

      echo "repository:   $repo"
      echo "last release: v$old"
      echo "proposed:     ${proposed:-unknown (could not parse the PR title)}"
      echo "release PR:   $title — $(printf '%s' "$pr" | jq -r .url)"
      echo
      echo "current checks on the release PR:"
      gh pr checks "$number" || true

  - id: audit
    name: Audit what a tag would build
    type: command
    shell: sh
    # Six cross-compilations, a host build and a handful of API calls.
    timeout: 20m
    # Re-running the same audit on the same tree returns the same findings.
    max_retries: 0
    # Blocking, unlike its ancestor in the retired prepare-release workflow:
    # there is no agent here to fix findings, so a FAIL blocks the task, a
    # human fixes the cause on a branch, and this step is retried.
    #
    #   FAIL — blocks a release and is fixable in this repository.
    #   WARN — real, and not something this tree can fix (a missing secret, an
    #          unreachable destination, a base branch that is not green yet).
    #          Carried to the `review` gate for a human to deal with.
    #
    # Deliberately not `set -e`: an audit that stops at the first problem makes
    # a human run it once per problem. Every check runs; the exit code is the
    # summary.
    #
    # The status hangs off `section`, which this step already had: eleven
    # sections over twenty minutes, and the board now follows them one at a
    # time rather than showing `running` for the whole cross-compile. It costs
    # one line of the existing helper, and because the message is set *as* a
    # section opens, a step killed on its timeout says which section it died
    # in. `fail` reports the running count for the same reason — the summary
    # line only exists once the last section has run.
    run: |
      fails=0
      mark=0
      fail() { printf 'FAIL %s\n' "$*"; fails=$((fails + 1)); say "$fails blocking finding(s) so far: ${current}"; }
      warn() { printf 'WARN %s\n' "$*"; }
      say() { vincent status -- "$*" >/dev/null 2>&1 || true; }
      current=""
      section() { echo "== $1"; mark=$fails; current=$1; say "auditing $1"; }
      passed() { [ "$fails" -eq "$mark" ]; }

      work=.vincent-release/work
      rm -rf "$work"
      mkdir -p "$work"

      section "worktree vintage"
      # This task's worktree was branched from the base at creation time, so
      # the build checks below test that snapshot. The tree that actually gets
      # tagged is the base branch tip plus Release Please's release commit —
      # which is why this is a WARN and why the authoritative proofs are the
      # dry run (dispatched on the base ref) and `verify-base`.
      behind=$(git rev-list --count "HEAD..origin/$VINCENT_BASE_BRANCH" 2>/dev/null || echo "?")
      if [ "$behind" = "0" ]; then
        echo "ok    this worktree is at the tip of origin/$VINCENT_BASE_BRANCH"
      else
        warn "vintage: this worktree is $behind commit(s) behind origin/$VINCENT_BASE_BRANCH, so the build checks below test a slightly older tree than the one that will be tagged"
      fi

      section "archive payload (.goreleaser.yaml archives.files)"
      for f in README.md LICENSE .goreleaser.yaml cmd/vincent; do
        [ -e "$f" ] || fail "payload: $f is missing"
      done
      # `examples/*.yaml` is an archive glob: an empty match ships an archive
      # with no examples and nothing fails until a user looks.
      n=$(ls examples/*.yaml 2>/dev/null | wc -l | tr -d ' ')
      [ "$n" -gt 0 ] || fail "payload: examples/*.yaml matches nothing, so the archives would ship no examples"
      # release.yml's smoke job names this file literally; renaming it breaks
      # every published archive's smoke test and nothing before it.
      [ -f examples/cursor-review.yaml ] || fail "payload: examples/cursor-review.yaml is missing, and release.yml's smoke job runs 'workflow validate' on exactly that path"
      passed && echo "ok    README.md, LICENSE and $n example workflow(s)"

      section "module (goreleaser's before hook)"
      go mod download >"$work/mod.log" 2>&1 || fail "module: 'go mod download' failed: $(head -n 3 "$work/mod.log" | tr '\n' ' ')"
      go mod verify >>"$work/mod.log" 2>&1 || fail "module: 'go mod verify' failed: $(tail -n 3 "$work/mod.log" | tr '\n' ' ')"
      passed && echo "ok    go mod download, go mod verify"

      section "cross-compile (the six targets .goreleaser.yaml builds)"
      for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
        goos=${t%/*}
        goarch=${t#*/}
        if CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -trimpath \
             -o "$work/vincent-$goos-$goarch" ./cmd/vincent >"$work/build.log" 2>&1; then
          echo "ok    $t"
        else
          fail "build: $t does not compile: $(head -n 3 "$work/build.log" | tr '\n' ' ')"
        fi
      done

      section "smoke contract (what release.yml asserts about the binary)"
      probe=v0.0.0-audit
      if go build -trimpath \
           -ldflags "-s -w -X github.com/lezli01/vincent/internal/version.version=$probe" \
           -o "$work/vincent" ./cmd/vincent >"$work/probe.log" 2>&1; then
        # smoke asserts `vincent version` reports the tag rather than "dev". It
        # can only do that if this ldflags path still names a real symbol — a
        # moved package or renamed variable leaves the flag silently inert.
        if ! "$work/vincent" version 2>&1 | grep -q "$probe"; then
          fail "smoke: the version ldflags path no longer reaches internal/version.version, so a released binary would report 'dev' and release.yml's smoke job would fail on the tag"
        fi
        "$work/vincent" workflow validate examples/cursor-review.yaml >"$work/validate.log" 2>&1 \
          || fail "smoke: 'workflow validate examples/cursor-review.yaml' failed: $(tail -n 3 "$work/validate.log" | tr '\n' ' ')"
        # smoke requires exit 2 — "no daemon answered" — with no daemon
        # running. Isolated dirs are what make that true on a maintainer's
        # machine, where a daemon usually *is* running (this one).
        VINCENT_CONFIG_DIR="$work/isolated/config" VINCENT_DATA_DIR="$work/isolated/data" \
          "$work/vincent" task ls >/dev/null 2>&1
        code=$?
        [ "$code" -eq 2 ] || fail "smoke: 'task ls' with no daemon exited $code, and release.yml's smoke job requires 2"
      else
        fail "smoke: the host build failed: $(head -n 3 "$work/probe.log" | tr '\n' ' ')"
      fi
      passed && echo "ok    version reports the injected tag, 'workflow validate' runs, 'task ls' exits 2 with no daemon"

      section "pinned actions in the release workflows"
      # A pin that no longer resolves fails the release run at step setup —
      # after the tag is public. `commits/{ref}` accepts a SHA or a tag, so one
      # call covers both the SHA-pinned third-party actions and the major-tag
      # `actions/*` ones.
      grep -Eho 'uses: [A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+@[A-Za-z0-9_.-]+' \
        .github/workflows/release.yml .github/workflows/release-please.yml \
        | awk '{print $2}' | sort -u > "$work/uses.txt"
      while IFS= read -r u; do
        [ -n "$u" ] || continue
        repo=${u%@*}
        ref=${u#*@}
        if gh api "repos/$repo/commits/$ref" --jq .sha >/dev/null 2>&1; then
          echo "ok    $u"
        else
          fail "action: $u does not resolve — the Release run cannot start with a dangling pin"
        fi
      done < "$work/uses.txt"

      section "Release Please inputs"
      if jq -e '."." | type == "string"' .release-please-manifest.json >/dev/null 2>&1 \
        && jq -e '.packages."." and ."release-type" == "go"' release-please-config.json >/dev/null 2>&1; then
        echo "ok    Release Please manifest and root Go package are configured"
      else
        fail "release-please: manifest or root Go package configuration is invalid"
      fi

      section "publish-time credentials (names only; values are never read)"
      if gh secret list >/dev/null 2>&1; then
        for secret in RELEASE_PLEASE_TOKEN HOMEBREW_TAP_TOKEN SCOOP_BUCKET_TOKEN WINGET_TOKEN; do
          if gh secret list | awk '{print $1}' | grep -qx "$secret"; then
            echo "ok    $secret is set on this repository"
          else
            warn "secret: $secret is not set — the channel it publishes will fail after the tag exists (RELEASING.md § Repository secrets)"
          fi
        done
      else
        warn "secret: this token cannot read repository secret names; release credentials unverified"
      fi

      section "publish destinations"
      # A destination that does not exist is discovered by GoReleaser *after*
      # the GitHub release is already public (RELEASING.md § Channel bootstrap).
      for dest in lezli01/homebrew-tap lezli01/scoop-bucket lezli01/winget-pkgs; do
        if gh api "repos/$dest" --jq .full_name >/dev/null 2>&1; then
          echo "ok    $dest is reachable"
        else
          warn "destination: $dest is not reachable with this token — a stable tag publishes into it"
        fi
      done

      section "Liquid safety of the published documentation"
      # GitHub Pages runs Liquid over every included page *before* Markdown, so
      # backticks protect nothing, and `jekyll-optional-front-matter` means
      # every tracked .md outside _config.yml's exclude list is a page. Two
      # distinct faults follow, and task 52 hit both: an unterminated open
      # brace pair is a Liquid exception that fails pages-build-deployment, and
      # a *balanced* Go template renders to nothing, silently blanking the cell
      # it documents.
      #
      # The brace pair this looks for is assembled at run time rather than
      # written out, because a step body is itself a Go template (§8.4) and a
      # literal pair here would be parsed as an action rather than searched
      # for. Same reason the messages below interpolate `$open`.
      #
      # This is here because the first one is a release problem. A red
      # pages-build-deployment is a red base branch, and `verify-base` refuses
      # to publish over it — in task 52 that surfaced 40 minutes in, as a check
      # called only `build`, and cost two repair agents to trace back to a
      # single brace in docs/reference/api.md. Catching it on this worktree
      # costs a second.
      open=$(printf '%s%s' '{' '{')
      close=$(printf '%s%s' '}' '}')
      awk 'f && /^[^ -]/ { f=0 } f && /^[[:space:]]*-[[:space:]]/ { sub(/^[[:space:]]*-[[:space:]]*/, ""); print } /^exclude:/ { f=1 }' \
        _config.yml > "$work/exclude.txt"
      : > "$work/liquid.txt"
      git ls-files '*.md' | while IFS= read -r md; do
        skip=no
        while IFS= read -r ex; do
          [ -n "$ex" ] || continue
          case "$md" in "$ex" | "$ex"*) skip=yes; break ;; esac
        done < "$work/exclude.txt"
        [ "$skip" = yes ] && continue
        # Raw markers are on their own line everywhere in this repository; a
        # marker sharing a line with content would be scanned as content.
        awk -v file="$md" -v ob="$open" -v cb="$close" '
          /{% *raw *%}/ { raw = 1; next }
          /{% *endraw *%}/ { raw = 0; next }
          raw { next }
          {
            line = $0
            p = index(line, ob)
            while (p > 0) {
              rest = substr(line, p + 2)
              q = index(rest, cb)
              if (q == 0) { print "FATAL\t" file "\t" FNR; break }
              if (substr(rest, 1, q - 1) ~ /^[ ]*\./) print "BLANK\t" file "\t" FNR
              line = substr(rest, q + 2)
              p = index(line, ob)
            }
          }
        ' "$md"
      done >> "$work/liquid.txt"
      nf=$(awk -F'\t' '$1 == "FATAL"' "$work/liquid.txt" | wc -l | tr -d ' ')
      nb=$(awk -F'\t' '$1 == "BLANK"' "$work/liquid.txt" | wc -l | tr -d ' ')
      if [ "$nf" -gt 0 ]; then
        awk -F'\t' '$1 == "FATAL" { print "      " $2 ":" $3 }' "$work/liquid.txt"
        fail "liquid: $nf unterminated $open outside a raw block — Jekyll raises a Liquid exception, pages-build-deployment goes red, and a red base branch blocks this release at verify-base"
      fi
      if [ "$nb" -gt 0 ]; then
        awk -F'\t' '$1 == "BLANK" { print "      " $2 ":" $3 }' "$work/liquid.txt"
        warn "liquid: $nb Go-template expression(s) outside a raw block render to nothing on the published site — wrap the page in {% raw %} / {% endraw %}"
      fi
      [ "$nf" -eq 0 ] && [ "$nb" -eq 0 ] && echo "ok    every published markdown page is Liquid-safe"

      section "base branch"
      base_sha=$(git rev-parse "origin/$VINCENT_BASE_BRANCH" 2>/dev/null || echo "")
      if [ -z "$base_sha" ]; then
        warn "base: origin/$VINCENT_BASE_BRANCH could not be resolved"
      elif sh .vincent-release/require-green.sh "$base_sha" >"$work/green.log" 2>&1; then
        echo "ok    $VINCENT_BASE_BRANCH is green at $base_sha"
      else
        # Advisory here, blocking in `verify-base`: CI may still be running,
        # and "not green yet" at audit time is a fact to report rather than a
        # reason to refuse to look further. `NF == 1` keeps require-green's
        # messages and drops its tab-separated check-run table.
        warn "base: $VINCENT_BASE_BRANCH is not green at $base_sha: $(awk -F'\t' 'NF == 1' "$work/green.log" | tr '\n' ' ')"
      fi

      echo
      if [ "$fails" -gt 0 ]; then
        say "$fails blocking finding(s): a tag on this tree would not build green"
        echo "$fails blocking finding(s) — a tag on this tree would not produce a green Release run"
        exit 1
      fi
      say "no blocking findings"
      echo "no blocking findings"

  - id: changelog
    name: Check both changelogs on the release PR
    type: command
    shell: sh
    timeout: 10m
    # Reading two files and grepping them returns the same answer twice.
    max_retries: 0
    # Blocking, and early. Release Please writes `CHANGELOG.md` only, and the
    # release PR is the one moment either changelog can be corrected — after
    # the merge the entry is published (RELEASING.md step 3). 0.5.0 and 0.6.0
    # both shipped past this: 0.5.0 with a bare three-line commit list, 0.6.0
    # with its curated prose stranded under `## [Unreleased]` *below* the
    # released section, a duplicated feature from a merge commit, and a site
    # changelog that still stopped at the previous version.
    #
    # Task 52's `notes-review` agent found every one of those and the gate
    # approved through it anyway, which is the argument for spending a command
    # here rather than trusting a report: these four faults have exact shapes,
    # so they are a grep, and a grep can block.
    #
    # Deliberately not `set -e` — every check runs and the exit code is the
    # summary, the same contract `audit` uses.
    run: |
      fails=0
      fail() { printf 'FAIL %s\n' "$*"; fails=$((fails + 1)); }
      warn() { printf 'WARN %s\n' "$*"; }
      say() { vincent status -- "$*" >/dev/null 2>&1 || true; }

      work=.vincent-release/changelog
      rm -rf "$work"
      mkdir -p "$work"

      repo=$(cat .vincent-release/repo.txt)
      version=$(cat .vincent-release/proposed-version.txt)
      head=$(jq -r .headRefName .vincent-release/pr.json)

      if [ -z "$version" ]; then
        say "could not parse a version from the release PR title"
        echo "could not parse a version from the release PR title, so neither changelog can be checked" >&2
        exit 1
      fi
      echo "checking CHANGELOG.md and site-changelog.md at $head for $version"
      say "checking both changelogs at $head for $version"
      echo

      fetch() {
        gh api -H "Accept: application/vnd.github.raw+json" \
          "repos/$repo/contents/$1?ref=$head" > "$work/$2" 2>"$work/$2.err"
      }

      # == CHANGELOG.md — the file Release Please owns.
      if fetch CHANGELOG.md canonical.md; then
        # The curated prose belongs *in* the released section. Release Please
        # inserts each version directly beneath the preamble, so prose parked
        # under `## [Unreleased]` is pushed below the release it describes and
        # the released entry keeps the commit list — exactly what 0.6.0
        # shipped. The file carries no Unreleased section for that reason.
        if grep -q '^## \[Unreleased\]' "$work/canonical.md"; then
          fail "changelog: CHANGELOG.md has an '## [Unreleased]' section. Release Please writes the new version above it, so its prose lands below the release it describes and never reaches the entry. Fold it into '## [$version]' and delete the heading."
        fi

        awk -v v="[$version]" '
          index($0, "## " v) == 1 { inside = 1; next }
          inside && /^## / { exit }
          inside { print }
        ' "$work/canonical.md" > "$work/section.md"

        if [ ! -s "$work/section.md" ]; then
          fail "changelog: CHANGELOG.md has no '## [$version]' section at the PR head"
        else
          # A Release Please bullet is `* subject ([abc1234](...))`. A curated
          # one is prose. Any survivor means the swap RELEASING.md step 3 asks
          # for never happened, and it is also the only place a duplicate can
          # come from: GitHub copies a conventional PR title into the merge
          # commit body, so the merge and the commit it merged are both
          # recorded (0.6.0's retry_backoff, twice).
          left=$(grep -cE '^\* .*\(\[[0-9a-f]{7,}\]\(' "$work/section.md" || true)
          if [ "$left" -gt 0 ]; then
            grep -nE '^\* .*\(\[[0-9a-f]{7,}\]\(' "$work/section.md" | sed 's/^/      /'
            fail "changelog: $left mechanical commit line(s) survive in '## [$version]'. CHANGELOG.md's preamble makes the release PR the point where they are replaced with the context a commit subject cannot carry."
          fi

          dups=$(grep -oE '^\* [^(]+' "$work/section.md" | sed 's/[[:space:]]*$//' | sort | uniq -d)
          if [ -n "$dups" ]; then
            printf '      %s\n' "$dups"
            fail "changelog: the above subject(s) appear twice in '## [$version]' — a conventional PR title copied into its merge commit body records both the merge and its inner commit"
          fi

          [ "$left" -eq 0 ] && [ -z "$dups" ] \
            && echo "ok    CHANGELOG.md '## [$version]' is curated prose, no duplicates, no stray Unreleased"
        fi
      else
        fail "changelog: CHANGELOG.md could not be read at $head: $(head -n 2 "$work/canonical.md.err" | tr '\n' ' ')"
      fi

      # == site-changelog.md — the GitHub Pages page, maintained by hand.
      # Nothing generates it; no workflow derives it from CHANGELOG.md or from
      # the tags (RELEASING.md § Automation boundary). If it is not written in
      # this PR it is not written at all, which is how it came to stop two
      # releases behind the tags.
      if fetch site-changelog.md site.md; then
        if grep -q "^## $version" "$work/site.md"; then
          first=$(grep -m1 '^## ' "$work/site.md")
          case "$first" in
            "## $version"*) ;;
            *) warn "changelog: site-changelog.md has $version, but '$first' is above it — the page reads newest-first" ;;
          esac
          awk -v v="$version" '
            index($0, "## " v) == 1 { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' "$work/site.md" | grep -q '^Released ' \
            || warn "changelog: site-changelog.md's $version section has no 'Released <date>.' line"
          echo "ok    site-changelog.md carries a $version section"
        else
          fail "changelog: site-changelog.md has no '## $version' section. It is the changelog published at /changelog.html and linked from the site navigation, nothing generates it, and this PR is the only place it gets written."
        fi
      else
        fail "changelog: site-changelog.md could not be read at $head — it is the published changelog at /changelog.html: $(head -n 2 "$work/site.md.err" | tr '\n' ' ')"
      fi

      echo
      if [ "$fails" -gt 0 ]; then
        say "$fails changelog finding(s): fix them on $head and retry"
        echo "$fails blocking finding(s) — fix them on $head (push onto the Release Please branch) and retry this step"
        echo "RELEASING.md step 3 describes both edits"
        exit 1
      fi
      say "both changelogs describe $version"
      echo "both changelogs describe $version"

  - id: vuln
    name: Vulnerability sweep
    type: command
    shell: sh
    timeout: 20m
    # RELEASING.md step 2, unconditional. It sweeps all three GOOS values,
    # because reachability differs per platform. A few minutes is not worth the
    # judgement call about whether the last run predates a dependency change.
    #
    # `defaults.max_retries` (1) is right here — the failure this retries is
    # `govulncheck` failing to reach the vulnerability database, not a finding.
    # A finding is deterministic and the second attempt reports it again; a
    # fetch failure is not, and an immediate retry lands inside the same
    # outage. 30s is the pause that separates the two.
    retry_backoff: 30s
    # `say` before, never after: the sweep is the last command, so its exit
    # code is the step's, and the message left standing on a failure —
    # "sweeping all three GOOS values" — is the honest account of a step that
    # either found something or could not reach the database. Which of the two
    # it was is in `govulncheck`'s own output, and this deliberately does not
    # try to summarise it into one line.
    run: |
      set -e
      say() { vincent status -- "$*" >/dev/null 2>&1 || true; }

      say "govulncheck: sweeping all three GOOS values"
      go run mage.go vuln
      say "no reachable vulnerabilities"

  - id: dry-run
    name: Dry-run the Release workflow
    type: command
    shell: sh
    # RELEASING.md step 4. Skipped when the task says packaging did not change;
    # the step still shows up as `skipped` with reason `condition`, so the gate
    # can say which legs actually ran.
    if: '{{ eq (index .Task.Fields "dry-run") "true" }}'
    # Cross-compiles six archives and smoke-tests them on three OSes; the poll
    # for the run to appear is inside the same budget.
    timeout: 60m
    # Dispatching is an outward action and a retry would start a second run
    # while the first is still going. Re-running by hand is fine — it just
    # dispatches a fresh run.
    max_retries: 0
    run: |
      set -e
      say() { vincent status -- "$*" >/dev/null 2>&1 || true; }

      started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
      say "dispatching a dry run of Release on $VINCENT_BASE_BRANCH"
      gh workflow run release.yml --ref "$VINCENT_BASE_BRANCH" -f dry_run=true
      echo "dispatched a dry run of Release on $VINCENT_BASE_BRANCH"
      say "waiting for the dispatched run to appear"

      # The run takes a few seconds to appear. Match on creation time as well
      # as branch, so a dry run someone else started an hour ago is not
      # mistaken for this one.
      #
      # Paced to that: 3s doubling to a 15s ceiling, five minutes of budget
      # counted in seconds waited. A fixed 15s made the common case — the run
      # is listed almost immediately — cost a quarter of a minute for nothing.
      # `gh run list` is also guarded: an unguarded assignment under `set -e`
      # turned one 502 into "the dispatched run never appeared", which is a
      # false and expensive statement about a run that had in fact started.
      id=""
      nap=3
      waited=0
      while :; do
        set +e
        id=$(gh run list --workflow=release.yml --event=workflow_dispatch --limit 30 \
          --json databaseId,createdAt,headBranch \
          --jq "[.[] | select(.headBranch == \"$VINCENT_BASE_BRANCH\" and .createdAt >= \"$started\")] | sort_by(.createdAt) | .[0].databaseId // empty" 2>/dev/null)
        if [ $? -ne 0 ]; then id=""; fi
        set -e
        if [ -n "$id" ]; then break; fi
        if [ "$waited" -ge 300 ]; then break; fi

        sleep "$nap"
        waited=$((waited + nap))
        if [ "$nap" -lt 15 ]; then
          nap=$((nap * 2))
          if [ "$nap" -gt 15 ]; then nap=15; fi
        fi
      done
      [ -n "$id" ] || {
        say "the dispatched Release run never appeared: check Actions"
        echo "the dispatched Release run never appeared — check Actions" >&2
        exit 1
      }

      url=$(gh run view "$id" --json url --jq .url)
      printf '%s\n' "$url" > .vincent-release/dry-run-url.txt
      echo "$url"
      # The long leg: six cross-compilations and a three-OS smoke matrix,
      # measured in tens of minutes, and `gh run watch` says nothing vincent
      # can see. This one message is what the board shows for most of the hour.
      say "watching the dry run: 6 archives, smoke on 3 OSes"
      gh run watch "$id" --exit-status

      # Green means the archives built and ran. This says what is *in* them:
      # `archives.files` is a glob list, and a glob that stops matching ships a
      # smaller archive without failing anything upstream.
      say "dry run green: checking what is in the archives"
      rm -rf .vincent-release/dist
      mkdir -p .vincent-release/dist
      gh run download "$id" -n dist -D .vincent-release/dist
      cd .vincent-release/dist

      n=$(ls ./*.tar.gz ./*.zip 2>/dev/null | wc -l | tr -d ' ')
      [ "$n" -eq 6 ] || { say "expected 6 archives, found $n"; echo "expected 6 archives (3 OS x 2 arch), found $n" >&2; exit 1; }
      n=$(ls ./*.deb 2>/dev/null | wc -l | tr -d ' ')
      [ "$n" -eq 2 ] || { say "expected 2 deb packages, found $n"; echo "expected 2 deb packages, found $n" >&2; exit 1; }
      n=$(ls ./*.rpm 2>/dev/null | wc -l | tr -d ' ')
      [ "$n" -eq 2 ] || { say "expected 2 rpm packages, found $n"; echo "expected 2 rpm packages, found $n" >&2; exit 1; }

      say "verifying checksums.txt"
      if command -v sha256sum >/dev/null 2>&1; then
        sha256sum -c checksums.txt
      elif command -v shasum >/dev/null 2>&1; then
        shasum -a 256 -c checksums.txt
      else
        say "no sha256 tool found (sha256sum or shasum)"
        echo "no sha256 tool found (sha256sum or shasum)" >&2
        exit 1
      fi

      archive=$(ls ./*_linux_amd64.tar.gz)
      mkdir -p unpacked
      tar -xzf "$archive" -C unpacked
      for f in vincent README.md LICENSE examples/cursor-review.yaml; do
        [ -e "unpacked/$f" ] || {
          say "the linux_amd64 archive is missing $f"
          echo "the archive is missing $f — check archives.files in .goreleaser.yaml" >&2
          exit 1
        }
      done
      say "dry run green: 6 archives, 2 deb, 2 rpm, payload intact"

      echo
      echo "dry run green: $(cat ../dry-run-url.txt)"
      echo "the dist artifact is unpacked in .vincent-release/dist/ inside this task's worktree"
      echo "not exercised by a dry run: cosign signing, build provenance, the GitHub release, and the Homebrew/Scoop/WinGet pushes"
      ls ./*.tar.gz ./*.zip ./*.deb ./*.rpm

  - id: verify-base
    name: Verify the commit a tag would name
    type: command
    shell: sh
    # Long enough to watch a full matrix land: Windows CI alone took 11m54s in
    # task 52, and this step now waits for both the PR's checks and the base
    # branch's rather than reporting "not finished" as a failure.
    timeout: 75m
    # A failure that survives the wait means the world is genuinely not ready —
    # a red check, a new commit on the base — and there is no delay between
    # attempts, so a retry just fails a second time a second later. Re-run by
    # hand once the cause is fixed.
    max_retries: 0
    run: |
      set -e
      say() { vincent status -- "$*" >/dev/null 2>&1 || true; }

      git fetch --quiet --tags origin "$VINCENT_BASE_BRANCH"
      number=$(jq -r .number .vincent-release/pr.json)

      # Re-read the PR: Release Please rewrites it as more Conventional Commits
      # land, so the number is the only field from preflight still trustworthy.
      pr=$(gh pr view "$number" --json state,title,url,headRefOid,mergeStateStatus)
      state=$(printf '%s' "$pr" | jq -r .state)
      [ "$state" = OPEN ] || { say "release PR #$number is $state, not OPEN"; echo "release PR #$number is $state, not OPEN" >&2; exit 1; }

      title=$(printf '%s' "$pr" | jq -r .title)
      proposed=$(printf '%s' "$title" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?' | head -n 1 || true)
      printf '%s\n' "$proposed" > .vincent-release/proposed-version.txt
      printf '%s\n' "$pr" > .vincent-release/pr-view.json
      printf '%s' "$pr" | jq -r .headRefOid > .vincent-release/head-oid.txt

      # The PR's own checks. `gh pr checks` exits 8 while anything is *pending*
      # and 1 when something failed, and the bare form does not distinguish
      # "CI is still running" from "CI said no" to a human reading a blocked
      # task. `--watch` waits instead, so the exit code means one thing.
      # Three of task 52's seven attempts here were nothing but exit 8.
      echo "== release PR checks"
      # Two waits, each measured in minutes, and this step is budgeted 75 of
      # them. Without a status the board cannot say which of the two it is in,
      # and three of task 52's seven attempts here were spent in the first one.
      say "waiting on the release PR's own checks (#$number)"
      gh pr checks "$number" --watch --fail-fast --interval 30

      # And the branch it merges into: a tag on a red base produces signed,
      # attested, broken binaries (RELEASING.md step 1). Same wait, same
      # reason — and note this covers *every* check on the commit, not only
      # `ci` and `gates`: pages-build-deployment is what was red in task 52.
      sha=$(git rev-parse "origin/$VINCENT_BASE_BRANCH")
      echo
      echo "== $VINCENT_BASE_BRANCH checks"
      # require-green.sh reports its own progress from here — it inherits this
      # step's VINCENT_TASK_ID and VINCENT_STEP_ID, so its "waiting on …" lines
      # land on this row.
      say "waiting on $VINCENT_BASE_BRANCH's checks at $(printf '%s' "$sha" | cut -c1-7)"
      sh .vincent-release/require-green.sh "$sha" 45
      printf '%s\n' "$sha" > .vincent-release/base-sha.txt

      mergeable=$(printf '%s' "$pr" | jq -r .mergeStateStatus)
      case "$mergeable" in
        CLEAN|HAS_HOOKS|UNSTABLE) ;;
        *)
          say "release PR #$number is not mergeable: $mergeable"
          echo "release PR #$number is not mergeable (mergeStateStatus=$mergeable)" >&2
          exit 1
          ;;
      esac

      if [ -n "$proposed" ] && git ls-remote --exit-code --tags origin "refs/tags/v$proposed" >/dev/null 2>&1; then
        say "v$proposed appeared on origin mid-run: find out who pushed it"
        echo "tag v$proposed appeared on origin while this task was running — stop and work out who pushed it" >&2
        exit 1
      fi
      say "PR and $VINCENT_BASE_BRANCH both green; v${proposed:-?} would tag $(printf '%s' "$sha" | cut -c1-7)"

      echo
      echo "release PR:  $title — $(printf '%s' "$pr" | jq -r .url)"
      echo "PR head:     $(cat .vincent-release/head-oid.txt)"
      echo "merges into: $VINCENT_BASE_BRANCH @ $sha"
      git log -1 --format='             %H %s (%an, %ad)' --date=short "$sha"

  - id: notes-review
    name: Review the generated release notes
    type: agent
    timeout: 25m
    # One session, no retry: a second reading of the same commits and the same
    # PR body is a second opinion, not a fix. This is advisory input to the
    # gate, so a failed or unavailable agent must not block the release — the
    # human can read the PR themselves, and the gate says which happened.
    max_retries: 0
    allow_failure: true
    prompt: |
      Read the release notes Release Please generated for the next vincent
      release and report what they miss. This is a **read-only review**: make
      no commits, change no files, and run no `gh` command that writes.

      The release pull request number is in `.vincent-release/pr.json` (field
      `number`). The last released version is in
      `.vincent-release/old-version.txt`.

      Say what you are doing as you go — a person is waiting on this to reach
      the release gate:

          vincent status "<one short line about what you are doing now>"

      One before each numbered step below. Under ten words. This step runs with
      `allow_failure`, so if it fails the release still goes to the gate with
      nothing from you — make the status say why, "cannot read the PR body",
      so the gate knows the report is missing rather than empty. End on your
      verdict: `vincent status "VERDICT: notes need attention (2 missing)"`.
      That line is what stays on the finished step and what a maintainer sees
      on the board next to the gate.

      1. Read the PR body and its changelog section:
         `gh pr view <number> --json title,body --jq .body`
      2. Read what actually landed since the last tag:
         `git log --oneline v<old>..origin/{{.Task.BaseBranch}}`
         and, where a subject is not self-explanatory, the diffstat for that
         commit.
      3. Read `CHANGELOG.md`'s versioning and stability policy section, and
         `RELEASING.md § Version numbers`.
      4. Read both changelogs **as they stand on the PR head**, which is where
         they will be published from:
         `gh pr view <number> --json headRefName --jq .headRefName`, then
         `gh api -H "Accept: application/vnd.github.raw+json" "repos/{owner}/{repo}/contents/CHANGELOG.md?ref=<head>"`
         and the same for `site-changelog.md`. The `changelog` step has already
         proved both carry a section for this version, that the section is
         curated prose rather than a surviving commit list, and that no subject
         is duplicated — do not re-report any of that. What is left is the part
         a grep cannot judge, below.

      Then report, as prose a maintainer reads in 30 seconds:

      - **Missing** — user-visible changes that landed but are not in the
        generated notes. `.goreleaser.yaml`'s changelog filters drop `docs:`,
        `test:`, `ci:` and `chore:` commits, and Release Please's own notes
        follow Conventional Commit types, so a user-visible change committed
        under the wrong type is exactly what this review is for. Quote the
        commit subject and say what a user would notice.
      - **Version** — whether the proposed bump matches the policy given what
        landed (a `feat:` or a breaking change in a `0.x` line means a minor
        bump; only fixes mean a patch). Say if a commit's type looks wrong for
        what it did, because the type is what chose the version.
      - **Wrong or misleading** — any generated line that describes something
        that is not what the commit did.
      - **Changelog prose** — whether each entry in `CHANGELOG.md`'s section
        for this version describes what a *user* would notice rather than
        restating the commit subject, whether an entry belongs to an earlier
        release (check the commit is in this tag's range before saying so), and
        whether `site-changelog.md`'s section is a fair human summary of the
        same release rather than a copy of the canonical one. Both files ship;
        neither is regenerated after the merge.

      If the notes are complete and the version fits the policy, say so in one
      line. Do not pad the report and do not restate the whole changelog. End
      with an explicit verdict line: `VERDICT: notes are complete` or
      `VERDICT: notes need attention`.
    # The review is read-only by construction, and this is what enforces it:
    # an agent that "helpfully" edited CHANGELOG.md — which Release Please owns
    # — or committed anything fails the step rather than quietly changing the
    # tree the release is cut from.
    check: git diff --quiet && git diff --cached --quiet && [ -z "$(git log --oneline origin/{{.Task.BaseBranch}}..HEAD)" ]
    check_timeout: 5m

  - id: review
    name: Approve the release
    type: manual
    instructions: |
      **This is the release gate.** Approving it merges the Release Please PR
      in the next step, and that merge publishes: Release Please creates the
      tag and GitHub release, the tag starts GoReleaser, and GoReleaser
      uploads the signed artifacts and updates Homebrew, Scoop and WinGet. A
      published tag is never re-pointed. Rejecting stops here and nothing so
      far needs undoing.

      {{(index .Steps "verify-base").Result}}

      **Dry run** ({{(index .Steps "dry-run").Status}}):

      {{(index .Steps "dry-run").Result}}

      **Notes review** ({{(index .Steps "notes-review").Status}}):

      {{(index .Steps "notes-review").Result}}

      **Changelogs** ({{(index .Steps "changelog").Status}}) — both files
      passed their structural checks; what those checks cannot judge is whether
      the prose is *right*:

      {{(index .Steps "changelog").Result}}

      **Audit findings** — read every `WARN` line here, they are the release
      failures no commit on a branch can prevent (a missing secret, an
      unreachable publish destination):

      {{(index .Steps "audit").Result}}

      Before approving, confirm:

      1. The proposed version follows `CHANGELOG.md § Versioning and
         stability`, given what the notes review found.
      2. The generated notes cover every user-visible change. Fix the notes
         *now* — edit the PR body — or reject and fix the commit convention;
         editing after the release means editing a published artifact.
         The same applies to both changelogs: `changelog` proved the sections
         exist and are curated, not that they describe this release honestly.
         A `VERDICT: notes need attention` above is a reason to fix the
         Release Please branch and retry, not a line to read past — 0.6.0 was
         approved over exactly that verdict.
      3. All three `ci` and all three `gates` checks are green on both the PR
         and {{.Task.BaseBranch}} (`verify-base` just proved this, and re-proves
         nothing after you read it — a commit landing in the meantime is caught
         by the head-commit match in `merge`).
      4. The four release secrets are set and all three publish destinations
         are reachable, per the audit above.

      Approve to merge and publish.

  - id: merge
    name: Merge the release PR
    type: command
    shell: sh
    timeout: 15m
    # The one-way door, and the only step in this workflow that publishes
    # anything. No retry: `gh pr merge` failing after the merge landed and
    # failing before it look the same from here, and re-running it blind is how
    # a release gets cut twice. If this fails, look at the PR on GitHub first.
    max_retries: 0
    #
    # The status is set before the call and not replaced after it. This step
    # publishes; `gh pr merge` returning is the API accepting the merge, not
    # the release existing, and `publish` and `verify` are what read the real
    # answer back. A message left standing that says "merging the release PR"
    # is the correct account of a call whose response was lost — and it is the
    # sentence that tells a person to go and look at GitHub before doing
    # anything else.
    run: |
      set -e
      say() { vincent status -- "$*" >/dev/null 2>&1 || true; }

      number=$(jq -r .number .vincent-release/pr.json)
      oid=$(cat .vincent-release/head-oid.txt)

      state=$(gh pr view "$number" --json state --jq .state)
      [ "$state" = OPEN ] || {
        say "release PR #$number is $state, not OPEN: someone else acted on it"
        echo "release PR #$number is $state, not OPEN — someone else acted on it" >&2
        exit 1
      }
      say "merging the release PR #$number — this publishes"

      # A merge commit, never a squash: branch history becomes the base
      # branch's history (CLAUDE.md § Git flow). `--match-head-commit` refuses
      # the merge if Release Please rewrote the PR after `verify-base` looked
      # at it, so the thing being published is the thing that was reviewed.
      gh pr merge "$number" --merge --match-head-commit "$oid"
      echo "merged release PR #$number at $oid"

  - id: publish
    name: Wait for Release Please and GoReleaser
    type: command
    shell: sh
    # Release Please has to run, create the tag and the GitHub release; the tag
    # then starts a Release run that cross-compiles, signs, attests, uploads
    # and smoke-tests on three OSes.
    timeout: 90m
    # Watching is not replaying, but a retry restarts both polls from zero for
    # no benefit; re-run the step by hand if a poll times out.
    max_retries: 0
    #
    # Three distinct waits inside one step, each of which can be the one that
    # times out, and each with a different response. The status is what tells
    # them apart on the board and on the finished attempt: a Release Please
    # that never ran, a tag that never triggered the Release workflow
    # (RELEASE_PLEASE_TOKEN), and a GoReleaser run that went red are three
    # different problems, and `timeout` is the same word for the first two.
    run: |
      set -e
      say() { vincent status -- "$*" >/dev/null 2>&1 || true; }

      old=$(cat .vincent-release/old-version.txt)
      repo=$(cat .vincent-release/repo.txt)

      echo "waiting for Release Please to advance the manifest from $old"
      say "waiting for Release Please to advance the manifest from $old"

      # Both waits below are paced the same way: 5s doubling to a 30s ceiling,
      # ten minutes of budget counted in seconds waited rather than in polls,
      # so the "within 10 minutes" messages stay true. Release Please takes a
      # minute or two, so a fixed 10s spent most of its sixty polls asking an
      # unchanged question while still being no faster off the mark than a 5s
      # first poll.
      new=""
      nap=5
      waited=0
      while :; do
        # gh's failure already collapses to empty here — its output is piped
        # into jq rather than assigned — so a blip reads as "not yet" and is
        # waited out, which is what this wants.
        new=$(gh api \
          -H "Accept: application/vnd.github.raw+json" \
          "repos/$repo/contents/.release-please-manifest.json?ref=$VINCENT_BASE_BRANCH" \
          2>/dev/null | jq -r '."." // empty')
        if [ -n "$new" ] && [ "$new" != "$old" ]; then break; fi
        if [ "$waited" -ge 600 ]; then break; fi

        sleep "$nap"
        waited=$((waited + nap))
        if [ "$nap" -lt 30 ]; then
          nap=$((nap * 2))
          if [ "$nap" -gt 30 ]; then nap=30; fi
        fi
      done
      [ -n "$new" ] && [ "$new" != "$old" ] || {
        say "Release Please did not advance the manifest in 10 minutes"
        echo "Release Please did not advance the manifest within 10 minutes — check the Release Please workflow run" >&2
        exit 1
      }

      tag="v$new"
      printf '%s\n' "$tag" > .vincent-release/tag.txt
      echo "Release Please created $tag; waiting for the Release workflow"
      say "$tag tagged; waiting for the Release workflow to start"

      # The tag push is the trigger, so the run's headBranch is the tag name.
      run_id=""
      run_url=""
      nap=5
      waited=0
      while :; do
        # Guarded, unlike before: assigning a failed `gh run list` under
        # `set -e` aborted `publish` outright, and `publish` runs with
        # `max_retries: 0` immediately after the merge that published the tag.
        # A transient API failure there reported a released tag as a failed
        # release. Now it reads as "no run yet" and is waited out.
        set +e
        run=$(gh run list \
          --workflow=release.yml \
          --event=push \
          --limit 30 \
          --json databaseId,headBranch,url \
          --jq "[.[] | select(.headBranch == \"$tag\")] | .[0] // empty" 2>/dev/null)
        if [ $? -ne 0 ]; then run=""; fi
        set -e
        if [ -n "$run" ]; then
          run_id=$(printf '%s' "$run" | jq -r .databaseId)
          run_url=$(printf '%s' "$run" | jq -r .url)
          break
        fi
        if [ "$waited" -ge 600 ]; then break; fi

        sleep "$nap"
        waited=$((waited + nap))
        if [ "$nap" -lt 30 ]; then
          nap=$((nap * 2))
          if [ "$nap" -gt 30 ]; then nap=30; fi
        fi
      done
      [ -n "$run_id" ] || {
        say "$tag exists but triggered no Release run: check RELEASE_PLEASE_TOKEN"
        echo "no Release workflow run appeared for $tag within 10 minutes — RELEASE_PLEASE_TOKEN is what makes that tag trigger it (RELEASING.md)" >&2
        exit 1
      }

      printf '%s\n' "$run_url" > .vincent-release/run-url.txt
      # The longest silence in the whole workflow: GoReleaser builds, signs,
      # attests, uploads and smoke-tests on three OSes, and `gh run watch`
      # writes nothing vincent can see.
      say "$tag: GoReleaser building, signing and uploading"
      gh run watch "$run_id" --exit-status
      echo "$tag published: $run_url"
      say "$tag published"

  - id: verify
    name: Verify GitHub, Homebrew and Scoop
    type: command
    shell: sh
    timeout: 20m
    # Read-only postcondition check, deliberately separate from the step that
    # caused the effect. No retry: a missing asset is a defective release, not
    # a flake — RELEASING.md § If a release goes wrong is the response.
    max_retries: 0
    run: |
      set -e
      say() { vincent status -- "$*" >/dev/null 2>&1 || true; }

      tag=$(cat .vincent-release/tag.txt)
      version=${tag#v}

      # Three channels checked in sequence, two of which wait out a replica
      # lag. The status names the channel being checked, so a failure says
      # which one is defective without opening the transcript — and this is
      # the step that turns "the release run was green" into "the release is
      # actually there", so the distinction is the whole point of it.
      say "$tag: checking the GitHub release assets"
      release=$(gh release view "$tag" --json isDraft,isPrerelease,url,assets)
      [ "$(printf '%s' "$release" | jq -r .isDraft)" = false ] || {
        say "$tag is still a draft"
        echo "$tag is still a draft" >&2
        exit 1
      }

      names=$(printf '%s' "$release" | jq -r '.assets[].name')

      # The checksum file and its cosign signature and certificate: the three
      # files the release footer tells a user to verify with.
      for asset in checksums.txt checksums.txt.sig checksums.txt.pem; do
        printf '%s\n' "$names" | grep -qx "$asset" || {
          say "$tag has no $asset"
          echo "$tag has no $asset" >&2
          exit 1
        }
      done

      for target in \
        linux_amd64 linux_arm64 \
        darwin_amd64 darwin_arm64 \
        windows_amd64 windows_arm64; do
        printf '%s\n' "$names" | grep -q "_${target}\\.\(tar\\.gz\|zip\)$" || {
          say "$tag is missing the $target archive"
          echo "$tag is missing the $target archive" >&2
          exit 1
        }
      done

      n=$(printf '%s\n' "$names" | grep -c '\.deb$' || true)
      [ "$n" -eq 2 ] || { say "$tag has $n deb package(s), expected 2"; echo "$tag has $n deb package(s), expected 2" >&2; exit 1; }
      n=$(printf '%s\n' "$names" | grep -c '\.rpm$' || true)
      [ "$n" -eq 2 ] || { say "$tag has $n rpm package(s), expected 2"; echo "$tag has $n rpm package(s), expected 2" >&2; exit 1; }

      echo "GitHub release: $(printf '%s' "$release" | jq -r .url)"
      echo "assets: 6 archives, 2 deb, 2 rpm, checksums.txt + cosign .sig/.pem"

      # `skip_upload: auto` keeps a prerelease off every package manager, so
      # the correct state for a prerelease is "unchanged" and asserting a new
      # version there would be wrong.
      if [ "$(printf '%s' "$release" | jq -r .isPrerelease)" = true ]; then
        echo "$tag is a prerelease; Homebrew, Scoop and WinGet correctly remain on the stable channel"
        say "$tag is a prerelease: package managers correctly untouched"
        printf '%s\n' "prerelease" > .vincent-release/channels.txt
        exit 0
      fi

      # Homebrew and Scoop live in *other* repositories, which GoReleaser writes
      # at the very end of the Release run, and the contents API serves them
      # from a replica: for a few seconds after a green run the previous version
      # is still what comes back. Asserting into that window is a race, and
      # `verify` runs with `max_retries: 0` — so it turned a good release into a
      # blocked task and sent a person to read a tap that was already correct.
      #
      # These wait for the value to settle rather than retrying the step: 5s
      # doubling to a 30s ceiling, five minutes of budget each, which fits
      # inside the step's 20m timeout twice over. It waits for an answer; it
      # does not accept a different one. A tap that never reports the version
      # still fails, and now says how long it was given.
      settle() {
        _nap=5
        _waited=0
        while :; do
          if "$@"; then return 0; fi
          if [ "$_waited" -ge 300 ]; then return 1; fi
          sleep "$_nap"
          _waited=$(( _waited + _nap ))
          if [ "$_nap" -lt 30 ]; then
            _nap=$(( _nap * 2 ))
            if [ "$_nap" -gt 30 ]; then _nap=30; fi
          fi
        done
      }

      cask_reports() {
        gh api -H "Accept: application/vnd.github.raw+json" \
          "repos/lezli01/homebrew-tap/contents/Casks/vincent.rb?ref=main" 2>/dev/null \
          | grep -q "version \"$version\""
      }
      scoop_reports() {
        gh api -H "Accept: application/vnd.github.raw+json" \
          "repos/lezli01/scoop-bucket/contents/vincent.json?ref=main" 2>/dev/null \
          | jq -e --arg v "$version" '.version == $v' >/dev/null
      }

      say "$tag: waiting for the Homebrew cask to report $version"
      if ! settle cask_reports; then
        cask=$(gh api -H "Accept: application/vnd.github.raw+json" \
          "repos/lezli01/homebrew-tap/contents/Casks/vincent.rb?ref=main" 2>/dev/null || true)
        say "Homebrew cask still not on $version five minutes on"
        echo "Homebrew cask does not report $version five minutes after the release" >&2
        printf '%s\n' "$cask" | grep -i '^[[:space:]]*version' >&2 || echo "  (the cask could not be read)" >&2
        exit 1
      fi
      echo "Homebrew cask: $version in lezli01/homebrew-tap"

      say "$tag: waiting for the Scoop manifest to report $version"
      if ! settle scoop_reports; then
        scoop=$(gh api -H "Accept: application/vnd.github.raw+json" \
          "repos/lezli01/scoop-bucket/contents/vincent.json?ref=main" 2>/dev/null || true)
        say "Scoop manifest still not on $version five minutes on"
        echo "Scoop manifest does not report $version five minutes after the release (got $(printf '%s' "$scoop" | jq -r '.version // "unreadable"'))" >&2
        exit 1
      fi
      echo "Scoop manifest: $version in lezli01/scoop-bucket"
      printf '%s\n' "stable" > .vincent-release/channels.txt
      say "$tag verified: GitHub, Homebrew and Scoop all on $version"

  - id: winget
    name: Check the WinGet submission
    type: command
    shell: sh
    timeout: 10m
    max_retries: 0
    # WinGet is a pull request into Microsoft's catalog and can stay pending
    # long after the GitHub release succeeded (RELEASING.md § Automation
    # boundary). A missing PR here is worth reporting, never worth blocking a
    # release that already published — so this failure is data the report
    # reads, not a blocked task.
    allow_failure: true
    run: |
      set -e
      say() { vincent status -- "$*" >/dev/null 2>&1 || true; }

      tag=$(cat .vincent-release/tag.txt)
      version=${tag#v}
      if [ "$(cat .vincent-release/channels.txt)" = prerelease ]; then
        echo "prerelease: WinGet is correctly not submitted"
        say "prerelease: WinGet correctly not submitted"
        printf '%s\n' "skipped (prerelease)" > .vincent-release/winget.txt
        exit 0
      fi

      # GoReleaser pushes branch `vincent-<version>` to the fork and opens the
      # catalog PR from it. Cross-repository PR creation can fail
      # non-fatally, so a green Release run is not proof the PR exists.
      #
      # Both answers lag the run, and by different amounts: the fork branch
      # appears with the push, while the catalog PR must be created *and* then
      # indexed before `--search` will match it — tens of seconds, routinely
      # longer. Asking once, seconds after the release, reported "no catalog PR
      # found" for a pull request that was on its way, and printed the manual
      # `gh pr create` recovery for a submission that needed nothing.
      #
      # Two minutes of budget, 5s doubling to a 20s ceiling — and two minutes
      # rather than five because this step is `allow_failure: true`: its answer
      # is a line in the report, not a gate, and WinGet is explicitly outside
      # the automation boundary (RELEASING.md § Automation boundary). A missing
      # PR here is something to look at later, not something to hold a
      # maintainer at a terminal for.
      branch_ok=no
      pr=""
      nap=5
      waited=0
      say "waiting for the winget-pkgs catalog PR for $version"
      while :; do
        if gh api "repos/lezli01/winget-pkgs/branches/vincent-$version" --jq .name >/dev/null 2>&1; then
          branch_ok=yes
        fi

        set +e
        pr=$(gh pr list --repo microsoft/winget-pkgs \
          --search "lezli01.Vincent $version in:title" \
          --state all --limit 5 \
          --json url,state,title --jq '.[0] // empty' 2>/dev/null)
        if [ $? -ne 0 ]; then pr=""; fi
        set -e

        if [ -n "$pr" ]; then break; fi
        if [ "$waited" -ge 120 ]; then break; fi

        sleep "$nap"
        waited=$((waited + nap))
        if [ "$nap" -lt 20 ]; then
          nap=$((nap * 2))
          if [ "$nap" -gt 20 ]; then nap=20; fi
        fi
      done

      echo "fork branch vincent-$version pushed: $branch_ok"
      if [ -n "$pr" ]; then
        echo "catalog PR: $(printf '%s' "$pr" | jq -r '.state + " — " + .url')"
        say "winget catalog PR $(printf '%s' "$pr" | jq -r .state) for $version"
        printf '%s\n' "$(printf '%s' "$pr" | jq -r '.state + " " + .url')" > .vincent-release/winget.txt
      else
        # This step is `allow_failure`, so its red row is not a broken release
        # — the tag published fine and WinGet is outside the automation
        # boundary. The status is what says so on the board, and it names the
        # recovery, which is where task 52 stopped with nothing to go on.
        say "no winget catalog PR; fork branch pushed: $branch_ok (release is fine)"
        printf '%s\n' "no catalog PR found" > .vincent-release/winget.txt
        echo "two minutes after the release, no microsoft/winget-pkgs pull request mentions lezli01.Vincent $version" >&2
        echo "check the Release run log for the WinGet publisher's output" >&2
        # This is where task 52 stopped: branch pushed, no PR, and nothing said
        # what to do next. The manifests are already on the fork, so the
        # recovery is one command and needs no re-release.
        if [ "$branch_ok" = yes ]; then
          echo >&2
          echo "the manifests are on the fork, so the catalog PR can be opened by hand:" >&2
          echo "  gh pr create --repo microsoft/winget-pkgs --base master \\" >&2
          echo "    --head lezli01:vincent-$version \\" >&2
          echo "    --title 'New version: lezli01.Vincent version $version'" >&2
        fi
        exit 1
      fi

  - id: report
    name: Report the release
    type: command
    shell: sh
    timeout: 10m
    # Everything this reports already happened; the only way it fails is a lost
    # read. `defaults.max_retries` (1) stands, paced so the retry outlives the
    # blip rather than sharing it. Re-running is safe: the scratch directory is
    # cleared on the last line, so a failed attempt leaves it intact for the
    # next one.
    retry_backoff: 20s
    run: |
      set -e
      say() { vincent status -- "$*" >/dev/null 2>&1 || true; }

      tag=$(cat .vincent-release/tag.txt)
      run_url=$(cat .vincent-release/run-url.txt)
      release_url=$(gh release view "$tag" --json url --jq .url)
      winget=$(cat .vincent-release/winget.txt 2>/dev/null || echo "not checked")
      dry=$(cat .vincent-release/dry-run-url.txt 2>/dev/null || echo "skipped")

      echo "released:  $tag"
      echo "release:   $release_url"
      echo "workflow:  $run_url"
      echo "dry run:   $dry"
      echo "channels:  GitHub artifacts, Homebrew and Scoop verified for a stable tag"
      echo "winget:    $winget"
      echo
      echo "Left to a human (RELEASING.md steps 7-9): verify a download the way a"
      echo "user would — cosign verify-blob, sha256sum -c, gh attestation verify —"
      echo "and install the deb and rpm on clean systems."

      # Leave the worktree clean so archiving this task does not warn about it.
      rm -rf .vincent-release
      echo
      echo "worktree status (expect empty):"
      git status --porcelain
      # The last word of the whole run, and the one the board keeps against
      # this release.
      say "$tag released; RELEASING.md steps 7-9 are left to a human"

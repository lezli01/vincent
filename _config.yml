title: vincent
description: Durable local orchestration for agentic development workloads.
homepage_title: "vincent — local AI coding-agent workflow orchestrator"
repository: lezli01/vincent
code_repository: "https://github.com/lezli01/vincent"
license_url: "https://github.com/lezli01/vincent/blob/main/LICENSE"
url: "https://lezli01.is-a.dev"
baseurl: "/vincent"
lang: en
locale: en_US
author: László Szabó
social_image: /docs/assets/opengraph.png
social_image_alt: "vincent — durable local orchestration for agentic development"
social_image_width: 1200
social_image_height: 630

# Add the tokens issued by the corresponding webmaster tools to enable their
# ownership checks. Empty values deliberately emit no verification tag.
google_site_verification:
bing_site_verification:

plugins:
  - jekyll-optional-front-matter
  - jekyll-readme-index
  - jekyll-relative-links
  - jekyll-sitemap
  - jekyll-titles-from-headings

# This filename is intentionally skipped by jekyll-optional-front-matter unless
# it is explicitly included.
include:
  - CODE_OF_CONDUCT.md

defaults:
  - scope:
      path: ""
    values:
      layout: default

# GitHub Pages builds this repository with Jekyll 3.x. Keep internal engineering
# records and template-heavy bundled reference material out of the site build;
# those files intentionally contain vincent Go-template expressions (`{{ ... }}`)
# that Liquid would otherwise try to evaluate.
exclude:
  - AGENTS.md
  - CHANGELOG.md
  - CLAUDE.md
  - CONTRIBUTING.md
  - RELEASING.md
  - docs/gates/
  - docs/history/
  - docs/spec.md
  - docs/tasks/
  - skills/vincent-workflows/references/

name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # The repo is docs-only until Phase 0 (T0.1) lands go.mod; every step
      # below no-ops gracefully so this check can be required from day one.
      - name: Detect Go module
        id: gomod
        shell: bash
        run: echo "exists=$([[ -f go.mod ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        if: steps.gomod.outputs.exists == 'true'
        with:
          go-version-file: go.mod

      - name: Build
        if: steps.gomod.outputs.exists == 'true'
        run: go build ./...

      - name: Test
        if: steps.gomod.outputs.exists == 'true'
        run: go test ./...

      - name: Lint
        if: steps.gomod.outputs.exists == 'true'
        uses: golangci/golangci-lint-action@v6

      - name: No Go module yet
        if: steps.gomod.outputs.exists == 'false'
        run: echo "go.mod not present yet — skipping build/test/lint (Phase 0 pending)"

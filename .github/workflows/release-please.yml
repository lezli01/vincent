name: Release Please

# Release Please owns the version PR, tag, and GitHub release. It deliberately
# uses a PAT rather than GITHUB_TOKEN: GitHub suppresses workflow events caused
# by GITHUB_TOKEN, while the tag created here must trigger release.yml so
# GoReleaser can publish signed artifacts and update the Homebrew tap.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Third-party actions are pinned to immutable commits. Dependabot keeps
      # the SHA and version comment in sync.
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

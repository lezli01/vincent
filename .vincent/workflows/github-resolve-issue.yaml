# github-resolve-issue — pick up a GitHub issue, work out what it is, deliver it
# on its branch, ready for a pull request.
#
# The merge of `github-bug.yaml` and `github-enhancement.yaml`. Those two files
# were ~80% the same text — fetch, verdict-gate, cross-platform verify, human
# gate, push, report — and differed in exactly two places: what the first agent
# is asked to produce, and whether a regression test has to be observed failing
# before the fix is written. This file keeps both differences and shares
# everything else.
#
# The GitHub issue number is the declared **`github_issue` field**, not the
# title and not `issue`. Picking an issue in the new-task form fills it in, and
# so does `vincent task add --github-issue 42`; typing it by hand is the third
# way. It is `required: true`, so a task that reaches this workflow without one
# is refused at creation rather than 45 minutes into a run. The declared
# `issue` field holds the vincent issue id (task 130 decision 8) and is never
# handed to `gh`.
#
# The title is left to the humans. The prefill writes `#42 daemon leaks the
# lock file` into it — the number for the board row, the words for `{{.Slug}}`
# and the branch name — but nothing here parses it, so rewriting it entirely
# breaks nothing.
#
# Shape:
#
#   fetch    (cheap guard: open, and labeled bug, enhancement, documentation or ci)
#   classify (the branch point — a probe whose exit code the guards read)
#     ├─ diagnose  (bug)            reproduce, ask, write the failing test
#     ├─ digest    (enhancement)    understand, ask, write the plan
#     ├─ survey    (documentation)  verify each claim at HEAD, ask, write the scope
#     └─ inspect   (ci)             read what CI runs, ask, write the plan and its proof
#   triage (stop on reject / needs-info)
#     ├─ confirm-red (bug only)  prove the test fails on the unfixed code
#     └─ pin-proof   (ci only)   freeze the commands that must pass on this host
#   implement (write it, commit it, draft the PR)
#   docs-sync (audit what the source derives: pages, spec, the embedded skill)
#   verify    (the expensive cross-platform legs, repaired in a bounded loop)
#   deliver   (record the verified branch as ready for a pull request)
#
# ## How the branch is expressed
#
# Not with `type: condition`. That primitive means "stop the run early and call
# the task done" — it has no else. Vincent's actual branch is `if:` on a step:
# a false guard marks the step `skipped` with reason `condition` and the
# workflow **carries on**, which is what a two-path workflow needs.
#
# Guards can only read `.Steps`, `.Task.Fields` and `.Host` — never a file. So
# the label lives in a probe: `classify` exits 0 for `bug`, 1 for `enhancement`,
# 2 for `documentation` and 3 for `ci`, under `allow_failure: true` so that a
# nonzero exit is data rather than a blocked task. Every guard downstream is one
# of:
#
#     {{ eq (index .Steps "classify").ExitCode 0 }}   bug
#     {{ eq (index .Steps "classify").ExitCode 1 }}   enhancement
#     {{ eq (index .Steps "classify").ExitCode 2 }}   documentation
#     {{ eq (index .Steps "classify").ExitCode 3 }}   ci
#
# A **failed `classify` row on the board is the normal enhancement,
# documentation or ci path**, not an error. It is the one wart of doing this
# honestly; the alternative is asking a human to retype a label GitHub already
# holds.
#
# The probe was `is-bug`, exiting 0 or 1, while there were two paths. An issue
# carrying several of the labels takes the strictest path among them — bug,
# then ci, then enhancement, then documentation — and the step's own comment
# says why each sits where it does. The exit codes are not the precedence: `ci`
# arrived last and took 3 so that no existing guard had to change.
#
# ## What still differs, and why
#
# `confirm-red` is the whole reason the bug path is not the enhancement path.
# An enhancement is judged by whether the new behaviour works; a bug fix is
# judged by whether the old behaviour is gone, and the only honest evidence of
# that is a test that failed before the fix and passes after it. So `diagnose`
# writes the regression test *first*, `confirm-red` runs it against the unfixed
# code and **fails the task if it passes**, and `implement`'s check re-runs that
# same frozen command expecting success. A green regression test nobody ever
# saw fail proves nothing — it may be testing the wrong thing entirely, and it
# will keep passing after the bug comes back.
#
# Not every bug is reachable from a test (a TUI rendering glitch, a wrong
# sentence in `docs/`, a platform-specific path bug on an OS this machine is
# not). That escape hatch exists — `red-test.txt` may say `none: <reason>` —
# but it is loud: it costs the task its automated proof, it is printed by
# `confirm-red`, and `deliver` carries it into the delivery record — and from
# there into the merge train's pull request — so a person reading that pull
# request sees it. Prefer a test.
#
# `implement` is one step for all four paths, with one `{{if}}` block in its
# prompt. The shared 80% — commit conventions, the PR template's four claims,
# the spec amendment rule, the scratch-directory rule, the two PR artifacts — is
# written once, which is the point of merging.
#
# ## The documentation path
#
# A `documentation` issue in this repository is rarely "write a page". It is a
# list of claims an audit found wrong — a count that drifted, a citation to the
# wrong task, a screenshot that predates a panel, a gate walk nobody recorded —
# each with a location that was true at the commit the audit read, and each
# checkable against the source the claim derives from. Three rules follow, and
# `survey` and the documentation half of `implement` exist to hold them:
#
# - **Every item is re-verified at HEAD before anything is edited.** Line
#   numbers drift, and other branches fix items. `survey` writes down, per
#   item, what the source says now and whether the item still stands; an item
#   that is already true is dropped, not edited again.
# - **Nothing is recorded that did not happen.** A gate run record, a
#   `✓ YYYY-MM-DD`, an `[x]`, a "verified" line is evidence, and this workflow
#   can only produce evidence for what it ran. A manual walk, a judgement "by
#   eye", a real-install or real-GitHub leg needs a person, so `survey` asks the
#   author to scope such items out rather than letting `implement` write them
#   up.
# - **An issue with items left open is not closed by the PR.** `survey`'s
#   second line is `closes: yes` or `closes: no`; on `no` the PR body says
#   `Part of #N` and lists what is left, so merging does not close an issue
#   that still holds a person's work.
#
# There is no `confirm-red` here: a sentence has no failing test to observe.
# The proof is the docs-claims tests that `implement`'s check runs as part of
# the suite, and `docs-sync`, which on this path is the second reader rather
# than the first — it re-checks every claim the diff changed against the source
# and hunts the copies of each fact the change missed.
#
# Screenshots are the one thing that moves. The audit below may never fix one,
# but on this path a screenshot can *be* the issue (#413–#415), so `implement`
# may extend and run `scripts/screenshots.sh` when `survey` scoped it. It still
# never draws a screen or edits a PNG by hand.
#
# ## The ci path
#
# A `ci` issue in this repository is rarely "CI is broken". CI here is
# `.github/workflows/ci.yml` — lint, the race detector and a build on Linux,
# macOS and Windows, then every acceptance gate (`scripts/*-gate.sh`) as its own
# named step on the same three — beside the scheduled `go-toolchain.yml` and
# `vuln.yml` and the release workflows. The label marks what an audit finds
# missing around that: a gate written and never wired into `ci.yml` (#381), a
# gate a task promised and never wrote (#382, #383), a scenario an existing gate
# lacks (#384), a fake-CLI scenario an end-to-end proof needs (#385). Next to
# `enhancement` it has meant wiring a gate (#120, #122, #125), next to
# `documentation` a gate plus the pages it proves (#388), and next to `bug` a
# job that fails or flakes (#340, #373).
#
# What makes that a path of its own is where the proof lives. A gate is judged
# by running it on every platform `ci.yml` runs it on, and this machine is one
# of three — so the path proves what it can here and says plainly what it
# cannot:
#
# - `inspect` writes the plan and `proof.txt`: the commands — gate scripts,
#   single scenarios, narrow tests — that must pass on this host once the change
#   exists. `pin-proof` freezes them into `proof.sh` before `implement` starts,
#   for the reason `confirm-red` freezes `green.sh`: the step being judged does
#   not get to rewrite its own bar. It runs nothing, because the gate a line
#   names usually does not exist yet. A change only GitHub can execute — a
#   schedule, a permission — writes `none: <reason>`, as loudly as the bug
#   path's escape hatch.
# - `implement`'s check and every `verify-probe` run `proof.sh`, and the probe
#   runs `actionlint` over any workflow file the branch touched.
# - The other two platforms first run the change in the pull request's own CI
#   — a same-repository `pull_request` run reads `ci.yml` from the branch. That
#   pull request is no longer this workflow's: `github-iterate-work`'s merge
#   train waits for the `gates` job on all three before it merges, and its
#   `repair-checks` is where a Windows-only fault gets fixed, told a platform is
#   never skipped to make a gate green.
# - Gate records follow the documentation path's rule: nothing is recorded that
#   did not happen, so a run line names this host and no other. An item only a
#   person can do — a repository setting, a secret, a real-GitHub leg — is
#   scoped out, and `closes: no` makes the pull request say `Part of #N`.
#
# `classify`'s comment says why `ci` outranks `enhancement` and `documentation`
# and yields to `bug`.
#
# ## Documentation is a step, not a checkbox
#
# `implement` is told to update the affected page, and a step doing something
# else does that badly: the page is the last thing it touches, it is judged by
# a checklist it ticked itself, and it never sees the finished change — only
# the one it is partway through writing. `docs-sync` is the audit, and it has
# exactly one job.
#
# What it audits is not "the docs" in general. `CLAUDE.md` says public
# documentation is **derived from the source**, and each derivation is a
# checkable claim: the config reference tracks `internal/config`, the CLI page
# the cobra tree, the API page `internal/api/server.go`'s route table, the TUI
# key tables `internal/tui/bindings.go`, the block reasons the `Reason*`
# constants. Alongside those sit the records that are derived from nothing and
# are amended by hand: `docs/spec.md` in place with a dated note in this same
# PR, `docs/tasks/` with its index row in the same edit, `docs/gates/` when the
# behaviour a walkthrough walks through has changed.
#
# `skills/vincent-workflows/SKILL.md` is in scope and is **not documentation**:
# `skills/embed.go` embeds it and `internal/workflow/builtin.go` splices it into
# the built-in `create-workflow` prompt at build time (task 024), so a schema
# change that does not reach it leaves the daemon telling agents something
# false. That is also why this step runs *before* `verify` rather than after:
# what it may edit includes Go, and the cross-platform legs have to see it.
#
# `docs-scope` in front of it is a data step first and a guard second. Its
# stdout is the changed-file list the prompt reads; its exit code skips the
# audit only for a change that touched nothing but tests — the one kind that
# cannot make a documented claim false. That is a narrow saving, and it is
# honest about being narrow.
#
# The check is what keeps an audit from becoming a rewrite: this step's own
# commits (everything after `pre-docs.sha`) may touch only `docs/`, `skills/`,
# `CHANGELOG.md`, `README.md` and `internal/workflow/builtin.go`, the repo's own
# `.vincent/workflows/*.yaml` must still validate *and* still render — the
# second is not the first, since `validate` parses a template and `render`
# executes it — and the four packages whose tests assert what the published
# pages and the embedded skill say must still pass. `docs: none needed` is a
# first-class outcome — what it may not be is empty.
#
# Screenshots are the one thing it may not fix. Every `docs/assets/tui-*.png`
# is a capture from `scripts/screenshots.sh`, which needs VHS, ttyd and ffmpeg
# and seeds a throwaway daemon; documentation never *draws* a screen. So a
# stale panel is reported into `docs.md` and into the PR body, and a person
# re-runs the script.
#
# ## When the cross-platform legs fail
#
# `verify` is a bounded repair loop rather than a single command: probe →
# break → repair, four iterations, so the expensive legs get up to **three**
# agent repair passes and every one of them is re-probed. `repair` carries
# `if: not .Loop.IsLast` for exactly that reason — a repair on the last pass
# would never be probed again, so its work would be delivered unverified while
# costing a full session.
#
# A loop that runs out of iterations **succeeds** (§7.8: only exceeding
# `max_iterations` blocks), so the loop itself cannot be the assertion.
# `verify-final` is: it reads the last probe's exit code back out of `.Steps` —
# an id under repetition resolves to its latest iteration — and fails the task
# if the legs are still red. Without it, a branch whose race detector never
# passed would be delivered looking verified.
#
# The loop declares its own `timeout:` because `defaults.timeout` (30m) bounds
# the *whole* loop rather than one iteration, and four probes plus three
# 45-minute repairs do not fit inside it.
#
# ## Where the run ends: a delivered branch
#
# *Changed 2026-10-02.* The run used to go on past `verify`: a human
# diff gate, a push and `gh pr create`, a second gate, and a looping
# rebase-verify-merge tail. It no longer does. This workflow's responsibility is
# the branch: once the legs are green and `verify-final` has not refused it,
# `deliver` checks the branch is committed and ahead of the base, writes a
# **delivery record** to the repository's common git directory —
# `vincent-delivered/<task id>/`, with the branch, the verified head, the
# plain-language title and the body `implement` drafted — and the task is done.
#
# Nothing on this workflow's step path reaches GitHub any more. Opening the
# pull request and merging it belong to whoever consumes the record:
#
# - `github-iterate-work` stacks every branch its run delivered onto the base
#   into one **merge train**, resolves the conflicts between them, opens one
#   pull request for the lot and drives it to merged — the rebase, required
#   checks, merge and repair loop that used to live here lives there now, and
#   its header carries the reasoning that came with it.
# - A person running this workflow on its own opens the pull request from the
#   task (§13.2 `POST /v1/tasks/{id}/github/pull/create`) using the record's
#   title and body.
#
# ## Why the brief and the implementation are two steps
#
# `diagnose`, `digest`, `survey` and `inspect` run with `on_input: wait`, so
# they park the task in `awaiting_input` and ask you through claude's
# AskUserQuestion tool (§7.4). If implementation shared that step, every retry after a failed check
# would replay the questioning and ask you the same things again. Splitting
# costs `implement` the live Q&A session — which is why the brief writes its
# answers in as resolved decisions, not as a transcript. `defaults.on_input:
# deny` makes the asymmetry explicit: only the brief step may stop and ask.
#
# claude-only by construction. `on_input` is ignored by codex and cursor
# (`supports_input: false`, §9.3/§9.7), so on those adapters the brief step
# would silently guess at the repro or the requirement instead of asking.
#
# Left on `wait` rather than `on_input: require` (task 013): `require` would
# refuse those adapters outright, and degrading is what these files have always
# documented as intended. Change it here if you would rather refuse than guess.
#
# POSIX-only, and `platforms: [posix]` now says so (§8.1.1). Portability is the
# author's problem (§8.3) and this workflow declines it deliberately — §8.3's
# task 010 amendment is precisely that an author who declines says so with
# `platforms:`, which is enforced rather than translated.
#
# **This reverses a decision recorded in `fa18796`**, where `platforms:` was
# left off so that a Windows host carrying Git Bash's `sh` on PATH would still
# be offered the workflow. That reasoning holds for the command steps: they pin
# `shell: sh`, and on Windows `sh` does resolve to Git Bash's. It does not reach
# the agent steps' `check`. §8.2 rejects `shell` on an agent step, and
# `runCheck` hands the step's own — empty — pin to the shell resolver
# (`internal/taskrun/steps.go`), so every check in this file runs under the
# **platform default**: pwsh, or Windows PowerShell 5.1 where pwsh is absent,
# and never under the `sh` the command steps found. `diagnose`'s check is the
# unarguable case — `{ offenders=$( … ); test -z "$offenders" || { … } }` is not
# something pwsh can parse on any PATH — and `docs-sync`'s builds
# `.vincent-issue/vincent` and then executes it, which on Windows would want
# `.exe`.
#
# So the Git Bash host the decision was protecting cannot finish this workflow
# either way: it spends a 45-minute `diagnose` session and blocks on
# `check_failed`. Declaring the platform turns that into a refusal at task
# creation, before anything is spent. To take the late failure back, delete the
# `platforms:` line; nothing else in the file depends on it.
#
# Requires `gh` (authenticated), `jq`, `git`, `go`, and the worktree's `origin`
# pointing at the repo that owns the issue. The ci path runs gate scripts, which
# also want `bash` and `curl`, and uses `actionlint` when it is installed.
#
# ## Saying what is happening
#
# This workflow is mostly *waiting*: a 45-minute agent, a 20-minute matrix of
# lint targets, a 90-minute poll for CI. A row that says `running` and nothing
# else for an hour is unreadable, so every step that runs a process reports
# through `vincent status` (§5.4) — shown live on the board's STATUS column and
# kept on the finished attempt as that attempt's own account of how it went.
#
# Command steps call it through a `say` helper defined at the top of each
# script:
#
#     say() { vincent status -- "$*" >/dev/null 2>&1 || true; }
#
# Guarded twice on purpose. `--` keeps a message that happens to start with a
# dash out of cobra's flag parser, and `>/dev/null 2>&1 || true` makes a status
# write incapable of failing a step: a `vincent` that is not on the daemon's
# PATH, or a step that has already finished (the daemon answers 409), would
# otherwise abort a `set -e` script — and in a poll loop it would also print
# one line of noise per iteration. The cost of that guard is that the messages
# are silently dropped rather than explained when `vincent` cannot be found;
# check the STATUS column is populated on a first run.
#
# Two uses, and they are different:
#
# - **Progress**, set *before* the thing it names. Under `set -e` that is also
#   what makes it an error message: the step dies at the failing command, and
#   the status still says what was being attempted. `verify-probe` sets one per
#   lint target for exactly this reason — the surviving status names the GOOS
#   that failed, which no `failure_reason` can reach.
# - **A verdict**, set on a path that is about to exit non-zero — `triage` on a
#   rejected brief, `wait-checks` on a red context. This workflow has four
#   `allow_failure` steps whose red row is the *normal* path (`classify`,
#   `docs-scope`, `rebase`, `verify-probe`), and a status is the only thing that
#   can say so on the board.
#
# Agent steps are *asked* for status in their prompts. Vincent never appends an
# instruction of its own, so an agent reports only because this file said to.
#
# On branch names: the built-in name is `vincent/{id}-{slug}` and the slug comes
# from the title, so the title's description half is the whole reason a branch
# reads `vincent/7-42-daemon-leaks-lock-file` instead of `vincent/7-42`. Full
# conformance with this repo's `type/short-description` convention is not
# reachable from here — the type (feat/fix/docs) is not knowable until someone
# has read the issue, and the `vincent/` prefix is worth keeping anyway because
# it marks a branch an agent created. A workflow cannot set a branch name at
# all; the four levels that can are, most specific first: `task add --branch`
# (verbatim), the project's template, `branch_template` in config.yaml, then the
# built-in (task 001, internal/worktree/branch.go).
name: github-resolve-issue
description: Read a GitHub bug, enhancement, documentation or ci issue, clarify it with the author, and deliver the fix, feature, documentation or CI change as a verified branch ready for a pull request. It opens and merges nothing; github-iterate-work merges what it delivers.

platforms: [posix]

fields:
  - name: github_issue
    label: GitHub issue number
    description: >-
      The number of the GitHub issue to resolve, in this project's `origin`
      repository. The new-task form's issue picker and
      `vincent task add --github-issue N` both fill this in; typing it is the
      third way. `fetch` reads it and nothing else — the task title is yours to
      write.
    type: integer
    required: true
  - name: issue
    label: Issue id
    description: >-
      The vincent issue this task was created from. A task created from a
      vincent issue gets its id here; `--github-issue N` fills it with the
      GitHub number until that path is removed. Nothing hands it to `gh`.
    type: integer

defaults:
  agent: claude
  max_retries: 1
  timeout: 30m
  # Every step that actually retries here is an agent, and 028 decision 1 is why
  # they get a pause: an agent CLI that hit an overloaded upstream and one that
  # left a compile error both exit non-zero and both classify `nonzero_exit`, so
  # there is nothing for vincent to tell apart — the workflow has to pick. This
  # picks the pause, because the two cases are not symmetric. A backed-off retry
  # returns the task to `queued` and gives up its concurrency slot (§12.3), so on
  # the compile-error case the minute costs wall-clock and nothing else, and
  # other tasks keep running through it. On the transient case an immediate
  # retry lands inside the same outage and spends the whole budget on it.
  #
  # A minute against steps budgeted 30-45m is noise. Steps that want their
  # second attempt now say so with `retry_backoff: 0`.
  retry_backoff: 60s
  # Only the brief steps override this. An implement step that stops to ask has
  # skipped the whole point of the brief/implement split.
  on_input: deny

steps:
  - id: fetch
    name: Fetch and guard the issue
    type: command
    shell: sh
    timeout: 2m
    # A wrong id, a closed issue or a missing label is not a transient error —
    # re-reading GitHub returns the same answer. Retrying only delays the
    # failure.
    max_retries: 0
    # This step exists so that a bad id costs two seconds instead of a 45-minute
    # agent run, and so that exactly these fields — not whatever the agent felt
    # like fetching — are what enters the brief step's context.
    run: |
      set -e
      say() { vincent status -- "$*" >/dev/null 2>&1 || true; }

      # The declared `github_issue` field, rendered in — never `issue`, which
      # holds the vincent issue id (task 130 decision 8). It is `required: true` and
      # `type: integer`, so §8.1.2 validated it at creation and this is a bare
      # decimal number — no "#", no URL, nothing to parse. The guard below is
      # for the one case validation cannot cover: a task created against an
      # older snapshot of this workflow, before the field existed.
      id='{{ index .Task.Fields "github_issue" }}'
      if [ -z "$id" ]; then
        say "task carries no issue number"
        echo "the 'github_issue' field is empty; this workflow resolves the issue it names (create the task from the issue picker, or with --github-issue N)" >&2
        exit 1
      fi

      # Every guard below sets a status before it exits. These are the four
      # ways a run of this workflow ends two seconds after it started, and the
      # `failure_reason` for all four is the same word (`nonzero_exit`) — so
      # the status is the only place the board can say which one happened.
      say "reading issue #$id"

      mkdir -p .vincent-issue
      # `comments` matters more than it looks: a bug report's real reproduction
      # steps, versions and "me too, but on Windows" almost always arrive in the
      # thread rather than the body. `createdAt` is what lets the bug path ask
      # whether the report is already stale at HEAD.
      if ! gh issue view "$id" \
        --json number,title,body,state,url,labels,comments,createdAt \
        > .vincent-issue/issue.json; then
        say "no such issue: #$id"
        echo "no such issue: $id (the 'github_issue' field must name an issue in this project's origin repository)" >&2
        exit 1
      fi

      state=$(jq -r .state .vincent-issue/issue.json)
      if [ "$state" != "OPEN" ]; then
        say "issue #$id is $state, not open"
        echo "issue #$id is $state; this workflow only picks up open issues" >&2
        exit 1
      fi

      # The label is the only thing that decides which path runs, so a missing
      # one fails here rather than silently defaulting to a path. An issue
      # carrying more than one is sent down the strictest path it carries by
      # `classify`: bug, then ci, then enhancement, then documentation.
      if ! jq -e '[.labels[].name] | any(. == "bug" or . == "enhancement" or . == "documentation" or . == "ci")' \
        .vincent-issue/issue.json > /dev/null; then
        say "issue #$id is labeled none of bug, enhancement, documentation or ci"
        echo "issue #$id is labeled none of 'bug', 'enhancement', 'documentation' or 'ci'; refusing to guess at its type" >&2
        jq -r '"labels: " + ([.labels[].name] | join(", "))' .vincent-issue/issue.json >&2
        exit 1
      fi

      # Every range below this step is anchored at `origin/{{.Task.BaseBranch}}`,
      # and this is the one fetch that makes that ref fresh before `diagnose`,
      # the earliest reader, runs. Spec §5.3: the branch was cut from the
      # *fetched* base tip (§10), so the bare local base is not the fork point
      # — and it is a ref every other worktree of the repository shares, so
      # another worktree holding it checked out leaves it behind `origin/<base>`
      # for the whole run. Counting `<base>..HEAD` against a stale local ref
      # counts the pull requests that merged while this task ran: it passes
      # `implement`'s "has this branch committed anything?" on a branch with
      # nothing of its own, and fails `diagnose`'s "has it committed nothing?"
      # on a step that committed nothing (#449).
      #
      # `set -e` is on, so a fetch that cannot reach the remote fails here, two
      # seconds in, rather than leaving every later range to be judged against
      # whatever `origin/<base>` happens to hold. `rebase` already fetches this
      # same ref, so requiring a reachable `origin` adds no prerequisite.
      say "fetching origin/{{.Task.BaseBranch}}"
      git fetch origin {{.Task.BaseBranch}}

      jq -r '"#\(.number) \(.title)\n\(.url)\nreported: \(.createdAt)"' .vincent-issue/issue.json
      say "#$id open, $(jq -r '[.comments[]] | length' .vincent-issue/issue.json) comment(s) to read"

  - id: classify
    name: Classify — bug, ci, enhancement or documentation?
    type: command
    shell: sh
    timeout: 1m
    # The branch point. Exit 0 means bug, 1 enhancement, 2 documentation, 3
    # ci, and every guard below reads `.Steps.classify.ExitCode`.
    # `allow_failure` is what turns a nonzero exit into data instead of a
    # blocked task (§ Conditions).
    #
    # A `failed` row here is therefore the *normal* enhancement, documentation
    # or ci path, not a problem — the stdout line says which way it went.
    #
    # The order of the tests is the precedence, and it is not the order of the
    # exit codes. `ci` is tested second. Next to `enhancement` it has only ever
    # meant wiring a gate into CI (#120, #122, #125), and next to
    # `documentation` a gate plus the pages it proves (#388): both are this
    # path's work, whose proof is a gate run, not a plan's or a survey's. It
    # yields to `bug`, because a job that is red because the product is wrong
    # wants the reproduce-first rule — and a job red for a reason no test can
    # hold still has `none:` on that path. `documentation` is checked last
    # because next to `bug` or `enhancement` it marks a code change that also
    # moves the docs — #376 is labeled both — and those paths already audit
    # the docs in `docs-sync`. The documentation path is for an issue whose
    # deliverable *is* the documentation.
    allow_failure: true
    # A probe never retries: the answer is a file this workflow already wrote.
    max_retries: 0
    # The status is the fix for this file's one documented wart: off the bug
    # path this step exits nonzero *on purpose*, and the board has shown a red
    # row with nothing to say it was the intended answer. The message survives
    # on the finished attempt, so the row reads "failed — enhancement path:
    # judged by the new behaviour", which is true and legible. It is not
    # readable by the `if:` guards below — those read `.ExitCode`, and free
    # text an agent or a script chose is not something a workflow branches on
    # (§5.4) — so nothing downstream depends on it.
    run: |
      say() { vincent status -- "$*" >/dev/null 2>&1 || true; }

      if jq -e '[.labels[].name] | index("bug")' .vincent-issue/issue.json > /dev/null; then
        echo "path: bug — a regression test must be observed failing before the fix."
        say "bug path: a regression test must be seen failing first"
        exit 0
      fi
      if jq -e '[.labels[].name] | index("ci")' .vincent-issue/issue.json > /dev/null; then
        echo "path: ci — the pinned gates must pass here; the pull request's CI proves the other platforms."
        say "ci path: gates pass here, then on all three in PR CI (this exit 3 is normal)"
        exit 3
      fi
      if jq -e '[.labels[].name] | index("enhancement")' .vincent-issue/issue.json > /dev/null; then
        echo "path: enhancement — no reproduction to prove; judged by the new behaviour."
        say "enhancement path: judged by the new behaviour (this exit 1 is normal)"
        exit 1
      fi
      echo "path: documentation — every claim re-verified against the source at HEAD."
      say "documentation path: claims checked against the source (this exit 2 is normal)"
      exit 2

  - id: diagnose
    name: Reproduce and diagnose
    type: agent
    if: '{{ eq (index .Steps "classify").ExitCode 0 }}'
    # The whole reason this step is separate from `implement`: it stops and asks
    # rather than inventing a reproduction it could not achieve.
    on_input: wait
    # Parking overnight while you sleep is fine. Parking forever is not.
    input_timeout: 12h
    timeout: 45m
    prompt: |
      You are diagnosing a GitHub bug report against this repository. You are
      NOT fixing it yet: do not change a single line of non-test code.

      The issue is in `.vincent-issue/issue.json` — number, title, body, state,
      labels, creation date and every comment. Read it first, comments
      included; reproduction details usually arrive in the thread rather than
      the body.

      You are on branch {{.Task.BranchName}}, based on {{.Task.BaseBranch}}, in
      a dedicated worktree at {{.Worktree.Path}}.

      This step is budgeted 45 minutes and can park in `awaiting_input` for
      half a day, so say what you are doing as you go:

          vincent status "<one short line about what you are doing now>"

      Run it before each numbered step below — "reading spec §12.4",
      "reproducing against internal/taskrun" — and again the moment you stop to
      ask the author: `vincent status "waiting on the reporter's OS and version"`
      is the difference between a row that looks hung and one that explains
      itself. Under ten words. When something is wrong, make the status say
      what is wrong: "cannot reproduce at HEAD", not "still working". The last
      thing you set stays on the finished step, so end on your verdict —
      "verdict: proceed, repro is a test in internal/store".

      Do this in order:

      1. Establish what the *correct* behaviour is, not just the reported one.
         This repository is spec-driven: `docs/spec.md` is the only spec and
         its section numbers are cited from the code. Read the sections that
         govern the reported area, read `CLAUDE.md`, and read any relevant
         document under `docs/tasks/`. A report is a claim about a mismatch
         between the code and the spec — find out which side is wrong before
         you touch either.

      2. Locate the defect. Read the code, follow the actual path, and name the
         precise line or decision that produces the wrong behaviour. "Something
         in the scheduler" is not a diagnosis.

      3. Check whether it is still a bug at HEAD. The report carries a version
         and a date; `git log` covers what has landed since. An issue that was
         already fixed is a `reject`, not a fix — say which commit fixed it.

      4. Reproduce it. Reproducing means: a command you can run in this
         worktree that fails *because of this bug* and would pass if the bug
         were absent. Then write that reproduction down as a **test in the
         repository**, in the package that owns the defect, following this
         repo's testing conventions (hermetic, no network, no real agent CLI,
         `internal/testrepo` / `agenttest` / `cmd/fakeagent` where they apply —
         see the testing section of `CLAUDE.md`). The test must fail right now,
         for the reported reason and not for an unrelated one.

         **You may create or modify test files only** — `*_test.go` and files
         under a `testdata/` directory. Do not touch production code in this
         step, and do not commit anything.

      5. Use the AskUserQuestion tool when — and only when — you genuinely
         cannot proceed without the author. The cases that warrant it:

         - **You cannot reproduce it.** Ask for the missing piece: exact
           version, OS, config, the full command, the daemon log around the
           failure. Say what you already tried, so the answer is worth the
           interruption.
         - **The spec and the report disagree.** If the code does exactly what
           `docs/spec.md` says and the reporter expected something else, the
           bug may be in the spec. Which one changes is the author's call, not
           yours — and if the answer is "the spec", note that the spec must be
           amended in this same branch with a dated note.
         - **The fix contradicts a recorded decision** — a "phase 2 decision",
           a "T1.5/T1.6 decision", a "PR G decision", or something in
           `docs/history/v0-tasks.md`. Those are outcomes of design sessions,
           not incidental notes. Never relitigate one silently.

         Batch related questions into as few calls as you can, with concrete
         options where you can offer them. If the report is clear and you
         reproduced it, ask nothing and move on.

      6. Write `.vincent-issue/brief.md`. Its **first line** must be exactly one
         of:

             verdict: proceed
             verdict: reject
             verdict: needs-info

         - `proceed` — reproduced, understood, and worth fixing here.
         - `reject` — this should not be fixed: it is working as specified,
           already fixed at HEAD, a duplicate, or out of scope. You must have
           asked the author before rejecting a report that describes real
           surprise.
         - `needs-info` — you asked, and what came back still is not enough to
           reproduce it. This is not the same as `reject`: the bug may well be
           real, and the issue stays open for a later run with better
           information. Use it rather than guessing at a fix.

         Below that first line write: what the wrong behaviour is, the exact
         location of the defect, why it happens, which spec sections govern it,
         which platforms are affected, what the fix should be, and any decision
         that came out of your questions — as settled decisions in prose, not
         as a Q&A transcript. On `reject` or `needs-info`, write why instead,
         and what would change the answer.

      7. Write `.vincent-issue/red-test.txt` — **one line**, the shell command
         that runs your failing test and nothing else, narrow enough to be
         fast. For example:

             go test ./internal/taskrun -run TestRecoverKillsVerifiedOrphan

         The next step runs this command and **fails the task if it passes**,
         because a regression test nobody ever saw fail proves nothing.

         If this bug genuinely cannot be captured by an automated test — a TUI
         rendering artifact, a wrong sentence in `docs/`, a defect on a
         platform this machine is not — write instead a single line:

             none: <one sentence saying why no test can capture this>

         Do not reach for that to save effort. It costs the fix its proof, and
         the reason is carried into the pull request that ships it.

         On `reject` or `needs-info`, write `none: <verdict>` here.

      Do not commit. Do not push. Do not run `gh` for anything that writes. Do
      not modify any file outside `.vincent-issue/`, `*_test.go`, and
      `testdata/`.
    # Asserts the artifacts exist and are machine-readable before later steps
    # branch on them, that nothing was committed, and that this step really did
    # keep its hands off production code — the last of those is what makes
    # `confirm-red`'s verdict meaningful, since a "failing" test proves nothing
    # if the fix already landed alongside it. A failure here retries with the
    # reason appended (§8.4).
    #
    # The last clause names the offending paths on stderr rather than just
    # exiting non-zero: a bare `test -z` prints nothing, and §8.4 hands the
    # retry the check's *output*, so an agent told only "check failed" would
    # have to guess which file it left behind.
    #
    # Written in `sh`: an agent step cannot pin a shell (§8.2).
    check: >
      test -s .vincent-issue/brief.md &&
      head -n 1 .vincent-issue/brief.md | grep -Eq '^verdict: (proceed|reject|needs-info)$' &&
      test -s .vincent-issue/red-test.txt &&
      git diff --cached --quiet &&
      test "$(git rev-list --count origin/{{.Task.BaseBranch}}..HEAD)" -eq 0 &&
      { offenders=$( { git diff --name-only; git ls-files --others --exclude-standard; } | grep -v '^\.vincent-issue/' | grep -vE '(_test\.go$|(^|/)testdata/)' ); test -z "$offenders" || { echo 'diagnose changed files outside .vincent-issue/, *_test.go and testdata/:' >&2; echo "$offenders" >&2; false; }; }
    check_timeout: 2m

  - id: digest
    name: Digest and clarify
    type: agent
    if: '{{ eq (index .Steps "classify").ExitCode 1 }}'
    # Same role as `diagnose` on the bug path: the step that is allowed to
    # stop and ask, rather than guessing at an ambiguous requirement or an
    # undecided design.
    on_input: wait
    input_timeout: 12h
    prompt: |
      You are evaluating a GitHub enhancement issue for this repository. You are
      NOT implementing it yet, and you must not change a single line of code.

      The issue is in `.vincent-issue/issue.json` — number, title, body, state,
      labels and every comment. Read it first.

      This step can park in `awaiting_input` for half a day, so say what you are
      doing as you go:

          vincent status "<one short line about what you are doing now>"

      Run it before each numbered step below, and again the moment you stop to
      ask the author — `vincent status "waiting on your call between two designs"`
      is the difference between a row that looks hung and one that explains
      itself. Under ten words. When something is wrong, make the status say what
      is wrong: "issue contradicts the phase 2 decision", not "still working".
      The last thing you set stays on the finished step, so end on your verdict.

      Do this in order:

      1. Understand what is being asked. Read enough of the codebase to know
         which packages and which spec sections it touches. This repository is
         spec-driven: read the relevant parts of `docs/spec.md` and any
         relevant document under `docs/tasks/`, and read `CLAUDE.md`.

      2. Check the issue against what is already true. It may already be
         implemented, may have been decided against, or may contradict a
         binding recorded decision — a "phase 2 decision", a "T1.5/T1.6
         decision", a "PR G decision", or something written in
         `docs/history/v0-tasks.md`. Those are outcomes of design sessions, not
         incidental notes. Never relitigate one silently.

      3. Use the AskUserQuestion tool to ask the author about anything you
         cannot resolve. Ask about two kinds of thing:

         - **Ambiguity** — undefined terms, unstated assumptions, missing
           acceptance criteria, edge cases the issue leaves open, behaviour it
           asserts without saying which component owns it.
         - **Approach** — where several valid designs exist and the choice is
           not obviously the author's stated one. A wrong architectural pick
           costs the entire pull request, so surface it now.

         If the issue conflicts with a recorded decision, that is a question,
         not a judgement call you make alone.

         Ask real questions with concrete options where you can offer them, and
         batch related questions into as few calls as you can. Do not guess and
         do not paper over a gap with a plausible-sounding sentence. If the
         issue is genuinely unambiguous and the approach is obvious, ask
         nothing and move on.

      4. Write `.vincent-issue/brief.md`. Its **first line** must be exactly one
         of:

             verdict: proceed
             verdict: reject
             verdict: needs-info

         - `proceed` — understood, agreed, and worth building here.
         - `reject` — this should not be built: already implemented, out of
           scope, or contradicting a decision the author has agreed to keep.
           You must have asked the author before rejecting; a reject they have
           not seen is not a verdict, it is a guess.
         - `needs-info` — you asked, and what came back still does not settle
           what should be built. The issue stays open for a later run.

         Below that first line, write the plan: what the change is, which files
         and packages it touches, which spec sections it amends if any, what
         the tests should prove, and the decisions that came out of your
         questions — written as settled decisions in prose, not as a Q&A
         transcript. On `reject` or `needs-info`, write why instead, and what
         would change the answer.

      Do not commit. Do not push. Do not run `gh` for anything that writes. Do
      not modify any file outside `.vincent-issue/`.
    # Asserts the artifact exists and is machine-readable before a later step
    # branches on it, and that this step really did keep its hands off the code.
    # Stricter than `diagnose`'s: an enhancement brief writes no test, so *any*
    # working-tree change is out of scope here.
    check: >
      test -s .vincent-issue/brief.md &&
      head -n 1 .vincent-issue/brief.md | grep -Eq '^verdict: (proceed|reject|needs-info)$' &&
      git diff --quiet &&
      git diff --cached --quiet
    check_timeout: 1m

  - id: survey
    name: Verify the documented claims
    type: agent
    if: '{{ eq (index .Steps "classify").ExitCode 2 }}'
    # The documentation path's brief step, in the role `diagnose` and `digest`
    # play on theirs: the step allowed to stop and ask. What it settles is
    # different — not a reproduction or a design, but which items of the issue
    # still stand at HEAD, what the source says each should read, and which of
    # them only a person can do.
    on_input: wait
    input_timeout: 12h
    timeout: 45m
    prompt: |
      You are scoping a GitHub documentation issue against this repository. You
      are NOT editing anything yet: do not change a single file.

      The issue is in `.vincent-issue/issue.json` — number, title, body, state,
      labels, creation date and every comment. Read it first, comments
      included.

      You are on branch {{.Task.BranchName}}, based on {{.Task.BaseBranch}}, in
      a dedicated worktree at {{.Worktree.Path}}.

      This step is budgeted 45 minutes and can park in `awaiting_input` for
      half a day, so say what you are doing as you go:

          vincent status "<one short line about what you are doing now>"

      Run it before each numbered step below, and again the moment you stop to
      ask the author — `vincent status "waiting on your call: 2 items need a
      person"` is the difference between a row that looks hung and one that
      explains itself. Under ten words. When something is wrong, make the
      status say what is wrong: "item 3 already fixed in 5c29c40", not "still
      working". The last thing you set stays on the finished step, so end on
      your verdict — "verdict: proceed, 6 of 7 items still stand".

      Do this in order:

      1. Read `CLAUDE.md`, all of it. Its documentation model is the rulebook
         for this issue. Public documentation is **derived from the source,
         not from planning records** — the config reference tracks
         `internal/config`, the CLI page the cobra tree, the API page the route
         table in `internal/api/server.go`, the TUI key tables
         `internal/tui/bindings.go`, the block reasons the `Reason*` constants
         — and the maintainer records (`docs/spec.md`, `docs/tasks/`,
         `docs/history/`, `docs/gates/`) each carry their own rules there. If
         the issue touches a task record, read `docs/tasks/README.md` too.

      2. Split the issue into its items. A documentation issue here is usually
         a list, each bullet one claim that is wrong, with a location. Treat
         each separately: they do not stand or fall together.

      3. **Verify every item at HEAD**, against the source of truth rather than
         against the issue. Issues here are often written by an audit at an
         older commit, so cited line numbers drift — find the text by content.
         For each item, establish:

         - what the documentation says now, and where (file and line at HEAD);
         - what the source it derives from says now, and where — the code, the
           config, the route table, `git log`, `gh run view`, `gh pr view`,
           whichever actually decides it;
         - whether the item **still stands**, is **already fixed** (name the
           commit), or is **itself wrong** — the issue's proposed correction
           does not match the source either; say what does;
         - every **other place** the same fact is stated. A stale count in one
           page is usually stale in three: search `docs/`, `README.md`,
           `CLAUDE.md`, `CONTRIBUTING.md`, `RELEASING.md` and `_data/` for it.

      4. Sort out what this workflow **cannot do**. An agent in a worktree can
         edit files, run the suite and the repository's scripts, and read
         GitHub. It cannot walk a manual gate or judge a screen "by eye" at a
         real terminal, cannot run a leg that needs a real agent CLI session,
         a real install through a package channel or a real GitHub write, and
         cannot produce evidence for something it did not run. Items in those
         classes are **human-only**.

         Nothing in this workflow may record a human-only item as done. A gate
         run record, a `✓ YYYY-MM-DD`, an `[x]` or a "verified" line with no run
         behind it is a false record, and worse than the gap it papers over.

         Screenshots are **not** human-only. Every `docs/assets/tui-*.png` comes
         from `scripts/screenshots.sh`, which a later step may run and extend
         with new seeds and tapes. It needs `vhs`, `ttyd` and `ffmpeg` — check
         with `command -v vhs ttyd ffmpeg`, and do not run the script here. A
         missing tool is a question for the author, never a reason to draw a
         screen.

      5. Use the AskUserQuestion tool when — and only when — you genuinely
         cannot settle an item without the author. The cases that warrant it:

         - **Human-only items.** Ask whether to scope them out of this run and
           deliver the rest. If every item that still stands is human-only,
           say so: that is a `reject` for this workflow, and the brief says a
           person must do it.
         - **The docs and the code disagree, and the code may be the wrong
           side.** Correcting a page to match a defect enshrines the defect.
           Whether the code changes instead is the author's call — and if it
           does, the issue wants the `bug` label and a run down that path, not
           this one.
         - **An item overturns a recorded decision** — a "phase 2 decision", a
           "T1.5/T1.6 decision", a "PR G decision", a task record's decision,
           something in `docs/history/v0-tasks.md`. Marking one superseded is a
           decision too; never make it silently.
         - **A tool an item needs is missing** from this machine.

         Batch related questions into as few calls as you can, with concrete
         options where you can offer them. If every item is verified and
         within reach, ask nothing and move on.

      6. Write `.vincent-issue/brief.md`. Its **first line** must be exactly one
         of:

             verdict: proceed
             verdict: reject
             verdict: needs-info

         and its **second line** exactly one of:

             closes: yes
             closes: no

         - `proceed` — at least one item still stands and is within reach.
         - `reject` — nothing is left for this workflow to do: every item is
           already fixed, wrong, or human-only. You must have asked the author
           before rejecting an issue with items that still stand.
         - `needs-info` — you asked, and what came back still does not settle
           what the correct text is. The issue stays open for a later run.
         - `closes: yes` only when this run delivers **every** item that still
           stands. Anything scoped out — human-only, or deferred by the author —
           makes it `closes: no`, and the pull request will then say
           `Part of #N` rather than closing the issue. On `reject` or
           `needs-info`, write `closes: no`.

         Below those two lines, one entry per item: the claim; every place it
         is stated; the source that decides it and what that source says; the
         status — `fix`, `already fixed in <sha>`, `issue wrong: <why>`,
         `human-only`, or `scoped out: <why>`; and for `fix`, the exact
         correction. Then any code the issue itself asks for — a test that makes
         a claim checkable, a gate script, a screenshot seed or tape — named as
         precisely as a plan. Decisions that came out of your questions go in as
         settled decisions in prose, not as a Q&A transcript. On `reject` or
         `needs-info`, write why instead, and what would change the answer.

      Do not commit. Do not push. Do not run `gh` for anything that writes. Do
      not modify any file outside `.vincent-issue/`.
    # `digest`'s check plus the second line. `closes:` is a machine-readable
    # line rather than a sentence in the body because `implement` turns it into
    # `Closes #N` or `Part of #N`, and that choice decides whether merging the
    # pull request closes an issue that still has a person's work in it.
    check: >
      test -s .vincent-issue/brief.md &&
      head -n 1 .vincent-issue/brief.md | grep -Eq '^verdict: (proceed|reject|needs-info)$' &&
      sed -n 2p .vincent-issue/brief.md | grep -Eq '^closes: (yes|no)$' &&
      git diff --quiet &&
      git diff --cached --quiet
    check_timeout: 1m

  - id: inspect
    name: Scope the CI change
    type: agent
    if: '{{ eq (index .Steps "classify").ExitCode 3 }}'
    # The ci path's brief step, in the role the other three play on theirs.
    # What it settles is where the proof for this change can come from: which
    # gate or job the issue is about, what is still true of it at HEAD, which
    # commands prove the change on this host, and which parts only the other
    # two platforms' CI — or only a person — can prove.
    on_input: wait
    input_timeout: 12h
    timeout: 45m
    prompt: |
      You are scoping a GitHub issue labeled `ci` against this repository. You
      are NOT implementing it yet: do not change a single file.

      The issue is in `.vincent-issue/issue.json` — number, title, body, state,
      labels, creation date and every comment. Read it first, comments
      included.

      You are on branch {{.Task.BranchName}}, based on {{.Task.BaseBranch}}, in
      a dedicated worktree at {{.Worktree.Path}}.

      This step is budgeted 45 minutes and can park in `awaiting_input` for
      half a day, so say what you are doing as you go:

          vincent status "<one short line about what you are doing now>"

      Run it before each numbered step below, and again the moment you stop to
      ask the author — `vincent status "waiting on your call: skip on macOS?"`
      is the difference between a row that looks hung and one that explains
      itself. Under ten words. When something is wrong, make the status say
      what is wrong: "052 gate already wired in ci.yml", not "still working".
      The last thing you set stays on the finished step, so end on your
      verdict — "verdict: proceed, one new m6 scenario".

      Do this in order:

      1. Read `CLAUDE.md`, all of it — its Commands section above all. It is
         the rulebook for gates: which gates `ci.yml` runs and why `m12` is the
         exception, why a gate script is committed executable, why a gate's
         workflow `run:` bodies are spelled in the intersection of `/bin/sh`
         and `pwsh`, why a multi-line `jq` capture needs `| tr -d '\r'`, and
         why nothing is ever piped into `grep -q`. Each of those was a real
         Windows-only or intermittent failure first.

      2. Read what CI actually runs. `.github/workflows/ci.yml` is the one an
         issue here is most often about: a `ci` job (lint,
         `go run mage.go testrace`, build) and a `gates` job running every gate
         as its own named step, each on `ubuntu-latest`, `macos-latest` and
         `windows-latest`. Read which of those branch protection requires on
         {{.Task.BaseBranch}}:
         `gh api "repos/$(gh repo view --json nameWithOwner --jq .nameWithOwner)/branches/{{.Task.BaseBranch}}/protection/required_status_checks"`.
         The other workflows are scheduled (`go-toolchain.yml`, `vuln.yml`),
         tag-driven (`release.yml`) or about the pull request itself. Then read
         the gate scripts the issue names, their records under `docs/gates/`,
         and the task record under `docs/tasks/` it cites.

      3. Work out which kind of issue this is, because the proof differs:

         - **A gate to write, extend or wire into CI.** The gate script is the
           proof, and it runs here.
         - **Test infrastructure** — a `cmd/fakeagent` or `cmd/fakegh`
           scenario, a helper a gate or an e2e test needs. Its tests are the
           proof, plus the gate leg it unblocks.
         - **A job that fails or flakes.** Read the runs, not the issue's
           summary of them: `gh run list --workflow <file>`,
           `gh run view <id> --log-failed`. Find the cause. If the cause is the
           product rather than CI or the test harness, that is a question for
           the author (below).
         - **A workflow change** — a schedule, a permission, a new job. Only
           GitHub runs it; `actionlint` is the only local proof there is.

      4. **Verify it at HEAD.** Issues here are often written by an audit at an
         older commit, and CI wiring lands on other branches all the time. Is
         the gate already a step in `ci.yml`? Does the scenario already exist?
         Has the job gone green since (`gh run list`)? Find things by content,
         not by cited line number. An issue that is already done is a
         `reject` — name the commit.

      5. Sort out what this workflow **cannot do**. It can edit files, run the
         suite and any gate script on this host, and read GitHub. It proves
         nothing about the platforms this machine is not: the pull request's
         own CI is the first run of the change there, and the merge train that
         lands it waits for it. It cannot walk a manual gate, cannot run a leg that needs a
         real agent CLI session, a container runtime this host lacks or a real
         GitHub write, and it cannot change a repository setting or a secret.
         Those items are **human-only**. Nothing in this workflow may record
         one as done: a gate run record, a `✓ YYYY-MM-DD` or an `[x]` with no
         run behind it is a false record.

         Check the push, too: `git remote get-url --push origin`. Over HTTPS, a
         push that touches `.github/workflows/` is refused unless the token
         carries the `workflow` scope, and `gh auth status` lists the scopes.
         Over SSH that scope is not involved. If the change edits a workflow
         file and the push would be refused, that is a question for the author
         now rather than a failed push after the whole run.

      6. Use the AskUserQuestion tool when — and only when — you genuinely
         cannot settle the plan without the author. The cases that warrant it:

         - **Human-only items.** Ask whether to scope them out and deliver the
           rest. If nothing within reach is left, that is a `reject`, and the
           brief says a person must do it.
         - **The fault is in the product.** A job red because the code is
           wrong wants the `bug` label and a run down that path, which proves a
           regression test red first. Ask before planning a product fix here.
         - **Proof weaker than CI's today.** A platform skipped for a gate,
           `continue-on-error`, a fixed wait lengthened instead of a cause
           found, a job dropped from the matrix. `m12`'s skip is the precedent
           and it states its reason; anything like it is the author's call,
           never yours.
         - **An item overturns a recorded decision** — a task record's
           decision, a "phase 2 decision", something in
           `docs/history/v0-tasks.md`.
         - **A tool or a permission is missing** — a container runtime,
           `actionlint`, the `workflow` scope.

         Batch related questions into as few calls as you can, with concrete
         options where you can offer them. If the issue is clear and within
         reach, ask nothing and move on.

      7. Write `.vincent-issue/brief.md`. Its **first line** must be exactly one
         of:

             verdict: proceed
             verdict: reject
             verdict: needs-info

         and its **second line** exactly one of:

             closes: yes
             closes: no

         - `proceed` — something within reach still needs doing.
         - `reject` — nothing is left for this workflow: already done, wrong,
           or human-only. You must have asked the author before rejecting an
           issue with work that still stands.
         - `needs-info` — you asked, and what came back still does not settle
           what should be built. The issue stays open for a later run.
         - `closes: yes` only when this run delivers **everything** the issue
           asks for that still stands. Anything scoped out makes it
           `closes: no`, and the pull request will then say `Part of #N`
           rather than closing the issue. On `reject` or `needs-info`, write
           `closes: no`.

         Below those two lines, the plan: which kind of issue this is and what
         is true of it at HEAD; every file the change touches — the gate
         script, the `ci.yml` step and its comment, the gate list in
         `CLAUDE.md`, the gate record under `docs/gates/`, the task record and
         its index row; each gate scenario and what it asserts from the API;
         which platform proves each leg, and where; the human-only items and
         what becomes of them; and the decisions that came out of your
         questions, written as settled decisions in prose, not as a Q&A
         transcript. On `reject` or `needs-info`, write why instead, and what
         would change the answer.

      8. Write `.vincent-issue/proof.txt` — the commands that must pass on this
         host once the change exists, **one per line**, run from the
         repository root, each as narrow as it can be while still proving the
         change. For example:

             ./scripts/052-gate.sh
             VINCENT_GATE_SCENARIO=12 ./scripts/m6-gate.sh
             go test ./internal/cli -run TestCrashRecoveryE2E

         A gate this change writes does not exist yet: name the path it will
         have. The next steps freeze this file before implementation starts,
         and every line then has to pass in `implement`'s check and on every
         cross-platform pass after it.

         If nothing about this change can run on this host — a schedule, a
         permission, a job only GitHub executes — write instead a single line:

             none: <one sentence saying why nothing here can run it>

         It costs the change its local proof, and the reason is carried into
         the pull request that ships it. On `reject` or `needs-info`, write
         `none: <verdict>`.

      Do not commit. Do not push. Do not run `gh` for anything that writes. Do
      not modify any file outside `.vincent-issue/`.
    # `survey`'s check plus the proof file. `closes:` is machine-readable for
    # the reason it is on the documentation path, and `proof.txt` has to exist
    # because `pin-proof` freezes it and `implement`'s check runs what it froze.
    check: >
      test -s .vincent-issue/brief.md &&
      head -n 1 .vincent-issue/brief.md | grep -Eq '^verdict: (proceed|reject|needs-info)$' &&
      sed -n 2p .vincent-issue/brief.md | grep -Eq '^closes: (yes|no)$' &&
      test -s .vincent-issue/proof.txt &&
      git diff --quiet &&
      git diff --cached --quiet
    check_timeout: 1m

  - id: triage
    name: Act on the verdict
    type: command
    shell: sh
    timeout: 1m
    # `reject` and `needs-info` are legitimate outcomes of a brief step, so
    # `diagnose`/`digest`/`survey`/`inspect` pass their checks either way. This
    # step is what turns one into a failed task with a legible reason, instead
    # of a pull request nobody wanted. The two are kept distinct on purpose:
    # `reject` means never, `needs-info` means re-run this task once the thread
    # has more in it.
    #
    # Path-independent: all four briefs are written to the same path with the
    # same verdict vocabulary, which is most of why merging the two workflows
    # was worth doing, and why the documentation and ci paths could join them.
    max_retries: 0
    # The status is what makes the two stopping verdicts tell themselves apart
    # on the board. Both exit 1 and both classify `nonzero_exit`, and the whole
    # point of keeping `reject` and `needs-info` distinct is lost if the row
    # cannot say which one it was — `reject` means never, `needs-info` means
    # re-run this task once the thread has more in it, and those are different
    # instructions to the person reading the board.
    run: |
      set -e
      say() { vincent status -- "$*" >/dev/null 2>&1 || true; }

      verdict=$(head -n 1 .vincent-issue/brief.md)
      case "$verdict" in
        'verdict: reject')
          say "brief rejected the issue: nothing will be implemented"
          echo "the brief rejected this issue; nothing will be implemented." >&2
          echo "--- brief.md ---" >&2
          cat .vincent-issue/brief.md >&2
          exit 1
          ;;
        'verdict: needs-info')
          say "needs info: re-run once the issue thread has more in it"
          echo "the issue could not be settled with the information available." >&2
          echo "it stays open; re-run this task once the thread has more in it." >&2
          echo "--- brief.md ---" >&2
          cat .vincent-issue/brief.md >&2
          exit 1
          ;;
      esac
      cat .vincent-issue/brief.md
      say "brief says proceed"

  - id: confirm-red
    name: Confirm the test fails
    type: command
    if: '{{ eq (index .Steps "classify").ExitCode 0 }}'
    shell: sh
    timeout: 15m
    # Deterministic by construction — a second identical run is the same run.
    max_retries: 0
    # The load-bearing step of the bug path, and the one thing no other path
    # has an equivalent of. It proves the regression test observes the bug,
    # in the one window where that is observable: after the test exists and
    # before the fix does.
    #
    # It also *freezes* the command into `green.sh`, which is what `implement`'s
    # check re-runs. Reading it back from `red-test.txt` there would let the
    # implement step move its own goalposts by rewriting the file; the copy
    # taken here was taken while the bug was still present.
    #
    # The red run's `2>&1` is there because this step's `.Result` is stdout
    # alone (§8.4), and it is the record a person reads to judge whether the
    # test fails for the reported reason. `go test` prints an
    # assertion failure on stdout but sends a compile error — the reason
    # behind its `FAIL ... [build failed]` line — to stderr, so without it the
    # record shows that the test failed and not why. Only that one command is
    # redirected: the refusals below stay on stderr, where the step summary
    # carries them for a run that blocks.
    run: |
      set -e
      say() { vincent status -- "$*" >/dev/null 2>&1 || true; }

      cmd=$(head -n 1 .vincent-issue/red-test.txt)
      if [ -z "$cmd" ]; then
        say "red-test.txt is empty"
        echo ".vincent-issue/red-test.txt is empty" >&2
        exit 1
      fi

      case "$cmd" in
        none:*)
          echo "NO AUTOMATED REPRODUCTION -${cmd#none:}"
          echo "this fix ships without a regression test; the delivery record and the"
          echo "pull request that ships it will say so."
          printf 'exit 0\n' > .vincent-issue/green.sh
          # A green step whose status says the proof is missing. This is the
          # escape hatch the file header calls "loud", and the board is one of
          # the places it has to be loud in.
          say "NO AUTOMATED REPRODUCTION: this fix ships without proof"
          exit 0
          ;;
      esac

      printf '%s\n' "$cmd" > .vincent-issue/green.sh
      echo "--- red run: $cmd ---"
      say "running the regression test against the unfixed code"
      if sh .vincent-issue/green.sh 2>&1; then
        say "the regression test passes unfixed: it does not capture the bug"
        echo "the reproduction command passed against the unfixed code:" >&2
        echo "  $cmd" >&2
        echo "it does not capture the reported bug. A regression test that was never" >&2
        echo "observed failing proves nothing about the fix." >&2
        exit 1
      fi
      echo "--- confirmed red: the test fails on the unfixed code ---"
      say "confirmed red: the test fails on the unfixed code"

  - id: pin-proof
    name: Pin the commands that must pass
    type: command
    if: '{{ eq (index .Steps "classify").ExitCode 3 }}'
    shell: sh
    timeout: 1m
    # A copy, not a run: a second identical run is the same run.
    max_retries: 0
    # The ci path's `confirm-red`, without the run. `implement`'s check and
    # every `verify-probe` execute `proof.sh`; reading `proof.txt` there
    # instead would let the step being judged delete the gate it could not
    # make pass. The copy taken here was taken before any of the change
    # existed.
    #
    # Nothing is run, because there is nothing to observe yet: the gate a line
    # names is usually the one `implement` is about to write, and a gate over
    # behaviour that already ships would pass unchanged and prove nothing by
    # it. The bug path's proof is a test seen red; this path's is the same
    # commands green here, then the pull request's CI green on all three
    # platforms.
    #
    # `set -ex` heads the pinned file. `-e` because it holds several lines and
    # `sh` would otherwise report only the last one's exit code — a red gate
    # followed by a green one would read as a pass. `-x` because its output
    # lands in a check failure or a repair prompt, where "which line" is the
    # first question.
    run: |
      set -e
      say() { vincent status -- "$*" >/dev/null 2>&1 || true; }

      # Blank lines go first: an agent's trailing newline is not a command,
      # and a file of nothing but blank lines names none.
      grep -v '^[[:space:]]*$' .vincent-issue/proof.txt > .vincent-issue/proof.lines || true
      if [ ! -s .vincent-issue/proof.lines ]; then
        say "proof.txt names no command"
        echo ".vincent-issue/proof.txt names no command" >&2
        exit 1
      fi

      first=$(head -n 1 .vincent-issue/proof.lines)
      case "$first" in
        none:*)
          echo "NO LOCAL PROOF -${first#none:}"
          echo "nothing about this change runs on this host; the pull request's CI is"
          echo "all that stands between it and the base branch."
          printf 'exit 0\n' > .vincent-issue/proof.sh
          # Loud for the reason `confirm-red`'s escape hatch is loud: a green
          # row whose status says the proof is missing.
          say "NO LOCAL PROOF: only the PR's CI will run this change"
          exit 0
          ;;
      esac

      { echo 'set -ex'; cat .vincent-issue/proof.lines; } > .vincent-issue/proof.sh
      echo "--- pinned: these must pass here, in implement's check and on every verify pass ---"
      cat .vincent-issue/proof.lines
      say "pinned $(wc -l < .vincent-issue/proof.lines | tr -d ' ') command(s) that must pass here"

  - id: implement
    name: Implement the change
    type: agent
    timeout: 45m
    # Two attempts, not the default one: this step's check is self-healing — a
    # still-red regression test, a failing suite or a lint finding comes back in
    # the §8.4 failure block and the second attempt fixes it. The expensive,
    # non-self-healing checks live in `verify` instead.
    max_retries: 2
    # One step for all four paths. The `{{if}}` covers exactly what differs —
    # the framing, the path-specific rules, the frozen command on the bug and
    # ci paths and the `Closes`/`Part of` choice on the documentation and ci
    # paths — and everything below it is the same work whichever path ran.
    prompt: |
      {{- if eq (index .Steps "classify").ExitCode 0 }}
      Fix the bug diagnosed in `.vincent-issue/brief.md`. That diagnosis is the
      agreed scope — the author has already answered the open questions and
      those answers are written into it as decisions. Do not re-open them and do
      not expand the scope. The original report is still in
      `.vincent-issue/issue.json` for reference.

      The regression test for this bug is already written and already failing;
      it was run against the unfixed code and observed to fail, which is what
      makes it worth anything. `.vincent-issue/green.sh` runs exactly that test.

      Rules for the fix itself:

      - **Fix the cause, not the symptom.** The diagnosis names the defect;
        repair that. A guard added at the call site that leaves the broken
        function broken is not a fix.
      - **Make the smallest change that does it.** A bug fix is not the place
        for the refactor you noticed on the way past. If you find a second,
        unrelated bug, say so in the PR body rather than fixing it here.
      - **Do not weaken the test to make it pass.** If the test turns out to
        assert the wrong thing, say so explicitly in the PR body and explain
        what you changed about it and why — silently relaxing an assertion is
        the one failure mode this whole workflow exists to prevent.

      Commit the regression test and the fix, test first if you split them. A
      bug fix is `fix:` unless it truly is not.
      {{- else if eq (index .Steps "classify").ExitCode 2 }}
      Make the documentation change scoped in `.vincent-issue/brief.md`. That
      survey is the agreed scope — every item in it was verified against the
      source at HEAD, and the author's answers are written into it as
      decisions. Do not re-open them, do not expand the scope, and leave alone
      every item the survey marked already fixed, wrong, human-only or scoped
      out. The original issue is still in `.vincent-issue/issue.json` for
      reference.

      `CLAUDE.md`'s documentation model is the rulebook; read it first. The
      rules that bite hardest:

      - **The source decides**, not the issue and not the survey. Re-read the
        source for each correction as you make it. If it no longer says what
        the survey recorded, write what it says now and note the difference in
        the PR body.
      - **Fix every copy.** The survey lists each place a fact is stated. A
        count corrected in one page and left in another is two claims that now
        disagree.
      - **`docs/spec.md`** is amended in place with a dated note, and a section
        is never renumbered. In **`docs/tasks/`** a status marker changes with
        its row in `docs/tasks/README.md` in the same edit, a `[x]` carries its
        `✓ YYYY-MM-DD`, a task is never deleted, and a superseded decision is
        marked superseded, dated, pointing at what replaced it.
        **`docs/history/v0-tasks.md`** is frozen.
      - **Record only what happened.** A gate run record, a `✓` date, a ticked
        box or a "verified" line needs a run behind it — one you performed in
        this session, or one you can cite by URL or commit. A human-only item
        stays open; you do not write it up.
      - **Never draw a screen.** Screenshots come only from
        `scripts/screenshots.sh`. If the survey scoped screenshot work, extend
        its seeds and tapes, run it, and commit the PNGs it produced — mind the
        two VHS traps `CLAUDE.md` records. Never edit a PNG by hand, and never
        hand-edit the generated social cards under `docs/assets/social/`
        (`scripts/social-cards.py` makes them). `_data/seo_pages.json` and
        `_data/why_articles.json` change with the pages they describe.
      - Write `vincent` with a lowercase `v` in prose.
      - Code the survey scoped — a test that makes a documented claim
        checkable, a gate script, CI wiring — follows this repository's code
        conventions like any other change, and a new gate script is committed
        executable and follows the gate rules in `CLAUDE.md`.

      Commit it: `docs:` for the documentation, `test:` or `ci:` for code the
      survey scoped. A correction belongs in `CHANGELOG.md` only if a user
      acting on the old text would have done the wrong thing.
      {{- else if eq (index .Steps "classify").ExitCode 3 }}
      Make the CI change planned in `.vincent-issue/brief.md`. That plan is the
      agreed scope — it was checked against what CI runs at HEAD, and the
      author's answers are written into it as decisions. Do not re-open them,
      do not expand the scope, and leave alone every item it marked human-only
      or scoped out. The original issue is still in `.vincent-issue/issue.json`
      for reference.

      `.vincent-issue/proof.sh` holds the commands the plan said must pass on
      this host, frozen before you started. This step's check runs it, and so
      does every cross-platform pass after it.

      `CLAUDE.md`'s Commands section is the rulebook; read it first. Every one
      of these rules is there because a Windows leg or an intermittent run
      found it:

      - **A gate script is committed executable**:
        `git update-index --chmod=+x scripts/<name>.sh`. `chmod` on Windows
        never reaches the index and Git Bash ignores the bit, so a
        non-executable gate passes there and fails both POSIX legs with exit
        126. The check asserts the mode of every `scripts/*.sh`.
      - **A gate's workflow `run:` bodies** run under the daemon's shell —
        `/bin/sh` or `pwsh` — so they are spelled in the intersection of the
        two: `exit N` as the whole body, `sleep N`, `git ...`. Assert
        concurrency and timing from the API, never from inside a step body.
      - **In the gate's own bash**, a multi-line `jq` capture gets
        `| tr -d '\r'`, and nothing is piped into `grep -q`, `head` or any
        other consumer that exits early: capture first, then match a
        here-string.
      - **A gate is self-isolating**: its own `mktemp -d` state via
        `VINCENT_CONFIG_DIR` and `VINCENT_DATA_DIR`, its own port read from
        `daemon.json`, `trap cleanup EXIT`. Copy the shape of the nearest
        existing gate rather than inventing one.
      - **Wiring** is a named step in `ci.yml`'s `gates` job, with the comment
        every other step there carries — what the gate proves, and why all
        three platforms matter to it — and the gate added to the list in
        `CLAUDE.md`'s Commands section in the same change.
      - **Never make CI green by proving less.** No `continue-on-error`, no
        platform skipped, no fixed wait lengthened to outlast a cause you have
        not found, no job dropped from the matrix — unless the plan records the
        author deciding it, and then the skip says why, the way `m12`'s does.
      - **Record only what happened.** A gate record under `docs/gates/` gets a
        run line for a run you performed in this session, on this host, and
        no other; the other platforms are recorded from their CI runs, never
        predicted here. A task's `[x]` and `✓ YYYY-MM-DD` need the same, and
        change with its row in `docs/tasks/README.md` in the same edit.

      Commit it: `ci:` for workflow wiring, `test:` for gates and test
      infrastructure, `fix:` where a job was red because of the code, `docs:`
      for the records.
      {{- else }}
      Implement the enhancement described in `.vincent-issue/brief.md`. That
      plan is the agreed scope — the author has already answered the open
      questions and those answers are written into it as decisions. Do not
      re-open them and do not expand the scope beyond it. The original issue is
      still in `.vincent-issue/issue.json` for reference.

      Write the code and **commit it**.
      {{- end }}

      You are on branch {{.Task.BranchName}}, based on {{.Task.BaseBranch}}, in
      a dedicated worktree at {{.Worktree.Path}}.

      This step is budgeted 45 minutes and its check runs the whole suite and
      the linter afterwards, so say what you are doing as you go:

          vincent status "<one short line about what you are doing now>"

      Before each phase — reading the brief, writing the fix, running the tests,
      writing the PR body. Under ten words. If a test or the linter is red, set
      the status to what is actually red: "3 tests red in internal/store", not
      "fixing tests". That sentence is the one thing a `check_failed` reason
      cannot carry, and it is what a person sees on the board when this step
      burns its second attempt.

      **Cross-platform is a hard requirement** (`CLAUDE.md`): Windows, macOS and
      Linux all run the full suite. Platform-specific code goes in `_unix.go` /
      `_windows.go` / `_darwin.go` / `_linux.go`. Never assume a POSIX shell,
      `/`-separated paths, or signal semantics.

      Commits follow Conventional Commits (`feat`, `fix`, `docs`, `ci`, `chore`,
      `refactor`, `test`). Never add a co-author trailer.

      This repository's pull request template makes five claims. Satisfy the
      ones that apply and be honest about the ones that do not:

      - A plain-language PR title, carrying no Conventional Commit prefix.
      - Conventional Commits.
      - Tests added or updated for behaviour changes.
      - User-visible changes noted under `## [Unreleased]` in `CHANGELOG.md` —
        a bug a user could hit belongs there too.
      - The affected page under `docs/` updated — the config reference tracks
        `internal/config`, the CLI page the cobra tree, the API page the route
        table in `internal/api/server.go`, the TUI key tables
        `internal/tui/bindings.go`, the block reasons the `Reason*` constants.

      If the change makes something in `docs/spec.md` no longer true — or if the
      brief concluded that the spec was the side that was wrong — amend the spec
      in this same branch with a dated note. That is a hard rule of this
      repository, not a nicety.

      Then write two more files:

      - `.vincent-issue/pr-title.txt` — one line, plain language, no trailing
        prose, and never a Conventional Commits prefix: `Add workflow fields`,
        never `feat: add workflow fields`. A prefix belongs on the commits, not
        on the pull request — GitHub copies the title into the merge commit
        body, so a prefixed title makes Release Please record the change twice,
        and `.github/workflows/pr-title.yml` is a required check that fails the
        pull request for it.
      - `.vincent-issue/pr.md` — the pull request body, following
        `.github/PULL_REQUEST_TEMPLATE.md`. Under **Related**, write
        `Closes #<the issue number from issue.json>` so merging the PR closes
        the issue.
        {{- if eq (index .Steps "classify").ExitCode 0 }}
        Say plainly what the root cause was and how the regression test would
        catch it coming back.
        {{- else if eq (index .Steps "classify").ExitCode 2 }}
        **Except** when the second line of `.vincent-issue/brief.md` is
        `closes: no`: then write `Part of #<the issue number>` instead, and
        list under it every item this change leaves open and why, so merging
        does not close an issue that still has work in it.
        {{- else if eq (index .Steps "classify").ExitCode 3 }}
        **Except** when the second line of `.vincent-issue/brief.md` is
        `closes: no`: then write `Part of #<the issue number>` instead, and
        list under it every item this change leaves open and why. Either way,
        say which commands in `.vincent-issue/proof.sh` passed on this host,
        and that this pull request's own CI is the first run on the platforms
        this machine is not.
        {{- end }}
        Tick a checklist box only if you actually did that thing; a checklist
        ticked unconditionally is worth nothing to the reviewer, and leaving a
        box unticked with a one-line reason is the correct outcome when it does
        not apply.

      **Never stage or commit `.vincent-issue/`.** It is scratch space for this
      workflow and must not appear in the diff — do not `git add -A` without
      excluding it. A later step deletes it.
    # Cheap assertions first, so an obvious failure does not wait out a full
    # test run: scratch stayed untracked, something was actually committed (an
    # empty branch would only fail at `deliver`, after the whole verify loop),
    # the PR artifacts the delivery record carries exist. Then — on the bug path
    # only — the narrow regression test, which is the specific thing that task
    # is for and the fastest signal that the fix works. Then the real bar.
    #
    # `green.sh` was frozen by `confirm-red` while the bug was still present, so
    # that clause re-runs exactly the command that was observed failing. It is
    # rendered away entirely on the other two paths, where `confirm-red` was
    # skipped and no such file exists.
    #
    # The documentation path keeps the suite and the linter as its bar, and
    # not out of habit: the docs-claims tests in `internal/cli` assert what the
    # published pages say, so a correction that breaks one fails here.
    #
    # The ci path runs `proof.sh` in the slot `green.sh` takes on the bug
    # path, frozen by `pin-proof` for the same reason. The mode clause runs on
    # every path, because the trap it catches is not a ci-path trap: a script
    # under `scripts/` committed without its executable bit passes on Windows,
    # where Git Bash ignores the bit, and fails both POSIX legs with exit 126
    # (CLAUDE.md). It names the scripts, because §8.4 hands the retry this
    # output. 25 minutes rather than 15 because on the ci path gates run before
    # the suite; on the other paths a ceiling costs nothing.
    #
    # The title clause carries the same pattern `.github/workflows/pr-title.yml`
    # rejects a pull request title with, so a conventional prefix fails here —
    # where §7.2 can retry it against the `max_retries` this step already has —
    # rather than landing as a red required check no step in this workflow can
    # see and a human has to notice on GitHub (issue #450). It reads the file
    # directly, so CLAUDE.md's "never pipe into `grep -q`" SIGPIPE trap does
    # not apply, and the `test -s` before it is what guarantees the file exists.
    check: >
      ! git ls-files .vincent-issue | grep -q . &&
      test "$(git rev-list --count origin/{{.Task.BaseBranch}}..HEAD)" -gt 0 &&
      test -s .vincent-issue/pr-title.txt &&
      { ! grep -Eq '^[a-z][a-z0-9_-]*(\([^)]+\))?!?:[[:space:]]+' .vincent-issue/pr-title.txt || { echo 'pr-title.txt carries a Conventional Commit prefix, which .github/workflows/pr-title.yml rejects; write a plain-language title:' >&2; cat .vincent-issue/pr-title.txt >&2; false; }; } &&
      test -s .vincent-issue/pr.md &&
      { noexec=$(git ls-files -s -- 'scripts/*.sh' | awk '$1 != "100755" { print $4 }'); test -z "$noexec" || { echo 'scripts not committed executable (git update-index --chmod=+x):' >&2; echo "$noexec" >&2; false; }; } &&
      {{if eq (index .Steps "classify").ExitCode 0}}sh .vincent-issue/green.sh &&{{end}}
      {{if eq (index .Steps "classify").ExitCode 3}}sh .vincent-issue/proof.sh &&{{end}}
      go run mage.go test &&
      go run mage.go lint
    check_timeout: 25m

  - id: docs-scope
    name: List what the change touched
    type: command
    shell: sh
    timeout: 2m
    max_retries: 0
    # This is a data step first and a guard second. Its stdout is the list of
    # behaviour-bearing files the audit prompt reads, and its exit code is what
    # skips the audit for a change that touched nothing but tests — the only
    # kind that cannot make a documented claim false.
    #
    # `pre-docs.sha` is taken here rather than derived later: the audit's check
    # needs to know which commits are *its own*, and `implement` may well have
    # left several.
    allow_failure: true
    # The second `allow_failure` step whose red row is a normal outcome: exit 1
    # here means "nothing but tests changed", which is a saving, not a fault.
    # The status says so, because `nonzero_exit` cannot.
    #
    # Set before `grep` runs, not after, because grep's exit code has to be the
    # last thing this script does — anything after it would become the step's
    # exit code and destroy the guard `docs-sync` reads.
    run: |
      set -e
      say() { vincent status -- "$*" >/dev/null 2>&1 || true; }

      git rev-parse HEAD > .vincent-issue/pre-docs.sha
      git diff --name-only origin/{{.Task.BaseBranch}}..HEAD > .vincent-issue/changed.txt
      # `|| true` and the default together: `grep -c` exits 1 on no match, and
      # an unset `n` would make the `[` below a syntax error rather than a
      # count — either of which would kill this step under `set -e` and take
      # the guard `docs-sync` reads with it.
      n=$(grep -cvE '(_test\.go$|(^|/)testdata/)' .vincent-issue/changed.txt || true)
      n=${n:-0}
      if [ "$n" -eq 0 ]; then
        say "tests only: the documentation audit is skipped"
      else
        say "$n behaviour-bearing file(s) changed: auditing the docs"
      fi
      # grep's exit code is the step's: 1 means nothing outside tests changed.
      grep -vE '(_test\.go$|(^|/)testdata/)' .vincent-issue/changed.txt

  - id: docs-sync
    name: Bring the documentation up to date
    type: agent
    if: '{{ eq (index .Steps "docs-scope").ExitCode 0 }}'
    timeout: 30m
    max_retries: 1
    # `implement` is already told to update the affected page, and this step
    # exists because a step that is doing something else does that badly. This
    # one has one job, sees the finished change rather than the one it is
    # partway through writing, and is checked against the derived-source rules
    # in CLAUDE.md rather than against a checklist it wrote itself.
    #
    # It runs *before* `verify` on purpose: it may edit
    # `skills/vincent-workflows/SKILL.md`, which `skills/embed.go` embeds into
    # the built-in `create-workflow` workflow at build time, or the header in
    # `internal/workflow/builtin.go`. Those are code. Putting the audit after
    # the cross-platform legs would mean the legs never saw them.
    prompt: |
      The change for this issue is written, committed and passing
      `go run mage.go test` and `go run mage.go lint`. Your job is the
      documentation, and nothing else.

      This is an **audit**. "Nothing needed changing" is a normal and frequent
      outcome — say so and stop. Do not rewrite prose that is still true, do
      not restructure a page you happen to be reading, and do not add a
      paragraph about the change to a page that never mentioned that area.

      Say what you are auditing as you go, so the board is not a blank
      `running` row for half an hour:

          vincent status "<one short line about what you are doing now>"

      One before each derivation you check — "checking the CLI page against the
      cobra tree" — and one when you commit. Under ten words. End on the
      verdict you are about to write into `docs.md`: "docs: none needed, 6
      derivations checked" or "docs: updated spec §7.9 and the schema page".
      That last message is what stays on the finished step.

      What the change touched:

      {{ (index .Steps "docs-scope").Result }}

      The plan it was written against is `.vincent-issue/brief.md`, the drafted
      pull request body is `.vincent-issue/pr.md`, and the original issue is
      `.vincent-issue/issue.json`.
      {{- if eq (index .Steps "classify").ExitCode 2 }}

      **This change is itself a documentation change.** The issue is labeled
      `documentation`, and `brief.md` is a survey of claims rather than a plan.
      So you are the second reader, not the first, and the audit has two more
      jobs:

      - Re-verify every claim the diff adds or changes against the source at
        HEAD. A correction that is itself wrong is worse than the stale text it
        replaced, because it now looks audited.
      - Find the copies of each corrected fact the change missed. Fix the ones
        inside the paths you may edit; report the rest.

      A gate run record, a `✓` date or a ticked task in the diff with nothing
      to show it happened is a finding. Report it in `docs.md` and in the PR
      body; do not quietly delete it.
      {{- end }}
      {{- if eq (index .Steps "classify").ExitCode 3 }}

      **This change is CI work.** The issue is labeled `ci`, so beside the
      derivations below there are three records that describe CI, and the
      audit checks them first:

      - The gate list in `CLAUDE.md`'s Commands section tracks `ci.yml`'s
        `gates` job and `scripts/*-gate.sh`. A gate this change added or wired
        that is missing there, or a sentence counting the gates that no longer
        counts right, is stale. On this path you may edit `CLAUDE.md` for that,
        and for nothing else in it.
      - A gate record under `docs/gates/` says when a gate last ran and where.
        A run line for a platform nobody ran, or a date with no run behind it,
        is a finding: report it in `docs.md` and in the PR body; do not quietly
        delete it.
      - A task the change completes has its status marker and its row in
        `docs/tasks/README.md` changed together — and only if the gate that
        proves it actually passed.
      {{- end }}

      Read `CLAUDE.md` first. Public documentation there is **derived from the
      source, not from planning records**, and each derivation is a rule you
      check one at a time:

      - `internal/config` → `docs/reference/configuration.md`
      - the cobra tree → `docs/reference/cli.md`
      - the route table in `internal/api/server.go` → `docs/reference/api.md`
      - `internal/tui/bindings.go` → the key tables in `docs/guides/tui.md`
      - the `Reason*` constants in `internal/worktree` and
        `internal/taskrun/engine.go` → the block-reason tables
      - `internal/workflow` and `internal/taskrun`'s step types →
        `docs/reference/workflow-schema.md` and `docs/reference/task-lifecycle.md`
      - `internal/agent/*` → `docs/guides/agents.md` and spec §9.x. A capability
        an adapter lacks is **stated, never emulated** — if this change altered
        what an adapter can do, the page says so plainly.
      - anything a user can see → `docs/features.md`, the relevant
        `docs/guides/` page, and `## [Unreleased]` in `CHANGELOG.md`

      Then the records that are not derived from anything:

      - **`docs/spec.md`** is the only spec, is deliberately unversioned, and is
        amended **in place with a dated note, in the same PR as the code that
        makes the amendment true**. If this change made a sentence in it false,
        that is a hard rule of this repository, not a nicety. Its section
        numbers are cited from code comments, so never renumber one.
      - **`docs/tasks/`** — if this change completes or advances a task, update
        its status marker and the index row in `docs/tasks/README.md` **in the
        same edit**. Never delete a task.
      - **`docs/gates/`** — if the behaviour a gate walks through changed, the
        walkthrough changed.
      - `docs/history/v0-tasks.md` is **closed and frozen**. Read it, never
        edit it.

      One file is not documentation at all:

      - **`skills/vincent-workflows/SKILL.md` is runtime text.**
        `skills/embed.go` embeds it and `internal/workflow/builtin.go` splices
        it into the built-in `create-workflow` workflow's prompt at build time
        (task 024). Editing it changes what the daemon tells an agent to do. If
        this change altered the workflow schema — a step type, a field, a
        validation rule, a template variable, a human-interaction mechanism —
        that file is out of date and is part of this pull request. The three
        standing corrections the prompt applies to it live in
        `createWorkflowHeader` in `internal/workflow/builtin.go` and **never in
        the skill**; if one of those needs to change, change it there.

      Two things you must **not** do:

      - **Never draw a screen.** No ASCII mock-up of a panel, no hand-written
        "example" frame. Every `docs/assets/tui-*.png` is a capture of the
        running TUI produced by `scripts/screenshots.sh`, and that script needs
        VHS, ttyd and ffmpeg and seeds a throwaway daemon. Do not run it. If a
        panel in the pictures no longer matches the code, write that down in
        the report below and in `.vincent-issue/pr.md`, and leave the images
        alone — a person re-runs the script.
      - **Do not touch anything outside** `docs/`, `skills/`, `CHANGELOG.md`,
        `README.md`{{ if eq (index .Steps "classify").ExitCode 3 }}, `CLAUDE.md`{{ end }} and `internal/workflow/builtin.go`. If you find a bug in
        the change itself, report it rather than fixing it here; this step's
        commits are documentation commits.

      This repository's own `.vincent/workflows/*.yaml` are consumers of the
      schema too. If the schema changed under them, fix them — this step's
      check runs both `vincent workflow validate` and `vincent workflow render`
      over every one of them, so a template that parses but no longer executes
      fails here rather than at the first task created from it.

      Then:

      1. **Commit** whatever you changed, `docs:` (or `chore:` for the skill),
         separately from the implementation commits.
      2. Update `.vincent-issue/pr.md` so its checklist tells the truth about
         the documentation and CHANGELOG boxes, and so anything you found but
         did not fix — a stale screenshot, a bug in the change — is written in
         the body where the reviewer will see it.
      3. Write `.vincent-issue/docs.md`. Its **first line** must be exactly one
         of:

             docs: updated
             docs: none needed

         Below it, list every page you changed and what claim was stale, or —
         on `none needed` — name the derivations you checked and why each was
         already true. A `none needed` that names nothing is not an audit.

      Never stage or commit `.vincent-issue/`.
    # Four assertions. The report exists and is machine-readable, because
    # `deliver` carries it into the delivery record. The worktree is committed and the scratch directory
    # is still untracked. The step stayed inside its lane — the offenders
    # clause names the paths on stderr rather than exiting silently, because
    # §8.4 hands the retry this output and "check failed" tells an agent
    # nothing. And the tree still builds, the repo's own workflow files still
    # validate *and* still render — `validate` only parses a template, so a
    # `{{.Task.Titel}}` or a `.Steps.plan.Reslt` this change introduced passes
    # it and fails at the first task created from the file; `render` executes
    # every one of them offline and is the half that catches that — and the
    # packages whose tests assert what the published pages and the embedded
    # skill say still pass.
    #
    # It deliberately does not re-run the full suite: `verify` is next.
    #
    # On the ci path the lane also takes in `CLAUDE.md`, whose gate list is
    # derived from `ci.yml`'s `gates` job the way the pages are derived from
    # the code.
    check: >
      test -s .vincent-issue/docs.md &&
      head -n 1 .vincent-issue/docs.md | grep -Eq '^docs: (updated|none needed)$' &&
      ! git ls-files .vincent-issue | grep -q . &&
      git diff --quiet &&
      git diff --cached --quiet &&
      { offenders=$(git diff --name-only "$(cat .vincent-issue/pre-docs.sha)"..HEAD | grep -vE '^(docs/|skills/|CHANGELOG\.md$|README\.md${{ if eq (index .Steps "classify").ExitCode 3 }}|CLAUDE\.md${{ end }}|internal/workflow/builtin\.go$)'); test -z "$offenders" || { echo 'docs-sync changed files outside docs/, skills/, CHANGELOG.md, README.md{{ if eq (index .Steps "classify").ExitCode 3 }}, CLAUDE.md{{ end }} and internal/workflow/builtin.go:' >&2; echo "$offenders" >&2; false; }; } &&
      go build -o .vincent-issue/vincent ./cmd/vincent &&
      { for f in .vincent/workflows/*.yaml; do .vincent-issue/vincent workflow validate "$f" && .vincent-issue/vincent workflow render "$f" > /dev/null || exit 1; done; } &&
      go test ./internal/config ./internal/cli ./internal/workflow ./internal/api
    check_timeout: 15m

  - id: verify
    name: Verify across platforms
    type: loop
    # Four probes and three repairs. `defaults.timeout` bounds the *whole* loop
    # (§7.8), not an iteration, so it has to be stated here or the loop is
    # killed 30 minutes in, mid-repair.
    count: 4
    timeout: 5h
    steps:
      - id: verify-probe
        name: Run the cross-platform legs
        type: command
        shell: sh
        timeout: 30m
        # A probe never retries — a second identical run is the same run — and
        # `allow_failure` is what turns a red leg into something the `break`
        # guard and the repair prompt can read instead of a blocked task.
        max_retries: 0
        allow_failure: true
        # These are the legs CLAUDE.md requires before pushing but that are too
        # slow to put in `implement`'s check. `testrace` needs cgo and a C
        # compiler; on a machine without one this fails, and that is the honest
        # answer rather than a silently skipped race detector — which matters
        # more for a bug fix than for a feature, since "intermittent" is how
        # half of them are reported. That failure is also not one an agent can
        # repair, which is what `verify-final` exists to stop.
        #
        # The GOOS loop is not decorative: `go tool golangci-lint` cross-*builds*
        # the linter and then cannot run it, so the linter is built for the host
        # once and re-run per target. A host-only lint hides every finding in a
        # build-tagged file — exactly where a platform-specific bug fix lands.
        # The clearest case in this file for a status per phase. Four legs run
        # under one `set -e`, so the step dies at the first red one and the
        # status set just before it is still standing — the finished attempt
        # then reads "linting GOOS=windows" and a person knows which of the
        # four failed without opening a 20-minute transcript. `check_failed`
        # and `nonzero_exit` cannot say that.
        #
        # The loop index is in the message because this step runs up to four
        # times and the board shows the latest attempt: without the pass number
        # the same four messages cycle with nothing to date them. (This is a
        # YAML comment, outside the `run:` scalar, so the braces below are not
        # rendered here — a template action in a comment *inside* the body
        # would be.)
        # `exec 2>&1` on the first line because `repair`'s prompt quotes this
        # step's `.Result`, which is stdout alone (§8.4). golangci-lint writes
        # its findings there, but `go run mage.go testrace` does not write a
        # *compile* failure there: `go test` prints test failures on stdout and
        # sends the build error behind `FAIL ... [build failed]` to stderr. A
        # GOOS-tagged file that stopped compiling is the commonest thing this
        # loop exists to repair, and without this the repair session is handed
        # the word FAIL and no reason.
        #
        # On the ci path the probe also runs `proof.sh` — a gate that went red
        # after `docs-sync` or a repair is exactly what this loop is for — and
        # `actionlint` over the workflow files the branch changed.
        # `-shellcheck=` turns off the half of actionlint that `ci.yml` already
        # fails at HEAD (`./bin/vincent* version` is SC2211); the half left is
        # the schema and expression check that catches a broken workflow before
        # GitHub does. A host without actionlint says so in the output rather
        # than failing: the tool is optional, and the pull request's CI is the
        # real judge of a workflow file. The step's 30 minutes are for the
        # gates; four probes and three repairs still fit the loop's 5h.
        run: |
          exec 2>&1
          set -e
          say() { vincent status -- "$*" >/dev/null 2>&1 || true; }
          pass="pass {{.Loop.Index}}/4"

          say "$pass: go run mage.go testrace"
          go run mage.go testrace
          LINT=$(go tool -n golangci-lint)
          for os in windows darwin linux; do
            echo "--- golangci-lint GOOS=$os ---"
            say "$pass: linting GOOS=$os"
            GOOS=$os "$LINT" run ./...
          done
          {{- if eq (index .Steps "classify").ExitCode 3 }}
          echo "--- pinned proof: .vincent-issue/proof.sh ---"
          say "$pass: running the pinned gate commands"
          sh .vincent-issue/proof.sh
          workflows=$(git diff --name-only --diff-filter=d origin/{{.Task.BaseBranch}}..HEAD -- .github/workflows)
          if [ -n "$workflows" ]; then
            if command -v actionlint >/dev/null 2>&1; then
              echo "--- actionlint -shellcheck= ---"
              say "$pass: actionlint on the changed workflows"
              actionlint -shellcheck= $workflows
            else
              echo "--- actionlint is not installed: the changed workflow files are unlinted here ---"
            fi
          fi
          {{- end }}
          say "$pass: race detector{{ if eq (index .Steps "classify").ExitCode 3 }}, all three lint targets and the pinned gates{{ else }} and all three lint targets{{ end }} green"

      - id: verify-ok
        name: Stop once the legs are green
        type: break
        if: '{{ eq (index .Steps "verify-probe").ExitCode 0 }}'

      - id: repair
        name: Repair the failing legs
        type: agent
        # Never on the last pass: nothing would probe it, so its work would
        # be delivered unverified while costing a whole session.
        if: '{{ not .Loop.IsLast }}'
        timeout: 45m
        # An iteration *is* the retry here, and the next probe is a better
        # judge than a retry of this step's own budget would be. One session
        # per iteration, three at most.
        max_retries: 0
        prompt: |
          The cross-platform verification legs are red on this branch. This is
          the command that ran, and it failed:

              go run mage.go testrace
              LINT=$(go tool -n golangci-lint)
              for os in windows darwin linux; do GOOS=$os "$LINT" run ./...; done
          {{- if eq (index .Steps "classify").ExitCode 3 }}
              sh .vincent-issue/proof.sh
              actionlint -shellcheck= <each workflow file this branch changed>
          {{- end }}

          Its output (this is pass {{.Loop.Index}} of the repair loop):

          {{ (index .Steps "verify-probe").Result }}

          You are on branch {{.Task.BranchName}}, based on
          {{.Task.BaseBranch}}, in a dedicated worktree at
          {{.Worktree.Path}}. The change under repair is the one described in
          `.vincent-issue/brief.md`; the original issue is in
          `.vincent-issue/issue.json`.

          Say what you are doing as you go — this is one of at most three
          repair passes and someone may be watching it burn:

              vincent status "pass {{.Loop.Index}}: <one short line>"

          Keep the pass number in it, because the board shows only the latest
          attempt and the three passes are otherwise indistinguishable. Under
          ten words after the prefix. Name the actual fault rather than the
          activity — "race in scheduler admit, fixing the lock" beats
          "investigating". If you conclude the legs are red for a reason that
          predates this branch, say *that* in the status: it is the one finding
          that should stop a person from waiting for pass three.

          Fix the underlying cause:

          - **Do not weaken, skip, delete or `t.Skip` a test**, and do not
            relax a lint rule or add a `//nolint` to silence a finding. If a
            finding is genuinely a false positive, `nolintlint` requires the
            directive to carry a reason — write the reason, and say so in
            `.vincent-issue/pr.md` too.
          - A **race** the detector found is a real bug in the change, not
            noise. Fix the synchronisation, do not serialise the test to hide
            it.
          - A finding under `GOOS=windows` or `GOOS=darwin` is usually a
            build-tagged file the host lint never compiled. Cross-platform is
            a hard requirement (`CLAUDE.md`): platform-specific code belongs in
            `_unix.go` / `_windows.go` / `_darwin.go` / `_linux.go`.
          - Stay inside the scope the brief agreed. If the legs are red for a
            reason that predates this branch, say so plainly and fix only what
            this branch broke.
          {{- if eq (index .Steps "classify").ExitCode 3 }}
          - A red command from `proof.sh` is the change failing its own proof.
            Fix the gate or the code under it. Never edit
            `.vincent-issue/proof.sh`, skip a scenario, or lengthen a fixed
            wait to outlast a cause you have not found.
          {{- end }}

          **Commit your fix.** The next pass re-runs the legs against what is
          committed, and two files should still be true afterwards: update
          `.vincent-issue/pr.md` if this repair changed what the change does,
          and the affected page under `docs/` if it changed a documented claim.
          A documentation audit already ran on the code you are repairing, so
          anything you make stale here is stale for good.

          Never stage or commit `.vincent-issue/`.
        # Cheap, and deliberately not a re-run of the legs — that is the next
        # iteration's job, and paying for it twice is what makes a repair loop
        # expensive. This only asserts the repair left the worktree in a state
        # the probe can judge: committed, scratch untracked, and still building.
        check: >
          ! git ls-files .vincent-issue | grep -q . &&
          git diff --quiet &&
          git diff --cached --quiet &&
          test "$(git rev-list --count origin/{{.Task.BaseBranch}}..HEAD)" -gt 0 &&
          go build ./...
        check_timeout: 5m

  - id: verify-final
    name: Refuse an unverified branch
    type: command
    shell: sh
    timeout: 1m
    max_retries: 0
    # A loop that runs out of iterations *succeeds* — only exceeding
    # `max_iterations` blocks (§7.8) — so the loop cannot be the assertion.
    # This is. `.Steps` resolves a repeated id to its latest iteration, so the
    # guard reads the fourth probe, the one no repair ran after.
    #
    # False guard ⇒ skipped ⇒ the workflow carries on, which is the green path.
    if: '{{ ne (index .Steps "verify-probe").ExitCode 0 }}'
    # The probe's output is not interpolated here on purpose: it is compiler and
    # linter text, full of quotes and backticks, and rendering it into a shell
    # script is how a diagnostic becomes a syntax error. It is already in the
    # transcript under `verify-probe`, which is where you read it.
    #
    # The status is the same restraint applied to the board: a short line
    # saying the branch was refused and where the failure is written down. It
    # deliberately does not try to summarise the compiler output either.
    run: |
      say() { vincent status -- "$*" >/dev/null 2>&1 || true; }

      say "legs still red after 3 repair passes: see the last verify-probe run"
      echo "the cross-platform legs are still red after three repair passes." >&2
      echo "read the last 'verify-probe' run in this task's transcript for the failure." >&2
      exit 1

  - id: deliver
    name: Hand over the verified branch
    type: command
    shell: sh
    timeout: 5m
    # Pure bookkeeping on local files, so a second attempt is the same attempt.
    max_retries: 0
    # The end of the run, and the whole of what this workflow delivers: a
    # committed, verified branch and a **delivery record** saying it is ready
    # for a pull request. Nothing here pushes, opens or merges anything — that
    # is no longer this workflow's job. `github-iterate-work` stacks every
    # delivered branch of a run into one merge train, opens one pull request
    # for it and merges it; a person running this workflow on its own opens
    # the pull request from the task (§13.2 `…/github/pull/create`) with the
    # title and body the record carries.
    #
    # The record lives in the repository's **common** git directory, not in
    # this worktree and not under `--git-path`: `--git-path` resolves inside a
    # linked worktree's own gitdir, which no other task can find, while every
    # worktree of the project shares the common one. One directory per task,
    # named by the task id, so the reader asks for exactly the tasks it
    # created and never globs for someone else's:
    #
    #     <common>/vincent-delivered/<task id>/
    #       branch         this task's branch name
    #       head.sha       the commit the verification above judged
    #       base           the branch it was cut from
    #       github-issue   the GitHub issue number it resolves
    #       pr-title.txt   the plain-language title `implement` wrote
    #       pr.md          the pull request body, with its `Closes #N` / `Part of #N`
    #       brief.md       what the change is for — a conflict resolver's best input
    #       docs.md        the documentation audit, when it ran
    #       proof.txt      present only when the change shipped without automated proof
    #       delivered-at   written last: the record is complete once it exists
    #
    # `head.sha` pins the delivery to what was verified. A follow-up that moves
    # the branch afterwards is not silently swept into a merge train; the
    # reader takes this commit and says so when the branch has moved on.
    #
    # `.vincent-issue/` is removed last, after its contents are copied out, so
    # the finished task leaves a clean worktree and archiving it does not warn.
    run: |
      set -e
      say() { vincent status -- "$*" >/dev/null 2>&1 || true; }

      say "checking {{.Task.BranchName}} is committed and ahead of the base"
      if ! git diff --quiet || ! git diff --cached --quiet; then
        say "uncommitted changes: nothing was delivered"
        echo "the worktree has uncommitted changes; only a committed branch is delivered:" >&2
        git status --short >&2
        exit 1
      fi
      if git ls-files .vincent-issue | grep -q .; then
        say ".vincent-issue/ is committed: nothing was delivered"
        echo ".vincent-issue/ is tracked on this branch; scratch must never be committed." >&2
        exit 1
      fi
      ahead=$(git rev-list --count origin/{{.Task.BaseBranch}}..HEAD)
      if [ "$ahead" -eq 0 ]; then
        say "no commits past origin/{{.Task.BaseBranch}}: nothing to deliver"
        echo "{{.Task.BranchName}} has no commits past origin/{{.Task.BaseBranch}}." >&2
        exit 1
      fi
      for f in pr-title.txt pr.md brief.md; do
        test -s ".vincent-issue/$f" || {
          say ".vincent-issue/$f is missing: nothing was delivered"
          echo ".vincent-issue/$f is missing or empty; the delivery record needs it." >&2
          exit 1; }
      done

      common=$(git rev-parse --path-format=absolute --git-common-dir)
      out="$common/vincent-delivered/{{.Task.ID}}"
      head=$(git rev-parse HEAD)
      say "recording the delivery of $(printf '%s' "$head" | cut -c1-7)"

      rm -rf "$out"
      mkdir -p "$out"
      printf '%s\n' "{{.Task.BranchName}}" > "$out/branch"
      printf '%s\n' "$head" > "$out/head.sha"
      printf '%s\n' "{{.Task.BaseBranch}}" > "$out/base"
      printf '%s\n' '{{ index .Task.Fields "github_issue" }}' > "$out/github-issue"
      cp .vincent-issue/pr-title.txt .vincent-issue/pr.md .vincent-issue/brief.md "$out/"
      if [ -s .vincent-issue/docs.md ]; then cp .vincent-issue/docs.md "$out/"; fi

      # The two escape hatches stay loud past the end of the run: a fix with no
      # observed-red test and a CI change with no local proof are carried into
      # the record, and from there into the merge train's pull request.
      : > "$out/proof.txt"
      if [ -f .vincent-issue/red-test.txt ]; then
        case "$(head -n 1 .vincent-issue/red-test.txt)" in
          none:*) printf 'NO AUTOMATED REPRODUCTION: %s\n' "$(head -n 1 .vincent-issue/red-test.txt | sed 's/^none:[[:space:]]*//')" >> "$out/proof.txt" ;;
        esac
      fi
      if [ -f .vincent-issue/proof.lines ]; then
        case "$(head -n 1 .vincent-issue/proof.lines)" in
          none:*) printf 'NO LOCAL PROOF: %s\n' "$(head -n 1 .vincent-issue/proof.lines | sed 's/^none:[[:space:]]*//')" >> "$out/proof.txt" ;;
        esac
      fi
      [ -s "$out/proof.txt" ] || rm -f "$out/proof.txt"

      date -u +%Y-%m-%dT%H:%M:%SZ > "$out/delivered-at"
      rm -rf .vincent-issue

      echo "delivered: {{.Task.BranchName}} at $head"
      echo "           $ahead commit(s) past origin/{{.Task.BaseBranch}}, verified, not pushed"
      echo "title:     $(cat "$out/pr-title.txt")"
      echo "record:    $out"
      if [ -f "$out/proof.txt" ]; then
        echo
        cat "$out/proof.txt"
      fi
      echo
      echo "ready for a pull request against {{.Task.BaseBranch}}. github-iterate-work"
      echo "picks this up into its merge train; on its own, open the pull request"
      echo "from this task with the title and body in the record."
      say "ready for a PR: $(printf '%s' "$head" | cut -c1-7), $ahead commit(s)"

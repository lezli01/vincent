name: Bug report
description: Something doesn't work as specified or expected
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: vincent version
      placeholder: output of `vincent version`
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Windows 11, macOS 15, Ubuntu 24.04
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Daemon log excerpts or step transcripts, if applicable.
      render: text

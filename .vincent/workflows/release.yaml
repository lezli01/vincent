# release — review the Release Please PR and verify every distribution channel.
#
# Release Please owns the changelog, version, tag, and GitHub release. The tag
# it creates triggers `.github/workflows/release.yml`; GoReleaser then uploads
# signed artifacts and updates the stable Homebrew cask. This workflow performs
# the maintainer checks and waits for that automation. It never creates a tag or
# builds an artifact locally.
#
# Requires: `gh` authenticated with push access, `git`, `go`, and `jq`.
# POSIX-only: command steps use `sh`.
name: release
description: Review and merge the Release Please PR, then verify GitHub artifacts and Homebrew.

defaults:
  agent: claude
  max_retries: 1
  timeout: 30m
  on_input: deny

steps:
  - id: preflight
    name: Find the Release Please PR
    type: command
    shell: sh
    timeout: 10m
    max_retries: 0
    run: |
      set -e
      for tool in gh git go jq; do
        command -v "$tool" >/dev/null 2>&1 || { echo "$tool is required" >&2; exit 1; }
      done
      gh auth status >/dev/null 2>&1 || { echo "gh is not authenticated" >&2; exit 1; }

      for file in release-please-config.json .release-please-manifest.json \
        .github/workflows/release-please.yml .github/workflows/release.yml \
        .goreleaser.yaml; do
        [ -f "$file" ] || { echo "missing $file" >&2; exit 1; }
      done

      old=$(jq -er '."."' .release-please-manifest.json)
      case "$old" in
        [0-9]*.[0-9]*.[0-9]*) ;;
        *) echo "manifest version is not semver: $old" >&2; exit 1 ;;
      esac

      repo=$(gh repo view --json nameWithOwner --jq .nameWithOwner)
      pr=$(gh pr list \
        --base "$VINCENT_BASE_BRANCH" \
        --state open \
        --label "autorelease: pending" \
        --json number,title,url,headRefName \
        --jq '.[0] // empty')
      [ -n "$pr" ] || {
        echo "no open Release Please PR targets $VINCENT_BASE_BRANCH" >&2
        echo "push a releasable Conventional Commit or run the Release Please workflow" >&2
        exit 1
      }

      mkdir -p .vincent-release
      printf '%s\n' "$old" > .vincent-release/old-version.txt
      printf '%s\n' "$repo" > .vincent-release/repo.txt
      printf '%s\n' "$pr" > .vincent-release/pr.json

      number=$(printf '%s' "$pr" | jq -r .number)
      echo "repository:   $repo"
      echo "last release: v$old"
      echo "release PR:   $(printf '%s' "$pr" | jq -r '.title + " — " + .url')"
      echo
      echo "current checks:"
      gh pr checks "$number" || true

  - id: vuln
    name: Run the vulnerability sweep
    type: command
    shell: sh
    timeout: 20m
    run: go run mage.go vuln

  - id: review
    name: Review and merge the release PR
    type: manual
    instructions: |
      This is the release gate. Nothing in this task creates a tag.

      {{(index .Steps "preflight").Result}}

      Open the Release Please PR and verify:

      1. Its proposed version follows `CHANGELOG.md`'s pre-1.0 policy.
      2. Its generated changelog includes every user-visible change and folds
         in any remaining legacy `[Unreleased]` prose.
      3. All three `ci` and all three `gates` checks are green.
      4. `RELEASE_PLEASE_TOKEN` and `HOMEBREW_TAP_TOKEN` are configured as
         described in `RELEASING.md`.

      Merge the PR, then approve this step. Release Please will create the tag
      and GitHub release; that tag starts GoReleaser and the Homebrew update.
      Reject to stop before publishing anything.

  - id: publish
    name: Wait for Release Please and GoReleaser
    type: command
    shell: sh
    timeout: 60m
    max_retries: 0
    run: |
      set -e
      old=$(cat .vincent-release/old-version.txt)
      repo=$(cat .vincent-release/repo.txt)
      number=$(jq -r .number .vincent-release/pr.json)

      state=$(gh pr view "$number" --json state --jq .state)
      [ "$state" = MERGED ] || {
        echo "release PR #$number is $state, not MERGED" >&2
        exit 1
      }

      echo "waiting for Release Please to advance the manifest from $old"
      new=""
      i=0
      while [ "$i" -lt 60 ]; do
        new=$(gh api \
          -H "Accept: application/vnd.github.raw+json" \
          "repos/$repo/contents/.release-please-manifest.json?ref=$VINCENT_BASE_BRANCH" \
          2>/dev/null | jq -r '."." // empty')
        [ -n "$new" ] && [ "$new" != "$old" ] && break
        i=$((i + 1))
        sleep 10
      done
      [ -n "$new" ] && [ "$new" != "$old" ] || {
        echo "Release Please did not advance the manifest within 10 minutes" >&2
        exit 1
      }

      tag="v$new"
      printf '%s\n' "$tag" > .vincent-release/tag.txt
      echo "Release Please created $tag; waiting for the Release workflow"

      run_id=""
      run_url=""
      i=0
      while [ "$i" -lt 60 ]; do
        run=$(gh run list \
          --workflow=release.yml \
          --event=push \
          --limit 30 \
          --json databaseId,headBranch,url \
          --jq "[.[] | select(.headBranch == \"$tag\")] | .[0] // empty")
        if [ -n "$run" ]; then
          run_id=$(printf '%s' "$run" | jq -r .databaseId)
          run_url=$(printf '%s' "$run" | jq -r .url)
          break
        fi
        i=$((i + 1))
        sleep 10
      done
      [ -n "$run_id" ] || {
        echo "no Release workflow run appeared for $tag within 10 minutes" >&2
        exit 1
      }

      printf '%s\n' "$run_url" > .vincent-release/run-url.txt
      gh run watch "$run_id" --exit-status
      echo "$tag published: $run_url"

  - id: verify
    name: Verify GitHub and Homebrew
    type: command
    shell: sh
    timeout: 15m
    max_retries: 0
    run: |
      set -e
      tag=$(cat .vincent-release/tag.txt)
      version=${tag#v}

      release=$(gh release view "$tag" \
        --json isDraft,isPrerelease,url,assets)
      [ "$(printf '%s' "$release" | jq -r .isDraft)" = false ] || {
        echo "$tag is still a draft" >&2
        exit 1
      }

      names=$(printf '%s' "$release" | jq -r '.assets[].name')
      printf '%s\n' "$names" | grep -qx checksums.txt || {
        echo "$tag has no checksums.txt" >&2
        exit 1
      }
      for target in \
        linux_amd64 linux_arm64 \
        darwin_amd64 darwin_arm64 \
        windows_amd64 windows_arm64; do
        printf '%s\n' "$names" | grep -q "_${target}\\.\(tar\\.gz\|zip\)$" || {
          echo "$tag is missing the $target archive" >&2
          exit 1
        }
      done

      if [ "$(printf '%s' "$release" | jq -r .isPrerelease)" = false ]; then
        cask=$(gh api \
          -H "Accept: application/vnd.github.raw+json" \
          "repos/lezli01/homebrew-tap/contents/Casks/vincent.rb?ref=main")
        printf '%s\n' "$cask" | grep -q "version \"$version\"" || {
          echo "Homebrew cask does not report $version" >&2
          exit 1
        }
        echo "Homebrew cask is at $version"
      else
        echo "$tag is a prerelease; Homebrew correctly remains on the stable channel"
      fi

      echo "GitHub release: $(printf '%s' "$release" | jq -r .url)"

  - id: report
    name: Report the release
    type: command
    shell: sh
    timeout: 5m
    run: |
      set -e
      tag=$(cat .vincent-release/tag.txt)
      run_url=$(cat .vincent-release/run-url.txt)
      release_url=$(gh release view "$tag" --json url --jq .url)

      echo "released: $tag"
      echo "release:  $release_url"
      echo "workflow: $run_url"
      echo "channels: GitHub artifacts verified; stable releases also verified in lezli01/homebrew-tap"

      rm -rf .vincent-release
      echo
      echo "worktree status (expect empty):"
      git status --porcelain

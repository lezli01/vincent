name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # CI runs the exact targets developers run locally (see magefile.go);
      # the only deliberate difference is the race detector.
      - name: Lint
        run: go run mage.go lint

      - name: Test (race)
        run: go run mage.go testrace

      - name: Build
        run: go run mage.go build

      - name: Smoke-test vincent version
        shell: bash
        run: ./bin/vincent* version

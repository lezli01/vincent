name: CI retry

# Reruns a CI run's failed jobs when — and only when — the failure is GitHub
# never giving a job a runner (2026-11-17). On the hosted macOS arm64 pool that
# happens often enough to have been most of CI's red: the job queues for
# 15-30 min and is cancelled with "The job was not acquired by Runner of type
# hosted even after multiple attempts", having run nothing. A rerun is the
# whole fix, and it was being done by hand.
#
# Nothing else is retried. A job that got a runner and failed is a result,
# and `testci` already reruns flaky tests inside the job (CLAUDE.md); rerunning
# it here would hide a real failure behind a second roll. Two automatic
# reruns at most: a pool that is down for an hour should stay visibly red.
#
# workflow_run runs the copy of this file on the default branch, so it takes
# effect once merged, for pull requests from forks too.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: write
  checks: read

jobs:
  rerun:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Rerun jobs that never got a runner
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          # A job GitHub never acquired has no runner and ran no step.
          ids="$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/attempts/$ATTEMPT/jobs?per_page=100" \
            --jq '.jobs[] | select((.conclusion == "cancelled" or .conclusion == "failure")
                                   and (.runner_name // "") == "" and (.steps | length) == 0) | .id')"
          if [ -z "$ids" ]; then
            echo "every failed job had a runner; nothing to retry"
            exit 0
          fi
          # Confirm the reason from the annotation rather than inferring it
          # from the shape alone: a job cancelled before it was queued (a
          # newer push superseding the run) looks the same.
          unacquired=""
          for id in $ids; do
            msgs="$(gh api "repos/$GITHUB_REPOSITORY/check-runs/$id/annotations" --jq '.[].message')"
            case "$msgs" in
              *"was not acquired by Runner"*) unacquired="$unacquired $id" ;;
            esac
          done
          if [ -z "$unacquired" ]; then
            echo "no job failed for want of a runner; nothing to retry"
            exit 0
          fi
          echo "never acquired a runner:$unacquired — rerunning the failed jobs of run $RUN_ID (attempt $ATTEMPT)"
          gh run rerun "$RUN_ID" --failed --repo "$GITHUB_REPOSITORY"
          {
            echo "### CI retry"
            echo "Run $RUN_ID attempt $ATTEMPT: jobs$unacquired never got a hosted runner; reran its failed jobs."
          } >> "$GITHUB_STEP_SUMMARY"

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  packaging-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The release workflow is tag-only, so a malformed package-manager
      # stanza would otherwise be discovered after the release already exists.
      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: check

  # The Pages site (task 131 decision 5): build this ref with the deploy's
  # pinned builder and assemble it as `dev`, so a Liquid or Jekyll break, or
  # an assembler regression, fails the pull request rather than the deploy
  # that runs after the merge (.github/workflows/pages.yml).
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: scripts/site

      - name: Build and assemble the site as dev
        env:
          PAGES_REPO_NWO: ${{ github.repository }}
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/site/build.sh . "$RUNNER_TEMP/built/dev" dev
          go run ./cmd/sitever assemble -in "$RUNNER_TEMP/built" -out "$RUNNER_TEMP/site"

  ci:
    runs-on: ${{ matrix.os }}
    # Wide enough that `go test -timeout` (see magefile.go) is always the
    # tighter of the two limits: a package that really hangs should be reported
    # by the test binary's goroutine dump, not killed here with nothing to read.
    # The Windows leg under the race detector is the one this is sized for.
    # `go test -timeout` is per test binary, but this caps the whole job, and
    # the suite runs its packages concurrently: on master the Windows race
    # step alone takes ~25 minutes (internal/api ~13 of them, internal/taskrun
    # ~11), so a 30-minute cap cancelled any run on a slower runner with no
    # FAIL line at all — go test holds every later package's output until
    # internal/api reports, which made the log look hung after
    # internal/agent/cursor.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # CI runs the exact targets developers run locally (see magefile.go);
      # the deliberate differences are the race detector and, in testraceci,
      # gotestsum rerunning failed tests (up to twice each) and reporting
      # them (#736). A rerun that passes does not red the job, so every
      # rerun is listed in the job summary instead, and the reports below
      # carry each test's elapsed time for trend tracking. Lint is the third:
      # CI runs lintall, the all-platform form of lint, on one leg only.
      #
      # Lint runs once, on the Linux leg, for linux, darwin and windows (#727).
      # The repository has no cgo, so linting with GOOS set sees exactly the
      # files a native run on that OS would — a finding in a `_windows.go`
      # file still fails this step. The ubuntu leg is not the critical path
      # (Windows is), so the minutes the other two legs spent linting come
      # off the wall clock. It stays a step of this required `ci` job rather
      # than a job of its own, which would not be a required check and so
      # would not block a merge on a red lint.
      - name: Lint (linux, darwin, windows)
        if: matrix.os == 'ubuntu-latest'
        run: go run mage.go lintall

      - name: Test (race)
        run: go run mage.go testraceci
        # The tests' wait budgets are sized for a quiet machine; the Windows
        # race leg is not one (#731). This factor stretches every wait in
        # internal/testutil/wait, the API client's REST timeout and the
        # `daemon start` health poll the e2e tests drive. Empty elsewhere,
        # which the helpers read as 1.
        env:
          VINCENT_TEST_TIMEOUT_SCALE: ${{ matrix.os == 'windows-latest' && '3' || '' }}

      # always(): a red suite is the run whose reports matter most.
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-${{ matrix.os }}
          path: bin/test-report/
          if-no-files-found: warn

      - name: Build
        run: go run mage.go build

      - name: Smoke-test vincent version
        shell: bash
        # The glob is how one line finds bin/vincent.exe on Windows and
        # bin/vincent elsewhere, so it is a command name on purpose.
        run: |
          # shellcheck disable=SC2211
          ./bin/vincent* version

  # Acceptance gates (spec §19). One job per OS, not one per gate: each script
  # is self-isolating — its own `mktemp -d` state dirs via VINCENT_CONFIG_DIR /
  # VINCENT_DATA_DIR, its own ephemeral port read from daemon.json, its own
  # `trap cleanup EXIT` — so sequencing them shares one checkout and one
  # toolchain setup instead of paying for three. The gates themselves run in
  # seconds; the setup they each repeated was the larger cost. Failure
  # attribution survives because every gate is still its own named step.
  gates:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # M1: the scripted curl flow against the fake agent.
      - name: M1 gate (fake agent)
        shell: bash
        run: ./scripts/m1-gate.sh

      # M2: multi-step workflow with an input round-trip, hard-kill recovery,
      # and cap stress — all against the fake agent.
      - name: M2 gate (fake agent)
        shell: bash
        run: ./scripts/m2-gate.sh

      # M5: a cursor workflow runs to completion, a stderr-only failure stays
      # diagnosable, an unauthenticated CLI is flagged, and a restricted step is
      # refused rather than downgraded. Scenario 4 is the reason this runs on
      # all three OSes rather than one: the refusal is only real on Windows, and
      # "restricted simply runs" is only real off it.
      - name: M5 gate (fake agent)
        shell: bash
        run: ./scripts/m5-gate.sh

      # M6: parallel step groups and workflow fan-out (task 014). It runs on
      # all three OSes because the merge half is where platform differences
      # actually bite — git's behaviour on Windows is the thing a gate should
      # prove rather than assume.
      - name: M6 gate (parallel and fan-out)
        shell: bash
        run: ./scripts/m6-gate.sh

      # M7: conditions between steps (task 015). Guards, condition steps and
      # allow_failure are pure control flow, so the value of the three-OS
      # matrix here is the shell: every `run:` body is written to be accepted
      # by /bin/sh and pwsh alike, and Windows is what proves it.
      - name: M7 gate (conditions)
        shell: bash
        run: ./scripts/m7-gate.sh

      # M8: loops (task 016). Every `run:` body is `exit N` or `git …`, the
      # same restricted vocabulary m7 uses, so the three-OS matrix is proving
      # the shell as much as the feature. Scenario 8 is the one that most
      # needs Windows: it hard-kills the daemon and asserts the loop resumes
      # mid-iteration, and the kill path is `taskkill` there and SIGKILL
      # everywhere else.
      - name: M8 gate (loops)
        shell: bash
        run: ./scripts/m8-gate.sh

      # M9: workflow includes (task 019). Command steps only, with `run:`
      # bodies in the same restricted `exit N` / `git …` vocabulary m7 and m8
      # use, so the three-OS matrix proves the shell as much as the feature.
      # Scenario 1 is the one that most needs Windows: it asserts the exact
      # multi-line step order and provenance chain, which is where jq's CRLF
      # bites (the m8 finding).
      - name: M9 gate (includes)
        shell: bash
        run: ./scripts/m9-gate.sh

      # M10: the daemon's MCP server (task 057, §13.4). The client is curl
      # speaking streamable HTTP, so the three-OS matrix proves the SSE frame
      # parsing as much as the feature — the `data:` lines are CRLF-delimited
      # by the spec, which is exactly the class of thing that passes on Linux
      # and fails on Windows. One leg runs the fake agent's `mcp-callback`
      # scenario as the claude CLI (task 057.9): the step reads the endpoint
      # its argv was wired to and calls back over `/mcp/step/{run_id}` before
      # and after `awaiting_input` — a second MCP client, whose own CRLF
      # handling and config path Windows tests too.
      - name: M10 gate (MCP)
        shell: bash
        run: ./scripts/m10-gate.sh

      # M11: editing the daemon configuration through the API (task 060,
      # §12.3). The three-OS matrix earns its place twice here — the write is
      # an atomic rename over an open-ish file, which behaves differently on
      # Windows, and the 0600 assertion is POSIX-only and says so rather than
      # pretending Windows has a mode.
      - name: M11 gate (configuration)
        shell: bash
        run: ./scripts/m11-gate.sh

      # M12: container step execution (task 061, §16). The only gate that is
      # not proven on all three platforms, and the reason is stated rather than
      # implied: the macOS and Windows runners have no docker daemon, so the
      # script skips itself there (exit 0, one line saying why) and the real
      # assertions only ever run on this leg. A containerized task is refused
      # outright on a Windows daemon anyway (decision 2), but macOS is a
      # supported host that CI cannot exercise — a gate that has never run on a
      # platform is not known to pass there.
      - name: M12 gate (containers)
        shell: bash
        run: ./scripts/m12-gate.sh

      # M13: authoring a workflow through the API (task 065, §8.2, §13.2).
      # The three-OS matrix is the point of this one: the line-oriented
      # writer has to hold its byte-identity guarantee against CRLF files and
      # backslash paths, and the project scope is a repo path the gate builds
      # on the host it runs on.
      - name: M13 gate (workflow editor)
        shell: bash
        run: ./scripts/m13-gate.sh

      # M14: a chat end to end (task 067, closing 063.2; §5.5, §11, §13.2,
      # §13.3). The three-OS matrix earns its keep here too: a chat's whole
      # premise is an agent CLI resuming a session it wrote to disk, and the
      # per-chat SSE stream and the transcript route are read back with the
      # platform's own line endings.
      #
      # Leg 12 (task 124.15, §9.1–§9.3, §9.7) gives the Windows leg an
      # assertion of its own: under Git Bash, MSYS rewrites an argv beginning
      # with `/name` into a Windows path before a native .exe sees it, so
      # `printf '/gate-skill hi' | vincent chat send --message-file -` has to
      # store the prompt byte for byte — which is the guarantee
      # `--message-file` exists to give, and only this runner can disprove it.
      # Linux and macOS carry the rest of the leg: each adapter's own skill
      # listing against the fake, the directory the list is about, and the
      # invocation a claude turn reports back.
      - name: M14 gate (chats end to end)
        shell: bash
        run: ./scripts/m14-gate.sh

      # M15: archived listings and the permanent delete (task 092, issue #350;
      # §10, §13.2, §13.3). The matrix matters here because the delete reaches
      # the filesystem and git on the host: a transcript directory has to be
      # gone on all three, and §10's "a branch with commits is kept" is a
      # `git rev-list` answer read back through the platform's own line
      # endings.
      - name: M15 gate (archived boards and delete)
        shell: bash
        run: ./scripts/m15-gate.sh

      # M16: event triggers (task 096; §12.3, §13.2, §13.3, §16). The poll
      # command is a real executable run directly, never through a shell, so
      # Windows is where "argv, not a command line" is proven — along with the
      # registry's live reload of files the gate writes, a cursor handed back
      # through a child's environment, and an HMAC over bytes that must reach
      # the daemon exactly as they were signed.
      - name: M16 gate (event triggers)
        shell: bash
        run: ./scripts/m16-gate.sh

      # 123: the update-workflows built-in's global mode (task 123; §5.2,
      # §12.1, §12.2), run for real against the fake agent. The matrix
      # matters because every command step is `vincent ...` found on the
      # daemon's PATH and run under pwsh on Windows, the staged paths `apply
      # --check` prints are the host's own and are fed back to `vincent
      # workflow validate` by a loop, and "the global file was rewritten" is
      # an atomic rename over a file the registry watcher is watching.
      - name: 123 gate (global update-workflows)
        shell: bash
        run: ./scripts/123-gate.sh

      # 125: a task or chat on a branch that already exists, and in the
      # project's own checkout when that is where the branch is (task 125;
      # §10, §5.3, §18). The matrix earns its place because the whole feature
      # is git on the host: "the working directory *is* the project path" is a
      # path comparison against what git prints, which is `C:/…` on Windows
      # and `/private/var/…` on macOS, and the diverged case asserts a ref did
      # not move in a repository three git processes share.
      - name: 125 gate (run on an existing branch)
        shell: bash
        run: ./scripts/125-gate.sh

      # 064: a task from a pull request, on the pull request's own head
      # branch (task 064; §10, §13.2), against a local bare repository and
      # the fake `gh`. The matrix earns its place because the whole feature is
      # git on the host: the gate hands a `C:/…` bare-repository path to `git
      # remote add`, the daemon's pwsh runs `git push` through the upstream
      # admission configured, and "no remote was added for the fork" and the
      # branch's upstream are read back through Windows' own line endings.
      - name: 064 gate (task from a pull request)
        shell: bash
        run: ./scripts/064-gate.sh

      # 052: GitHub pull requests (task 052, issue #381; §13.2). `cmd/fakegh`
      # is built as `gh.exe` on Windows and has to be found on the detached
      # daemon's PATH the way the real CLI is; `FAKEGH_PR_BRANCH` has to reach
      # the daemon through a stop/start; the argv log is written by a Go child
      # and read back through the platform's own line endings; and the
      # worktree branch a pull request's head is matched against is made by
      # git on the host.
      - name: 052 gate (GitHub pull requests)
        shell: bash
        run: ./scripts/052-gate.sh

      # 069: opening a pull request from vincent (task 069; §10, §13.2). Every
      # leg of it touches the host: the push goes to a `pushurl` that is a
      # host path (a drive-letter path on Windows), `gh` is resolved from PATH
      # to a fake built as `gh.exe` there, the pull request body reaches it on
      # stdin via `--body-file -` because argv would hit Windows' command-line
      # limit, and the argv the fake records is read back with the platform's
      # own line endings.
      - name: 069 gate (open a pull request)
        shell: bash
        run: ./scripts/069-gate.sh

      # 068: the pull request write surface (task 068.5; §13.2) — merge,
      # close, reopen, comment and re-run, through the API and the CLI,
      # against the fake `gh`. The matrix earns its place because every write
      # is a child process of the detached daemon: `gh` is resolved from its
      # PATH to a fake built as `gh.exe` on Windows, `FAKEGH_SCENARIO` has to
      # reach it across each stop/start, the comment body travels to it on
      # stdin via `--body-file -` and has to arrive byte-identical, CRLF
      # included, and the argv log it writes is read back with the platform's
      # own line endings.
      - name: 068 gate (pull request writes)
        shell: bash
        run: ./scripts/068-gate.sh

      # 130: issues end to end (task 130.17; §5.6, §13.2, §13.4) — local
      # CRUD and its events, a task from an issue, the GitHub import, state
      # write-back through the durable outbox, and the MCP guard on a forge
      # write, against the fake `gh`. The matrix earns its place because the
      # GitHub half is a child process of the detached daemon: `gh` is
      # resolved from its PATH to a fake built as `gh.exe` on Windows, the
      # corpus file it re-reads every call is rewritten by temp file and
      # rename under a reader, which Windows refuses while the file is open,
      # the outbox has to drain across a forced stop and a restart of the
      # daemon process, and the argv log and the multi-line `jq` captures
      # are read back with the platform's own line endings.
      - name: 130 gate (issues)
        shell: bash
        run: ./scripts/130-gate.sh

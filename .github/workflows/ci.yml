name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # CI runs the exact targets developers run locally (see magefile.go);
      # the only deliberate difference is the race detector.
      - name: Lint
        run: go run mage.go lint

      - name: Test (race)
        run: go run mage.go testrace

      - name: Build
        run: go run mage.go build

      - name: Smoke-test vincent version
        shell: bash
        run: ./bin/vincent* version

  # M1 acceptance (spec §19): the scripted curl flow against the fake agent.
  m1-gate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: M1 gate (fake agent)
        shell: bash
        run: ./scripts/m1-gate.sh

  # M2 acceptance (spec §19): multi-step workflow with an input round-trip,
  # hard-kill recovery, and cap stress — all against the fake agent.
  m2-gate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: M2 gate (fake agent)
        shell: bash
        run: ./scripts/m2-gate.sh

  # M5 acceptance (spec §19 M5): a cursor workflow runs to completion, a
  # stderr-only failure stays diagnosable, an unauthenticated CLI is flagged,
  # and a restricted step is refused rather than downgraded. Scenario 4 is the
  # reason this runs on all three OSes rather than one: the refusal is only
  # real on Windows, and "restricted simply runs" is only real off it.
  m5-gate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: M5 gate (fake agent)
        shell: bash
        run: ./scripts/m5-gate.sh

# Release packaging (T4.5, spec §19 M4).
#
# Cross-compiled from a single runner. modernc.org/sqlite is pure Go and no
# CGO_ENABLED appears in the magefile or CI, so a three-OS *build* matrix would
# buy nothing; the per-OS runners in release.yml exist only to smoke-test the
# artifacts this produces (X decision). That runner is macos-latest as of task
# 032 — `codesign` must run before the archives are built, and it exists
# nowhere else — but the single-runner shape the X decision chose is unchanged.
version: 2

project_name: vincent

before:
  hooks:
    - go mod download

builds:
  - id: vincent
    main: ./cmd/vincent
    binary: vincent
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    # The same three symbols the mage Build target injects, so a released
    # binary and a locally built one answer `vincent version` the same way.
    ldflags:
      - -s -w
      - -X github.com/lezli01/vincent/internal/version.version={{.Version}}
      - -X github.com/lezli01/vincent/internal/version.commit={{.ShortCommit}}
      - -X github.com/lezli01/vincent/internal/version.date={{.CommitDate}}
    mod_timestamp: "{{ .CommitTimestamp }}"
    # Developer ID signing has to happen here rather than in `signs:`, because
    # the signature lives *inside* the Mach-O: it must be applied before the
    # archive is assembled and before checksums.txt is computed, and a build
    # hook is the only point that comes early enough (task 032). A build hook
    # has no per-GOOS filter, so the script takes {{ .Os }} and no-ops for
    # linux and windows. It also no-ops, loudly, when no identity is present
    # and MACOS_SIGN_REQUIRED is unset — the fork, dry-run, and (task 039,
    # 032.7 having been dropped) stable-release path.
    hooks:
      post:
        - cmd: ./scripts/macos-sign.sh "{{ .Path }}" "{{ .Os }}"
          output: true

# cmd/fakeagent is deliberately absent: it is test scaffolding compiled by
# ./... and must never ship in a release archive.

archives:
  - id: vincent
    ids: [vincent]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - examples/*.yaml

# Native Linux packages use the same pure-Go binaries as the release archives.
# There are no maintainer scripts: vincent's service is per-user and captures
# that user's PATH and data directories, which a root package transaction must
# not guess or rewrite (task 021).
nfpms:
  - id: vincent-linux-packages
    ids: [vincent]
    package_name: vincent
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: László Szabó
    homepage: "https://github.com/lezli01/vincent"
    maintainer: "László Szabó <lezli01@gmail.com>"
    description: "Vendor-independent control plane for executing native agent tooling"
    license: MIT
    formats: [deb, rpm]
    dependencies: [git]
    bindir: /usr/bin
    section: devel
    priority: optional
    contents:
      - src: LICENSE
        dst: /usr/share/licenses/vincent/LICENSE
      - src: LICENSE
        dst: /usr/share/doc/vincent/copyright
      - src: README.md
        dst: /usr/share/doc/vincent/README.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# Homebrew tap (macOS only), docs/tasks/002. This was the first reversal of the
# X decision's "GitHub Releases only" line; task 021 now widens that reversal
# to Windows and Linux. Its cost is exactly what X named: a second repo
# (lezli01/homebrew-tap) and a release-time publish step. It is a *cask*, not a
# formula, because goreleaser deprecated
# `brews` in v2.10 and Homebrew now packages pre-built binaries as casks;
# formulas are for things brew builds from source.
#
homebrew_casks:
  - name: vincent
    ids: [vincent]
    binaries: [vincent]
    repository:
      owner: lezli01
      name: homebrew-tap
      branch: main
      # Not GITHUB_TOKEN: that token is scoped to this repo and cannot push to
      # the tap. release.yml supplies a PAT with contents:write on the tap.
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/lezli01/vincent"
    description: "Vendor-independent control plane for executing native agent tooling"
    license: MIT
    # An rc tag must not move the cask users install; goreleaser's `auto`
    # skips the push whenever the release is a prerelease.
    skip_upload: auto
    url:
      # Lets `brew audit` accept a homepage whose domain differs from the
      # download host.
      verified: github.com/lezli01/vincent/
    commit_author:
      name: goreleaser
      email: goreleaser@users.noreply.github.com
    commit_msg_template: "chore: vincent {{ .Tag }}"
    # brew installs from the same archive GitHub Releases serves, and Homebrew
    # quarantines what it downloads: an unsigned quarantined binary does not
    # start. Task 032 deleted this hook because notarization made it a bypass of
    # protection that had been paid for — but the Apple Developer Program was
    # never bought and 032.7 is dropped (task 039), so the archive is unsigned
    # again and the hook is load-bearing again. Delete it in the same change that
    # ever installs the certificates: with a notarized binary it goes straight
    # back to bypassing a real check.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/vincent"]
          end
    # `vincent service install` writes a LaunchAgent (internal/service:
    # LaunchdName). Without this, `brew uninstall` would delete the binary out
    # from under a still-loaded launchd job that holds the SQLite file open.
    uninstall:
      launchctl: [dev.lezli01.vincent]
    # Both dirs from internal/config.ResolveDirs on darwin — data lives inside
    # the config dir there, so the one path covers config.yaml, the database
    # and the transcripts. zap only runs on `brew uninstall --zap`, which is
    # what makes it safe to name a directory holding task history.
    zap:
      trash:
        - ~/Library/Application Support/vincent
        - ~/Library/LaunchAgents/dev.lezli01.vincent.plist
    caveats: |
      vincent runs coding agents FULL-AUTO by default: an agent can run
      arbitrary commands as you. Per-task git worktrees isolate collisions
      between tasks, not privileges. See the README's security section.

      Start the daemon in the background and keep it across reboots with:
        vincent service install

# Windows package-manager manifests consume the same signed, checksummed zip
# archives as GitHub Releases. Stable releases update our Scoop bucket and
# submit a versioned branch from our winget-pkgs fork to Microsoft's catalog;
# prereleases render the manifests in dist but do not move either channel.
scoops:
  - name: vincent
    homepage: "https://github.com/lezli01/vincent"
    description: "Vendor-independent control plane for executing native agent tooling"
    license: MIT
    depends: [git]
    skip_upload: auto
    repository:
      owner: lezli01
      name: scoop-bucket
      branch: main
      token: "{{ .Env.SCOOP_BUCKET_TOKEN }}"
    commit_author:
      name: goreleaser
      email: goreleaser@users.noreply.github.com
    commit_msg_template: "chore: vincent {{ .Tag }}"

winget:
  - name: vincent
    ids: [vincent]
    publisher: László Szabó
    package_identifier: lezli01.Vincent
    package_name: vincent
    default_locale: en-US
    short_description: "Vendor-independent control plane for native coding-agent CLIs"
    description: >-
      Vincent runs Claude Code, Codex, and Cursor CLI workflows in isolated git
      worktrees, with a local daemon, terminal UI, audit transcripts, and gates.
    license: MIT
    license_url: "https://github.com/lezli01/vincent/blob/{{ .Tag }}/LICENSE"
    homepage: "https://github.com/lezli01/vincent"
    publisher_url: "https://lezli01.is-a.dev"
    publisher_support_url: "https://github.com/lezli01/vincent/issues"
    author: László Szabó
    copyright: "Copyright © 2026 László Szabó"
    release_notes_url: "https://github.com/lezli01/vincent/releases/tag/{{ .Tag }}"
    installation_notes: >-
      Vincent requires at least one supported agent CLI. Agents run full-auto
      by default; read the security model before the first task. Releases are
      not Authenticode-signed, so Windows may show SmartScreen on first launch.
    tags: [ai, automation, cli, developer-tools, orchestration]
    dependencies:
      - package_identifier: Git.Git
    skip_upload: auto
    repository:
      owner: lezli01
      name: winget-pkgs
      branch: "vincent-{{ .Version }}"
      token: "{{ .Env.WINGET_TOKEN }}"
      pull_request:
        enabled: true
        draft: false
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master
    commit_author:
      name: goreleaser
      email: goreleaser@users.noreply.github.com
    commit_msg_template: "{{ .PackageIdentifier }}: {{ .Tag }}"

# Keyless cosign: an OIDC identity from the workflow itself, verifiable
# without vincent publishing or rotating a key. This is the supply-chain
# signature, and it is the *only* signature a released artifact is guaranteed to
# carry: OS code signing on both macOS and Windows is a recurring purchase this
# project has not made (task 039). Apple's Developer ID signature, when the
# certificates are configured, says who built the binary to *macOS*; cosign and
# the build attestation say which workflow and commit produced the file to
# *anyone*, always. The README documents the Gatekeeper and SmartScreen prompts
# a user meets on an unsigned release.
signs:
  - cmd: cosign
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

snapshot:
  version_template: "{{ incpatch .Version }}-next"

# Grouped by Conventional Commit type and stripped of commit hashes, because the
# defaults render one flat list where every line opens with a 40-char SHA —
# accurate, and unreadable as release notes (see the v0.1.0 notes). CHANGELOG.md
# carries the curated prose; this is the generated index of what landed between
# two tags. Note that `groups`, `sort` and `abbrev` all require `use: github`
# rather than `github-native`, which disables every formatting feature.
changelog:
  use: github
  sort: asc
  abbrev: -1 # drop the commit hash; the subject is the information
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Other changes
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - Merge pull request

release:
  draft: false
  prerelease: auto
  # Release Please creates the GitHub release before this tag-triggered build
  # starts. Preserve its notes while attaching the archives, signatures, and
  # checksums. Reruns replace only colliding assets.
  mode: keep-existing
  replace_existing_artifacts: true
  footer: |
    ## Verifying a download

    ```sh
    cosign verify-blob checksums.txt \
      --certificate checksums.txt.pem \
      --signature checksums.txt.sig \
      --certificate-identity-regexp 'https://github.com/lezli01/vincent/.*' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com
    sha256sum -c checksums.txt --ignore-missing
    ```

    First launch prompts on macOS and on Windows: these releases carry cosign
    signatures and build attestations, not OS code signing. Apple's Developer
    Program and an Authenticode certificate are both recurring purchases this
    project has not made.

    On macOS, clear the quarantine attribute the browser set, once per download:

    ```sh
    xattr -d com.apple.quarantine vincent
    ```

    `vincent_*_darwin_universal.pkg` installs the same binary, universal for
    both architectures, to `/usr/local/bin`. It is unsigned, so open it with
    right-click → *Open* rather than a double-click, or install it without
    Finder:

    ```sh
    sudo installer -pkg vincent_*_darwin_universal.pkg -target /
    ```

    The `.pkg` is not in `checksums.txt` — it is built after the checksums are
    computed — so verify it with its build attestation:

    ```sh
    gh attestation verify vincent_*_darwin_universal.pkg --repo lezli01/vincent
    ```

    On Windows, SmartScreen offers *More info → Run anyway*, once per binary.
